name: Manual SSH Deploy to VM

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
          VM_DEPLOY_PATH: ${{ secrets.VM_DEPLOY_PATH }}
          VM_PORT: ${{ vars.VM_PORT || '22' }}
        run: |
          # Check that secrets are set
          if [ -z "$VM_HOST" ] || [ -z "$VM_USER" ] || [ -z "$VM_SSH_KEY" ] || [ -z "$VM_KNOWN_HOSTS" ] || [ -z "$VM_DEPLOY_PATH" ]; then
            echo "⚠️  VM deployment secrets not configured"
            echo "Please set VM_HOST, VM_USER, VM_SSH_KEY, VM_KNOWN_HOSTS, and VM_DEPLOY_PATH"
            exit 1
          fi

          # Set up SSH key
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/vm_key
          chmod 600 ~/.ssh/vm_key
          printf '%s\n' "$VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # Deploy via SSH
          echo "📦 Connecting to VM and deploying..."
          ssh -p "$VM_PORT" -i ~/.ssh/vm_key "$VM_USER@$VM_HOST" \
            "cd '$VM_DEPLOY_PATH' && bash deploy-to-vm.sh" || {
            echo "⚠️  SSH deployment failed"
            echo "Ensure your VM has:"
            echo "  1. Git repository cloned at: $VM_DEPLOY_PATH"
            echo "  2. deploy-to-vm.sh in the repo"
            echo "  3. Systemd service pluto-slider-server running"
            exit 1
          }

          echo "✅ Deployment complete"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment to VM failed"
          echo "Check GitHub secrets and VM connectivity"
