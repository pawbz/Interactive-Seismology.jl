text_representation = """<div class=\"pluto-docs-binding\">\n<span id=\"selected_earthquake_details\">selected_earthquake_details</span>\n<div class=\"markdown\"><p>Every dispatch from the widget that follows an earthquake selection &#40;<code>st-search</code>, <code>st-select</code>, <code>download</code>&#41; also echoes back that earthquake&#39;s own fields &#40;<code>eqlat</code>, <code>eqlon</code>, ...&#41; alongside its own – checking <code>haskey&#40;sex, &quot;eqtime&quot;&#41;</code> directly &#40;rather than enumerating every action name that carries it&#41; means this stays correct as new actions get added, instead of quietly reverting to &quot;none yet&quot; the way a forgotten action name once did. Pluto cells can&#39;t be self-referential &#40;there&#39;s no way to read this variable&#39;s <em>previous</em> value from inside its own definition&#41;, so the widget re-sending the earthquake fields on every action is what lets this stay a plain, stateless, input-only computation instead of needing a mutable <code>Ref</code>.</p>\n\n\n</div>\n</div>\n"""

