text_representation = """<div class=\"markdown\"><h1 id=\"My-First-Seismogram\">My First Seismogram</h1>\n<p>A seismogram is what one station recorded during one earthquake – which means <em>getting</em> one is really three decisions: <strong>which earthquake</strong>, <strong>which station</strong>, and <strong>how to look at the recording</strong> &#40;how long a window, which frequencies&#41;. This notebook walks through exactly those three steps, downloading real data from live earthquake and seismic-network catalogs at each one.</p>\n<div class=\"admonition note\"><p class=\"admonition-title\">Data sources</p><p>Earthquake catalogs and station/waveform data live in different places these days: the earthquake catalog below comes from the <strong>USGS</strong> FDSN event service, and the station metadata &#43; waveforms come from <strong>EarthScope</strong> &#40;the network formerly known as the IRIS Data Management Center&#41; – see the Appendix&#39;s <code>event_client</code>/<code>waveform_client</code> split for why a single shared client no longer works for both.</p>\n</div>\n<h5 id=\"Interactive-Seismology-Notebooks\"><a href=\"https://pawbz.github.io/Interactive-Seismology.jl/\">Interactive Seismology Notebooks</a></h5>\n<p>Instructor: <em>Pawan Bharadwaj</em>, Indian Institute of Science, Bengaluru, India</p>\n</div>"""

