text_representation = """<div class=\"pluto-docs-binding\">\n<span id=\"coast_js_literal\">coast_js_literal</span>\n<div class=\"markdown\"><pre><code class=\"language-julia\">coast_js_literal&#40;line_id, lon, lat&#41;</code></pre>\n<p>Groups the flat <code>&#40;line_id, lon, lat&#41;</code> coastline arrays into one <code>&#91;&#91;lon,lat&#93;,...&#93;</code> array per polyline and renders that as a <code>&#91;&#91;&#91;lon,lat&#93;,...&#93;,...&#93;</code> JS literal, so a widget&#39;s JS side can iterate &quot;one polyline at a time&quot; without redoing the grouping. Shared by both map widgets below &#40;identical to <code>earth-internal-structure.jl</code>&#39;s helper of the same name&#41;.</p>\n\n\n</div>\n</div>\n"""

