text_representation = """<div class=\"markdown\"><h2 id=\"Pick-an-Earthquake,-Pick-a-Station,-See-the-Seismogram\">Pick an Earthquake, Pick a Station, See the Seismogram</h2>\n<p>Not every earthquake makes a useful teaching example – too small and the signal is buried in noise at a global station, too close and there&#39;s no interesting wave propagation to see. On the <strong>left</strong> map, drag a box to a region you&#39;re curious about, set a minimum magnitude, and hit <strong>Search</strong>; click any dot to select that earthquake &#40;dot size scales with magnitude&#41;.</p>\n<p>A station only gives you a seismogram for this earthquake if it was actually <strong>operating</strong> during it – picking blind can land on a station with no data for that time window at all. Once an earthquake is selected, the <strong>right</strong> map&#39;s Search queries for GSN &#40;<code>IU</code>&#41; stations that were online across the whole event window, not just ones that happen to be nearby. The star marks the epicenter; once you pick a station the line between them is the great-circle path the waves actually traveled – the epicentral distance is exactly what set <code>minradius</code>/<code>maxradius</code> in this notebook&#39;s earlier version, now read off directly instead of being a search parameter.</p>\n<p>Once you have a station, hit <strong>Download</strong> – that&#39;s the only step that touches the network again. The <strong>channel</strong>, <strong>duration</strong>, and <strong>frequency band</strong> controls below the seismogram panel only ever re-slice or re-filter what&#39;s already on your machine &#40;duration can trim the downloaded window shorter, but not extend it past what you asked for at download time&#41;, so drag them as freely as you like.</p>\n</div>"""

