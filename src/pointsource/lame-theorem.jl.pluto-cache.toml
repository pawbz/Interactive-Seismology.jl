text_representation = """<div class=\"markdown\"><h2 id=\"P-Radiation\">P Radiation</h2>\n<p>Drag the receiver dot around the widget above while watching the <strong>P</strong> field. Its displacement always points exactly along the line from the source to the receiver — push in the direction the force points, pull behind it:</p>\n<p class=\"tex\">$$\\boxed&#123;u_i^&#123;\\rm P&#125;&#40;\\mathbf x,t&#41; &#61; \\frac&#123;\\gamma_i\\gamma_1&#125;&#123;4\\pi\\rho\\alpha^2 r&#125;\\,X_0\\&#33;\\left&#40;t-\\frac r\\alpha\\right&#41;&#125;$$</p>\n<p>where <span class=\"tex\">$\\gamma_i&#61;\\partial r/\\partial x_i$</span> is the unit vector from source to receiver and <span class=\"tex\">$X_0&#40;t&#41;$</span> is the force&#39;s time history. The <span class=\"tex\">$\\gamma_i\\gamma_1$</span> factor is exactly <span class=\"tex\">$\\cos\\theta$</span>, <span class=\"tex\">$\\theta$</span> being the angle between the receiver direction and the force — plotted against angle it is the classic <strong>dumbbell</strong> lobe: maximal along the force axis, zero perpendicular to it, and sign-flipped behind the source.</p>\n<div class=\"admonition note\"><p class=\"admonition-title\">Longitudinal waves</p><p>The far-field P displacement at any receiver has a direction <em>parallel</em> to the direction from the source — this is what &quot;longitudinal&quot; means. It is only exactly true far from the source; see the curl check in the Appendix for how &quot;far&quot; that has to be.</p>\n</div>\n</div>"""

