text_representation = """<div class=\"pluto-docs-binding\">\n<span id=\"double_couple_matrix\">double_couple_matrix</span>\n<div class=\"markdown\"><pre><code class=\"language-julia\">double_couple_matrix&#40;strike, dip, rake&#41;</code></pre>\n<p>Symmetric, traceless moment tensor for a pure double-couple &#40;shear-slip&#41; source – angles in degrees, Aki &amp; Richards eq. &#40;4.85&#41; convention &#40;<code>x</code>&#61;North, <code>y</code>&#61;East, <code>z</code>&#61;Down&#41;. Normalized to unit Frobenius norm so the widget&#39;s matrix values stay in a fixed, comparable range regardless of mechanism.</p>\n\n\n</div>\n</div>\n"""

