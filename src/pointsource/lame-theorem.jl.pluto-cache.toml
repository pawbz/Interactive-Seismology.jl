runtime_ns = 524042
text_representation = """<div class=\"markdown\"><h2 id=\"Beyond-a-Single-Force:-A-General-Moment-Tensor\">Beyond a Single Force: A General Moment Tensor</h2>\n<p>A single point force is a useful teaching example, but it isn&#39;t what an earthquake actually looks like. A fault slipping past itself exerts no net force on the surrounding rock — for every push there&#39;s an equal and opposite pull, so the source can&#39;t be represented by a vector &#40;a force&#41; at all. It takes a symmetric second-rank tensor, the <strong>moment tensor</strong> <span class=\"tex\">$M$</span>.</p>\n<p>Remarkably, Lamé&#39;s theorem still holds exactly unchanged: the far-field response of <em>any</em> point source in a homogeneous, isotropic medium splits into a purely radial P part and a purely tangential S part. For a moment-tensor source &#40;Aki &amp; Richards eq. 4.29&#41;, the radiation pattern generalizes from <span class=\"tex\">$\\cos\\theta$</span>/<span class=\"tex\">$\\sin\\theta$</span> to</p>\n<p class=\"tex\">$$R^P&#40;\\hat\\gamma&#41; &#61; \\hat\\gamma^&#123;\\&#33;\\top&#125; M \\hat\\gamma, \\qquad\n\\vec&#123;R&#125;^S&#40;\\hat\\gamma&#41; &#61; M\\hat\\gamma - \\left&#40;\\hat\\gamma^&#123;\\&#33;\\top&#125; M \\hat\\gamma\\right&#41;\\hat\\gamma,$$</p>\n<p>where <span class=\"tex\">$\\hat\\gamma$</span> is the unit vector from source to receiver. <span class=\"tex\">$R^P$</span> is a signed scalar — push or pull, exactly like <span class=\"tex\">$\\cos\\theta$</span> was for the point force. <span class=\"tex\">$\\vec&#123;R&#125;^S$</span> is a genuine vector, lying in the plane perpendicular to <span class=\"tex\">$\\hat\\gamma$</span> &#40;still purely tangential, still divergence-free&#41;.</p>\n<p>Edit the moment tensor matrix directly below, or drag the strike/dip/rake sliders to generate a pure double-couple — the mechanism of an ordinary shear-slip earthquake, and exactly the four-lobed &quot;beachball&quot; pattern seismologists read a fault&#39;s orientation from.</p>\n</div>"""

