text_representation = """<div class=\"markdown\"><h2 id=\"Near-Field-vs.-Far-Field\">Near Field vs. Far Field</h2>\n<p>The P and S terms above both decay as <span class=\"tex\">$1/r$</span> — pure geometric spreading. But they are not the whole story: there is a third term, the <strong>near field</strong>, that decays as <span class=\"tex\">$1/r^3$</span> &#40;through a time integral of the source rather than a simple time-shift&#41; and carries <em>both</em> P- and S-type motion at once. It falls off much faster with distance, so it only matters close to the source — drag the receiver toward the source in the widget above and watch the near-field contribution &#40;toggle it off/on with the checkbox&#41; grow relative to the far-field terms.</p>\n<p>The crossover is set by comparing the receiver distance <span class=\"tex\">$r$</span> to a wavelength: the <strong>ratio</strong> readout in the widget is <span class=\"tex\">$\\omega r/\\alpha$</span>, using the pulse&#39;s characteristic frequency <span class=\"tex\">$\\omega &#61; 2\\pi/T$</span>, where <span class=\"tex\">$T$</span> is the <strong>period</strong> slider – i.e. <span class=\"tex\">$2\\pi\\times$</span> the number of wavelengths between source and receiver. Drag it to see the crossover shift: a short period &#40;high frequency&#41; pushes the far field to dominate close in; a long period keeps the near field significant out to much larger distances.</p>\n<p class=\"tex\">$$\\boxed&#123;\\text&#123;ratio&#125;\\gg1 \\Rightarrow \\text&#123;far field dominates&#125;\\qquad \\text&#123;ratio&#125;\\ll1 \\Rightarrow \\text&#123;near field dominates&#125;&#125;$$</p>\n<div class=\"admonition warning\"><p class=\"admonition-title\">The crossover is further out than `` \\text{ratio}\\sim1 `` suggests</p><p>Don&#39;t take &quot;<span class=\"tex\">$\\gg1$</span>&quot; too literally here: because of a <span class=\"tex\">$1/r^2$</span>, not <span class=\"tex\">$1/r^3$</span>, effective decay of this specific near-field kernel at large <span class=\"tex\">$r$</span> &#40;the integration window widens with <span class=\"tex\">$r$</span>, partly canceling the formal <span class=\"tex\">$1/r^3$</span> prefactor&#41;, the near field is still several times <em>stronger</em> than far-field P out to <span class=\"tex\">$\\text&#123;ratio&#125;\\approx10$</span>, and only clearly subdominant past <span class=\"tex\">$\\text&#123;ratio&#125;\\approx20 \\text&#123;--&#125; 30$</span>. The inequality is real, just slower to kick in than the formula&#39;s exponents alone would suggest — drag the receiver far out and watch the near-field checkbox&#39;s effect on the seismogram shrink to confirm.</p>\n</div>\n<p>This is exactly the same near/far tradeoff that shows up in the Appendix&#39;s numerical check of the &quot;P is curl-free / S is divergence-free&quot; claims above — both are only exactly true in the <span class=\"tex\">$\\text&#123;ratio&#125;\\to\\infty$</span> limit.</p>\n</div>"""
