text_representation = """<div class=\"markdown\"><h2 id=\"S-Radiation\">S Radiation</h2>\n<p>Now watch the <strong>S</strong> field instead. Its displacement is always <em>perpendicular</em> to the source-receiver line:</p>\n<p class=\"tex\">$$\\boxed&#123;u_i^&#123;\\rm S&#125;&#40;\\mathbf x,t&#41; &#61; \\frac&#123;\\delta_&#123;i1&#125;-\\gamma_i\\gamma_1&#125;&#123;4\\pi\\rho\\beta^2 r&#125;\\,X_0\\&#33;\\left&#40;t-\\frac r\\beta\\right&#41;&#125;$$</p>\n<p><span class=\"tex\">$\\delta_&#123;i1&#125;-\\gamma_i\\gamma_1$</span> has magnitude <span class=\"tex\">$\\sin\\theta$</span> — zero along the force axis, maximal at 90° from it, the <strong>donut</strong> lobe that exactly complements P&#39;s dumbbell. Between the two, every direction around the source is covered: wherever P is weak, S is strong, and vice versa.</p>\n<div class=\"admonition note\"><p class=\"admonition-title\">Transverse waves</p><p>The far-field S displacement at any receiver has a direction <em>perpendicular</em> to the direction from the source — the same &quot;far enough&quot; caveat as the P term above applies.</p>\n</div>\n</div>"""

