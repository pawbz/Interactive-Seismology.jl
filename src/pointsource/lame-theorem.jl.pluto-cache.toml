text_representation = """<div class=\"pluto-docs-binding\">\n<span id=\"nearfield_kernel\">nearfield_kernel</span>\n<div class=\"markdown\"><pre><code class=\"language-julia\">nearfield_kernel&#40;::Val&#123;:gaussian&#125;, t, r, α, β, σ²&#41;</code></pre>\n<p>The near-field time integral <span class=\"tex\">$K&#40;t,r&#41;&#61;\\int_&#123;r/\\alpha&#125;^&#123;r/\\beta&#125;\\tau\\,X_0&#40;t-\\tau&#41;\\,d\\tau$</span> in closed form. The integration window <code>&#91;r/α, r/β&#93;</code> is exactly the time it takes the P and S fronts to sweep past a point at distance <code>r</code> – everything in between is the near field.</p>\n<div class=\"admonition note\"><p class=\"admonition-title\">A bug this fixes</p><p>An earlier version of this notebook wrote the Gaussian case with the same <code>erf&#40;...&#41;</code> term twice &#40;<code>tp</code> where the second occurrence should have read <code>ts</code>&#41;, which silently evaluated to exactly zero for every input. The corrected closed form below was verified against direct numerical quadrature of the defining integral before shipping.</p>\n</div>\n\n\n</div>\n</div>\n"""

