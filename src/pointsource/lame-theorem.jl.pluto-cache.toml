text_representation = """<div class=\"markdown\"><h3 id=\"Verifying-the-Radiation-Patterns\">Verifying the Radiation Patterns</h3>\n<p>The claims above – P is exactly curl-free, S is exactly divergence-free – are only exactly true in the far-field <em>limit</em>. The full closed-form expressions &#40;evaluated at real, finite <code>r</code>&#41; also pick up a small correction from differentiating the <code>1/r</code> geometric-spreading factor itself, which is the <em>same</em> near/far tradeoff the rest of this notebook is about. So a fair numerical check should show <code>curl&#40;P&#41;/|P|</code> and <code>div&#40;S&#41;/|S|</code> as small but <strong>nonzero</strong>, shrinking as <span class=\"tex\">$\\omega r/\\alpha$</span> grows – not exactly zero.</p>\n</div>"""

