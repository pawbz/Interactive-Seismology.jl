text_representation = """<div class=\"markdown\"><h1 id=\"Lamé&#39;s-Theorem\">Lamé&#39;s Theorem</h1>\n<p>Hit an elastic whole-space with a single point force and it doesn&#39;t radiate one kind of wave — it radiates two, a longitudinal P wave and a transverse S wave, from the same source at the same instant. Lamé&#39;s theorem is the reason: any displacement field solving the elastic wave equation splits, exactly, into a curl-free part and a divergence-free part, and those two parts turn out to obey their <em>own</em> simple scalar/vector wave equations at speeds <span class=\"tex\">$\\alpha$</span> and <span class=\"tex\">$\\beta$</span>. This notebook builds the complete time-domain solution for a single point force and hands you a widget to explore it: drag the force direction, drag a receiver, and watch the near-field, far-field-P, and far-field-S terms trade off as you move.</p>\n<h5 id=\"Interactive-Seismology-Notebooks\"><a href=\"https://pawbz.github.io/Interactive-Seismology.jl/\">Interactive Seismology Notebooks</a></h5>\n<p>Instructor: <em>Pawan Bharadwaj</em>, Indian Institute of Science, Bengaluru, India</p>\n</div>"""

