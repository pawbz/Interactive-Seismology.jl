text_representation = """<div class=\"pluto-docs-binding\">\n<span id=\"sourcewave_deriv_table\">sourcewave_deriv_table</span>\n<div class=\"markdown\"><pre><code class=\"language-julia\">sourcewave_deriv_table&#40;sourcetype, params, tgrid&#41;</code></pre>\n<p>Sample <span class=\"tex\">$\\dot&#123;X&#125;_0&#40;t&#41;$</span> &#40;see <a href=\"@ref\"><code>sourcewave_deriv</code></a>&#41; on <code>tgrid</code> – a small 1D lookup table the widget interpolates client-side to animate the far-field wavefronts. It&#39;s the derivative, not <code>sourcewave</code> itself, because the far-field P/S terms it&#39;s driving are <span class=\"tex\">$\\dot&#123;X&#125;_0$</span> &#40;see <a href=\"@ref\"><code>pfar_displacement</code></a>&#41;. The angular pattern and <code>1/r</code> geometric spreading are simple enough to compute directly in JS; the source waveform is the one piece of real physics worth pushing over from Julia.</p>\n\n\n</div>\n</div>\n"""

