text_representation = """<div class=\"pluto-docs-binding\">\n<span id=\"pointforce_seismogram\">pointforce_seismogram</span>\n<div class=\"markdown\"><pre><code class=\"language-julia\">pointforce_seismogram&#40;fhat, rhat, r, α, β, sourcetype, params, tgrid&#41;</code></pre>\n<p>Evaluate the radial/transverse displacement time series at a receiver in direction <code>rhat</code> &#40;a 3D unit vector from the source&#41; at distance <code>r</code>, for a point force along direction <code>fhat</code> &#40;also a unit vector&#41; – decomposed into near-field, far-field-P, and far-field-S contributions <em>separately</em> – so the widget can toggle each on/off without a further Julia call. Only the angle between <code>fhat</code> and <code>rhat</code> matters &#40;the radiation is axisymmetric about the force axis&#41;, computed here as <code>θrel &#61; acos&#40;fhat·rhat&#41;</code>.</p>\n<p>Returns a named tuple <code>&#40;near_radial, near_transverse, pfar_radial, sfar_transverse&#41;</code>, each a vector the same length as <code>tgrid</code>.</p>\n\n\n</div>\n</div>\n"""

