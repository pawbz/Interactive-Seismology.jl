text_representation = """<div class=\"markdown\"><div class=\"admonition correct\"><p class=\"admonition-title\">Checking that a double couple is really traceless</p><p>A pure shear dislocation conserves volume, so its moment tensor must be traceless &#40;<span class=\"tex\">$M_&#123;xx&#125;&#43;M_&#123;yy&#125;&#43;M_&#123;zz&#125;&#61;0$</span>&#41; for <em>every</em> strike/dip/rake – checked below, algebraically guaranteed by the formula but worth confirming numerically too.</p>\n</div>\n</div>"""

