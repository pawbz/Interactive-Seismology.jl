text_representation = """<div class=\"markdown\"><div class=\"admonition note\"><p class=\"admonition-title\">Lamé's Theorem — Helmholtz Potentials</p><p>If the displacement field <span class=\"tex\">$\\mathbf u &#61; \\mathbf u&#40;\\mathbf x, t&#41;$</span> satisfies the elastic wave equation</p>\n<p class=\"tex\">$$\\rho\\ddot&#123;\\mathbf u&#125; &#61; \\mathbf f &#43; &#40;\\lambda&#43;2\\mu&#41;\\nabla&#40;\\nabla\\cdot\\mathbf u&#41; - \\mu\\,\\nabla\\times&#40;\\nabla\\times\\mathbf u&#41;,$$</p>\n<p>then there exist potentials <span class=\"tex\">$\\phi$</span> and <span class=\"tex\">$\\boldsymbol\\psi$</span> such that</p>\n<p class=\"tex\">$$\\mathbf u &#61; \\nabla\\phi &#43; \\nabla\\times\\boldsymbol\\psi, \\qquad \\nabla\\cdot\\boldsymbol\\psi &#61; 0,$$</p>\n<p>each obeying its own wave equation, sourced by the matching split of the body force <span class=\"tex\">$\\mathbf f &#61; \\nabla f_1 &#43; \\nabla\\times\\mathbf f_2$</span>:</p>\n<p class=\"tex\">$$\\rho\\ddot\\phi &#61; f_1 &#43; &#40;\\lambda&#43;2\\mu&#41;\\nabla^2\\phi, \\qquad \\rho\\ddot&#123;\\boldsymbol\\psi&#125; &#61; \\mathbf f_2 &#43; \\mu\\,\\nabla^2\\boldsymbol\\psi.$$</p>\n<p>In words: <strong>any</strong> elastic wave, however complicated, is exactly a sum of a curl-free piece &#40;P waves, speed <span class=\"tex\">$\\alpha&#61;\\sqrt&#123;&#40;\\lambda&#43;2\\mu&#41;/\\rho&#125;$</span>&#41; and a divergence-free piece &#40;S waves, speed <span class=\"tex\">$\\beta&#61;\\sqrt&#123;\\mu/\\rho&#125;$</span>&#41; — the split this whole notebook is built around.</p>\n</div>\n</div>"""

