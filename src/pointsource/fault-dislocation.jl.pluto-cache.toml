text_representation = """<div class=\"pluto-docs-binding\">\n<span id=\"okada_surface_displacement\">okada_surface_displacement</span>\n<div class=\"markdown\"><pre><code class=\"language-julia\">okada_surface_displacement&#40;E, N; depth, strike_deg, dip_deg, L, W, U1, U2, U3&#61;0.0, nu&#61;0.25&#41;</code></pre>\n<p>Surface &#40;<code>z&#61;0</code>&#41; displacement <code>&#40;uE, uN, uZ&#41;</code> at horizontal position <code>&#40;E, N&#41;</code> due to uniform slip on a rectangular fault patch buried in a Poisson-solid elastic half-space &#40;Okada, 1985&#41;.</p>\n<p><code>depth</code> is the depth &#40;positive down&#41; of the fault-plane centroid, in the same length unit as <code>E</code>, <code>N</code>, <code>L</code>, <code>W</code>. <code>strike_deg</code> is measured clockwise from north, <code>dip_deg</code> from horizontal. <code>U1</code> is strike-slip, <code>U2</code> is dip-slip, and <code>U3</code> is tensile opening, all in the same length unit &#40;e.g. metres&#41; — independent of the geometric length unit used for <code>E</code>, <code>N</code>, <code>L</code>, <code>W</code>, <code>depth</code> &#40;e.g. kilometres&#41;.</p>\n\n\n</div>\n</div>\n"""

