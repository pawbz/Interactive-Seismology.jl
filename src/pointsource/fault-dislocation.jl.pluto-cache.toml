text_representation = """<div class=\"markdown\"><h3 id=\"The-Interactive-Widget\">The Interactive Widget</h3>\n<p><code>FaultDislocationInput</code> does no physics either — it draws the 3D view &#40;a flat, colorable ground plane plus the tilted fault rectangle below it&#41;, handles dragging the fault&#39;s two endpoints, dragging the on-fault arrow that sets the slip <em>direction</em> &#40;rake&#41;, dragging to rotate the camera, the field-select checkboxes, and the geometry/magnitude sliders, and reports the resulting fault dictionary back to Julia. The rake and magnitude are pure display/UI state — they&#39;re converted to the <code>sStrike</code>/<code>sDip</code> components Okada&#39;s formula actually takes &#40;<span class=\"tex\">$s_&#123;\\rm strike&#125;&#61;D\\cos&#40;\\text&#123;rake&#125;&#41;$</span>, <span class=\"tex\">$s_&#123;\\rm dip&#125;&#61;D\\sin&#40;\\text&#123;rake&#125;&#41;$</span>&#41; before being reported, so nothing downstream changes. Everything downstream &#40;<code>okada_surface_field</code>, <code>seismic_moment</code>, <code>FieldPush</code>&#41; is what turns that dictionary into the surface response and paints it back onto this same widget.</p>\n</div>"""

