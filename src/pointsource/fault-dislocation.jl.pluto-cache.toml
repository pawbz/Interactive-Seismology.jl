text_representation = """<div class=\"markdown\"><h2 id=\"The-Interesting-Part:-Boundary-Conditions\">The Interesting Part: Boundary Conditions</h2>\n<p>The Navier equation above is satisfied everywhere in the half-space — it says nothing yet about <em>why</em> there&#39;s any deformation at all. That comes entirely from two boundary conditions.</p>\n<p>At the Earth&#39;s surface, traction vanishes because there&#39;s nothing above to push back:</p>\n<p class=\"tex\">$$\\boxed&#123;\\boldsymbol\\sigma\\cdot\\hat&#123;\\mathbf n&#125; &#61; 0&#125; \\qquad &#40;z&#61;0&#41;.$$</p>\n<p>Across the fault itself, the two faces are prescribed to have moved relative to each other by exactly the slip vector, while traction stays continuous &#40;the two faces still push on each other with equal and opposite force — they just no longer line up&#41;:</p>\n<p class=\"tex\">$$\\boxed&#123;\\mathbf u^&#43; - \\mathbf u^- &#61; \\mathbf s&#125;.$$</p>\n<p>This is worth sitting with: <strong>we never apply a mysterious &quot;earthquake force.&quot;</strong> We prescribe a displacement <em>discontinuity</em> across an internal surface, and let the elastic medium do the rest.</p>\n<p>It also sharpens the connection to infinitesimal-strain theory noted above. The jump <span class=\"tex\">$\\mathbf s$</span> across the fault can be meters — not infinitesimal at all — while every point of the surrounding medium, arbitrarily close to the fault, is still governed by the <em>linear</em>, small-strain elasticity of the Navier equation. Large slip, small strain everywhere except exactly on the discontinuity: that&#39;s what makes this a genuinely <em>elastic</em> dislocation problem rather than a nonlinear fracture-mechanics one.</p>\n</div>"""

