text_representation = """<div class=\"pluto-docs-binding\">\n<span id=\"okada_surface_field\">okada_surface_field</span>\n<div class=\"markdown\"><pre><code class=\"language-julia\">okada_surface_field&#40;flt; n&#61;80, world_half&#61;90.0, wavelength&#61;0.056&#41;</code></pre>\n<p>Evaluate <a href=\"@ref\"><code>okada_surface_displacement</code></a> on an <code>n</code>×<code>n</code> grid spanning <code>±world_half</code> kilometres in East and North around the origin, for the fault geometry and slip in <code>flt</code> &#40;a <code>Dict</code> as produced by <code>FaultDislocationInput</code>, with keys <code>&quot;E0&quot;</code>, <code>&quot;N0&quot;</code>, <code>&quot;strikeDeg&quot;</code>, <code>&quot;L&quot;</code>, <code>&quot;dipDeg&quot;</code>, <code>&quot;depth&quot;</code>, <code>&quot;W&quot;</code>, <code>&quot;sStrike&quot;</code>, <code>&quot;sDip&quot;</code>, <code>&quot;ascending&quot;</code>, <code>&quot;lambdaRadar&quot;</code>&#41;.</p>\n<p>Returns the coordinate vectors and the <code>uE</code>, <code>uN</code>, <code>uZ</code> displacement fields, the horizontal magnitude <code>uHoriz &#61; hypot&#40;uE,uN&#41;</code>, and the line-of-sight displacement <code>uLOS</code> with its wrapped InSAR fringe <code>phase</code> &#40;in <code>&#91;0,1&#41;</code>&#41; for a simplified satellite geometry — 23° incidence from vertical, ascending tracks looking east and descending tracks looking west — at <code>wavelength</code> metres &#40;default: Sentinel-1 C-band, 5.6 cm; pass <code>flt&#91;&quot;lambdaRadar&quot;&#93;</code>, the widget&#39;s own radar-λ slider, to keep the picture&#39;s fringe spacing in sync with what the colorbar reports&#41;.</p>\n<p><code>world_half</code> must match the fixed axis half-range the <a href=\"@ref\"><code>FaultDislocationInput</code></a> widget draws its map at, so the two line up spatially.</p>\n\n\n</div>\n</div>\n"""

