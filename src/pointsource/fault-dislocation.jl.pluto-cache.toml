text_representation = """<div class=\"markdown\"><h2 id=\"The-Governing-Equation\">The Governing Equation</h2>\n<p>Start from momentum conservation for the elastic medium surrounding the fault,</p>\n<p class=\"tex\">$$\\rho\\,\\ddot&#123;\\mathbf u&#125; &#61; \\nabla\\cdot\\boldsymbol\\sigma &#43; \\mathbf f.$$</p>\n<p>A static &#40;or slowly post-seismic&#41; deformation field has no acceleration, <span class=\"tex\">$\\ddot&#123;\\mathbf u&#125;&#61;0$</span>, and there&#39;s no body force away from the source, so this collapses to elastostatic equilibrium:</p>\n<p class=\"tex\">$$\\nabla\\cdot\\boldsymbol\\sigma &#61; 0.$$</p>\n<p>Stress is related to strain through Hooke&#39;s law for an isotropic solid,</p>\n<p class=\"tex\">$$\\sigma_&#123;ij&#125; &#61; \\lambda\\,\\epsilon_&#123;kk&#125;\\,\\delta_&#123;ij&#125; &#43; 2\\mu\\,\\epsilon_&#123;ij&#125;, \\qquad\n\\epsilon_&#123;ij&#125; &#61; \\tfrac12\\left&#40;u_&#123;i,j&#125; &#43; u_&#123;j,i&#125;\\right&#41;,$$</p>\n<p>the same infinitesimal-strain tensor built up in the <a href=\"../introduction/strain-tensor.html\">strain tensor notebook</a>. Substituting strain into stress into the equilibrium condition gives the <strong>static Navier equation</strong> — the one PDE this whole notebook is quietly solving everywhere except right on the fault:</p>\n<p class=\"tex\">$$\\boxed&#123;\\mu\\,\\nabla^2\\mathbf u &#43; &#40;\\lambda&#43;\\mu&#41;\\,\\nabla&#40;\\nabla\\cdot\\mathbf u&#41; &#61; 0&#125;$$</p>\n<p>By the time you reach the widget below, you&#39;ve seen the full chain: displacement → strain → stress → force balance.</p>\n<h3 id=\"Why-Ignore-Inertia?-The-Quasi-Static-Limit\">Why Ignore Inertia? The Quasi-Static Limit</h3>\n<p>Dropping <span class=\"tex\">$\\rho\\,\\ddot&#123;\\mathbf u&#125;$</span> above deserves a real justification, not just the word &quot;static.&quot; Two length scales are in play, and everything hinges on comparing them.</p>\n<p>The source sets a <em>spatial</em> scale — the fault length <span class=\"tex\">$L$</span> &#40;the same <span class=\"tex\">$L$</span> you&#39;ll be dragging in the widget below&#41;, which is roughly the distance over which the surface displacement field varies. Separately, any process with characteristic timescale <span class=\"tex\">$T$</span> has an associated <em>wavelength</em>,</p>\n<p class=\"tex\">$$\\lambda &#61; V_s\\,T,$$</p>\n<p>for shear waves traveling at speed <span class=\"tex\">$V_s$</span>. <span class=\"tex\">$L$</span> and <span class=\"tex\">$\\lambda$</span> are set by completely different things — one geometric, one temporal — so nothing forces them to be comparable.</p>\n<p>Go back to the full &#40;not-yet-static&#41; equation of motion for shear waves, <span class=\"tex\">$\\rho\\,\\ddot u &#61; \\mu\\,\\nabla^2 u$</span>, and scale it: <span class=\"tex\">$u\\sim U$</span>, space <span class=\"tex\">$\\sim L$</span>, time <span class=\"tex\">$\\sim T$</span>. Then <span class=\"tex\">$\\ddot u \\sim U/T^2$</span> while <span class=\"tex\">$\\nabla^2 u \\sim U/L^2$</span>, so</p>\n<p class=\"tex\">$$\\boxed&#123;\\frac&#123;\\text&#123;inertia&#125;&#125;&#123;\\text&#123;elastic&#125;&#125; \\sim \\frac&#123;\\rho\\,U/T^2&#125;&#123;\\mu\\,U/L^2&#125; &#61; \\left&#40;\\frac&#123;L&#125;&#123;\\lambda&#125;\\right&#41;^2&#125;$$</p>\n<p>using <span class=\"tex\">$V_s^2 &#61; \\mu/\\rho$</span>. That ratio is the whole story:</p>\n<ul>\n<li><p><strong><span class=\"tex\">$L\\sim\\lambda$</span></strong> — the <em>dynamic</em> regime. Space and time are locked together into a genuinely propagating wave, inertia is not negligible, and this is ordinary wave-propagation seismology.</p>\n</li>\n<li><p><strong><span class=\"tex\">$\\lambda\\gg L$</span></strong> — the <em>quasi-static</em> regime. Elastic waves cross the entire source region many times within one cycle of whatever is driving the deformation, so the medium has time to equilibrate everywhere before the loading changes appreciably. Inertia drops out and you&#39;re left with <span class=\"tex\">$\\nabla\\cdot\\boldsymbol\\sigma&#61;0$</span> — exactly the equilibrium used above.</p>\n</li>\n</ul>\n<p>A concrete check: <span class=\"tex\">$L&#61;10$</span> km, <span class=\"tex\">$V_s&#61;4$</span> km/s. A slowly-loading process with period <span class=\"tex\">$T&#61;1000$</span> s gives <span class=\"tex\">$\\lambda &#61; 4000$</span> km, so <span class=\"tex\">$L/\\lambda\\approx0.0025$</span> — inertia is six orders of magnitude smaller than the elastic term, comfortably quasi-static. Shrink <span class=\"tex\">$T$</span> to <span class=\"tex\">$2.5$</span> s and <span class=\"tex\">$\\lambda&#61;10$</span> km <span class=\"tex\">$\\sim L$</span>: now you&#39;re in the wave-propagation regime, and elastostatics no longer applies.</p>\n<p>This is exactly the limit Okada&#39;s solution lives in — it&#39;s the <span class=\"tex\">$\\omega\\to0$</span> &#40;equivalently <span class=\"tex\">$\\lambda\\gg L$</span>&#41; limit of the full elastodynamic problem, appropriate for coseismic-to-postseismic deformation measured well after the seismic waves have passed, not for the seismic waves themselves. It&#39;s the assumption this whole notebook has been quietly making since the first equation.</p>\n</div>"""

