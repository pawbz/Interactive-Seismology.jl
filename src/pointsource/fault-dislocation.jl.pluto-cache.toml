text_representation = """<div class=\"markdown\"><h3 id=\"Pushing-the-Field-into-the-3D-View\">Pushing the Field into the 3D View</h3>\n<p><code>FieldPush</code> does no physics either — it takes the already-computed <code>field</code> &#40;from <a href=\"@ref\"><code>okada_surface_field</code></a>&#41; and hands its raw numbers to the <em>already-rendered</em> <a href=\"@ref\"><code>FaultDislocationInput</code></a> widget below, by dispatching a browser <code>CustomEvent</code> at the widget&#39;s own <code>&lt;div&gt;</code>. The widget&#39;s own script &#40;defined once, when it was first drawn&#41; is listening for that event and repaints its 3D view from the new numbers. Nothing here decides <em>where</em> the deformation is — that arithmetic already happened in Julia; this cell only delivers the answer to the picture.</p>\n</div>"""

