text_representation = """<div class=\"markdown\"><h3 id=\"Verifying-the-Implementation\">Verifying the Implementation</h3>\n<p>A visible check against Okada&#39;s own published verification example &#40;his Table, reproduced in essentially every implementation since&#41;: a fault at <span class=\"tex\">$x&#61;2,\\,y&#61;3,\\,d&#61;4$</span> &#40;fault-local coordinates&#41;, dip <span class=\"tex\">$70°$</span>, <span class=\"tex\">$L&#61;3$</span>, <span class=\"tex\">$W&#61;2$</span>, unit slip in each of the three components in turn.</p>\n</div>"""

