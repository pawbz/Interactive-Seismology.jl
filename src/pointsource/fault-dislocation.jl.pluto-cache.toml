text_representation = """<div class=\"markdown\"><h3 id=\"The-Okada-Green&#39;s-Function\">The Okada Green&#39;s Function</h3>\n<p>Okada&#39;s &#40;1985&#41; closed-form solution for the surface displacement due to a uniform-slip rectangular dislocation in an elastic half-space. The auxiliary <code>_okada_*</code> functions below implement Okada&#39;s own notation term for term &#40;his Chinnery-notation four-corner evaluation, and his <span class=\"tex\">$I_1,\\dots,I_5$</span> auxiliary integrals&#41;; <a href=\"@ref\"><code>okada_surface_displacement</code></a> is the public entry point.</p>\n</div>"""

