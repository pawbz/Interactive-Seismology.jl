text_representation = """<div class=\"markdown\"><h2 id=\"Fault-Size-and-Seismic-Moment\">Fault Size and Seismic Moment</h2>\n<p>Now try <strong>Large slow slip &#40;moment&#41;</strong> — a fault an order of magnitude bigger in area than the strike-slip default, at a comparable depth. The surface footprint grows to match the fault size directly &#40;deformation stays roughly localized over the source, unlike the depth effect above&#41;, and the moment magnitude readout jumps with it.</p>\n<p>Seismic moment ties the geometry you&#39;re dragging directly to earthquake size:</p>\n<p class=\"tex\">$$\\boxed&#123;M_0 &#61; \\mu\\,A\\,D&#125;$$</p>\n<p>with <span class=\"tex\">$A&#61;LW$</span> the rupture area and <span class=\"tex\">$D$</span> the slip magnitude. The <strong>Readouts</strong> panel above computes this from the exact same <code>flt</code> geometry driving the surface plots — this is the same <span class=\"tex\">$M_0$</span> that converts to the moment magnitude <span class=\"tex\">$M_w$</span> reported by every seismic catalog, computed here from pure static geodesy rather than a seismogram. Geodesy and seismic source theory are describing the same rupture; this is where they meet.</p>\n</div>"""

