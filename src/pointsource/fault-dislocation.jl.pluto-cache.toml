text_representation = """<div class=\"markdown\"><h2 id=\"Okada&#39;s-Solution,-as-a-Green&#39;s-Function\">Okada&#39;s Solution, as a Green&#39;s Function</h2>\n<p>Solving the Navier equation subject to those two boundary conditions, for an arbitrary rectangular fault in a half-space, is a real derivation — and it buries the physics in algebra that doesn&#39;t teach much on a first pass. We won&#39;t do it here. What matters is the <em>shape</em> of the answer: because the governing equation is linear, the surface displacement is a linear function of the slip, mediated by a <strong>Green&#39;s function</strong> that packages the entire boundary-value problem for a given geometry and elastic moduli:</p>\n<p class=\"tex\">$$\\mathbf u&#40;\\mathbf x&#41; &#61; \\mathbf G\\bigl&#40;\\mathbf x;\\, \\text&#123;fault geometry&#125;,\\, \\lambda,\\, \\mu\\bigr&#41;\\,\\mathbf s.$$</p>\n<p>Okada &#40;1985&#41; worked out <span class=\"tex\">$\\mathbf G$</span> in closed form, for exactly this problem — a uniform-slip rectangular dislocation in an elastic half-space. It&#39;s a long but entirely explicit formula &#40;see the Appendix if you want to see every term&#41;, and it&#39;s the analytic engine behind essentially every geodetic earthquake-source study since. From here, we stop deriving and start computing.</p>\n</div>"""

