text_representation = """<div class=\"markdown\"><h2 id=\"Reading-InSAR:-Line-of-Sight-Projection\">Reading InSAR: Line-of-Sight Projection</h2>\n<p>Unlike a GPS receiver, a radar satellite doesn&#39;t hand you <span class=\"tex\">$&#40;u_E,u_N,u_Z&#41;$</span> directly. It measures a <em>change in range</em> — the distance between satellite and ground — and that range change is only sensitive to the part of the ground motion pointing back at the satellite, the <strong>line of sight</strong> &#40;LOS&#41;, a unit vector <span class=\"tex\">$\\hat&#123;\\mathbf l&#125;$</span>:</p>\n<p class=\"tex\">$$\\boxed&#123;d_&#123;\\rm LOS&#125; &#61; \\hat&#123;\\mathbf l&#125;\\cdot\\mathbf u &#61; l_E u_E &#43; l_N u_N &#43; l_Z u_Z&#125;$$</p>\n<p>Two SAR images, before and after the earthquake, interfere to give a phase difference that wraps every time the LOS range changes by half a radar wavelength &#40;out-and-back doubles the one-way path&#41;:</p>\n<p class=\"tex\">$$\\Delta\\phi_&#123;\\rm disp&#125; &#61; \\frac&#123;4\\pi&#125;&#123;\\lambda_&#123;\\rm radar&#125;&#125;\\,d_&#123;\\rm LOS&#125;\n\\qquad\\Longrightarrow\\qquad\n\\text&#123;one fringe&#125; \\;&#61;\\; \\frac&#123;\\lambda_&#123;\\rm radar&#125;&#125;&#123;2&#125;.$$</p>\n<p>That&#39;s exactly what the <strong>InSAR fringes</strong> checkbox draws: <code>uLOS</code> computed from the same <code>&#40;uE,uN,uZ&#41;</code> Okada already gave you, wrapped into <code>&#91;0,1&#41;</code> cycles of <span class=\"tex\">$\\lambda_&#123;\\rm radar&#125;/2$</span>. The <strong>radar λ</strong> slider changes <span class=\"tex\">$\\lambda_&#123;\\rm radar&#125;$</span> directly — drag it from a short X-band wavelength &#40;~3 cm&#41; toward a long L-band one &#40;~24 cm&#41; and watch the fringes spread apart for the <em>exact same</em> deformation field: shorter wavelength packs more fringes into the same physical displacement, it doesn&#39;t change <span class=\"tex\">$\\mathbf u$</span> at all. The colorbar&#39;s &quot;cm LOS&quot; label tracks whatever the slider is currently set to.</p>\n<p>One real limitation the widget&#39;s own geometry makes concrete: a single interferogram gives one number &#40;<span class=\"tex\">$d_&#123;\\rm LOS&#125;$</span>&#41; per pixel but three unknowns &#40;<span class=\"tex\">$u_E,u_N,u_Z$</span>&#41;. Polar-orbiting satellites look sideways, nearly east-west, so <span class=\"tex\">$l_N\\approx0$</span> in practice — this notebook&#39;s <code>okada_surface_field</code> takes that simplification literally &#40;<code>lookE</code>/<code>lookU</code> only, no north term at all&#41;, which is why flipping <strong>track</strong> between ascending and descending flips the <em>sign</em> of the east sensitivity but never recovers north-south motion. Reconstructing the full 3-D field for real needs multiple viewing geometries &#40;ascending &#43; descending, or several tracks&#41; combined, typically with GPS to break the remaining ambiguity — a single fringe map alone can&#39;t do it.</p>\n</div>"""

