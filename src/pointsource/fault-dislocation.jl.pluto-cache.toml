text_representation = """<div class=\"markdown\"><h2 id=\"What-Depth-Does-to-the-Surface\">What Depth Does to the Surface</h2>\n<p>Try the <strong>Shallow source &#40;d &#61; 3 km&#41;</strong> and <strong>Deep source &#40;d &#61; 30 km&#41;</strong> presets back to back, with everything else held fixed. Switch the field checkbox between <strong>Vertical GPS</strong> and <strong>InSAR</strong> and rotate the view to look along the surface — watch how the pattern spreads, not just its peak amplitude.</p>\n<p class=\"tex\">$$\\boxed&#123;\\text&#123;deeper source&#125; \\rightarrow \\text&#123;broader, weaker surface deformation&#125;&#125;$$</p>\n<p>The peak drops because you&#39;re further from the source. The pattern <em>widens</em> because a buried Green&#39;s function is smooth — a deeper dislocation looks, from the surface, like a low-pass filtered version of a shallow one at the same location. This is exactly the resolution problem that makes geodetic depth estimates hard: a deep, large-slip event and a shallow, small-slip event can produce surface patterns that are hard to tell apart without independent depth information &#40;seismic arrival times, aftershock depths&#41;.</p>\n</div>"""

