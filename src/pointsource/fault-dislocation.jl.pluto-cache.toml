text_representation = """<div class=\"markdown\"><h1 id=\"Faulting-and-the-Surface\">Faulting and the Surface</h1>\n<p>An earthquake is, mechanically, nothing more exotic than a crack that slips. Put a rectangular patch of slip inside an elastic half-space, and everything you can measure at the surface — the GPS offsets, the InSAR fringes — is the response of the surrounding elastic medium to that one buried event. This notebook builds the whole class around a single concrete question, then hands you a widget to answer it by hand.</p>\n<p>The half-space is <span class=\"tex\">$z\\le0$</span> &#40;depth positive down&#41;. The fault living inside it is a rectangle, parameterized by its center location, depth, size, and orientation:</p>\n<p class=\"tex\">$$\\boxed&#123;x_0,\\; y_0,\\; d,\\; L,\\; W,\\; \\phi,\\; \\delta&#125;$$</p>\n<p>for horizontal location <span class=\"tex\">$&#40;x_0,y_0&#41;$</span>, centroid depth <span class=\"tex\">$d$</span>, length <span class=\"tex\">$L$</span>, width <span class=\"tex\">$W$</span>, strike <span class=\"tex\">$\\phi$</span> &#40;measured clockwise from north&#41;, and dip <span class=\"tex\">$\\delta$</span> &#40;from horizontal&#41;. Slip on the fault is prescribed, not solved for — we decompose it into three components along the fault&#39;s own local directions: along-strike <span class=\"tex\">$\\hat&#123;\\mathbf s&#125;$</span>, along-dip <span class=\"tex\">$\\hat&#123;\\mathbf d&#125;$</span>, and fault-normal <span class=\"tex\">$\\hat&#123;\\mathbf n&#125;$</span> &#40;opening/closing&#41;,</p>\n<p class=\"tex\">$$\\mathbf s &#61; s_&#123;\\rm strike&#125;\\,\\hat&#123;\\mathbf s&#125; &#43; s_&#123;\\rm dip&#125;\\,\\hat&#123;\\mathbf d&#125; &#43; s_&#123;\\rm tensile&#125;\\,\\hat&#123;\\mathbf n&#125;.$$</p>\n<p>Held uniform across the patch, for now. The question this entire notebook is built to answer:</p>\n<p class=\"tex\">$$\\boxed&#123;\\text&#123;Given fault geometry &#43; slip, what does the surface do?&#125;&#125;$$</p>\n<p>The answer is a displacement field at the free surface,</p>\n<p class=\"tex\">$$\\mathbf u&#40;x,y,0&#41; &#61; \\begin&#123;pmatrix&#125; u_E \\\\ u_N \\\\ u_Z \\end&#123;pmatrix&#125;,$$</p>\n<p>and that&#39;s exactly what a GPS receiver and a satellite radar measure: horizontal offset, vertical offset, and &#40;for InSAR&#41; the displacement projected onto the satellite&#39;s line of sight. Everything below is aimed at that one triple.</p>\n</div>"""

