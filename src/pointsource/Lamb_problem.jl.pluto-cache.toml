text_representation = """<div class=\"pluto-docs-binding\">\n<span id=\"get_vertical_wavenumber\">get_vertical_wavenumber</span>\n<div class=\"markdown\"><pre><code class=\"language-julia\">get_vertical_wavenumber&#40;c, p; tol&#61;1e-10&#41;</code></pre>\n<p>Compute vertical wavenumber with numerically stable branch selection. Adds tolerance to avoid roundoff errors near critical angles.</p>\n<ul>\n<li><p>Propagating &#40;p &lt; 1/c&#41;: returns negative real root</p>\n</li>\n<li><p>Evanescent &#40;p &gt; 1/c&#41;: returns positive imaginary root</p>\n</li>\n<li><p>Near-critical: handled with tolerance</p>\n</li>\n</ul>\n\n\n</div>\n</div>\n"""

