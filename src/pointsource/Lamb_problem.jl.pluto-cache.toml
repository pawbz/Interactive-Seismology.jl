text_representation = """<div class=\"markdown\"><h1 id=\"Lamb&#39;s-Problem-—-Reflectivity-Method\">Lamb&#39;s Problem — Reflectivity Method</h1>\n<p>Lamb&#39;s Problem is a classical problem in seismology and geophysics that involves understanding the response of an elastic half-space to a point source, such as an earthquake or an explosion. The notebook leverages <code>QuadGK</code> package to perform numerical integration.</p>\n<p>The Reflectivity Method is a powerful technique used in seismology to model the propagation of seismic waves in layered media. It involves calculating the reflection and transmission coefficients of seismic waves at each interface between different layers. By superimposing these plane waves, the method can simulate the wavefield generated by a point source in a stratified medium.</p>\n<h5 id=\"Interactive-Seismology-Notebooks\"><a href=\"https://pawbz.github.io/Interactive-Seismology.jl/\">Interactive Seismology Notebooks</a></h5>\n<p>Instructor: <em>Pawan Bharadwaj</em>, Indian Institute of Science, Bengaluru, India</p>\n</div>"""

