text_representation = """<div class=\"markdown\"><h1 id=\"Rayleigh-Wave-Dispersion-Curves\">Rayleigh Wave Dispersion Curves</h1>\n<p>This notebook provides an interactive environment to explore the dispersion of Rayleigh waves, a fundamental type of surface seismic wave used in seismology and Earth structure studies.</p>\n<p>Rayleigh waves involve both vertical and horizontal ground motion and are sensitive to the elastic properties and layering of the crust and upper mantle. Their dispersion &#40;variation of phase velocity with period&#41; reveals information about subsurface structure.</p>\n<p>Here, you can:</p>\n<ul>\n<li><p>Build a layered Earth model interactively by adjusting thickness, P-wave velocity &#40;Vp&#41;, S-wave velocity &#40;Vs&#41;, and density &#40;ρ&#41; for each layer;</p>\n</li>\n<li><p>Compute and visualize Rayleigh-wave dispersion curves, observing how changes in the model affect the shape of the curve and the inferred Earth properties.</p>\n</li>\n</ul>\n<h5 id=\"Interactive-Seismology-Notebooks\"><a href=\"https://pawbz.github.io/Interactive-Seismology.jl/\">Interactive Seismology Notebooks</a></h5>\n<p>Instructor: <em>Pawan Bharadwaj</em>, Indian Institute of Science, Bengaluru, India</p>\n</div>"""

