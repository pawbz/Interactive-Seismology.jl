text_representation = """<div class=\"markdown\"><p>Maximum period: <bond def=\"period_max\" unique_id=\"jrhkmucnqsjz\"><input type='range' min='1' max='37' value='17'><script>\n\t\t\t\t\tconst input_el = currentScript.previousElementSibling\n\t\t\t\t\tconst output_el = currentScript.nextElementSibling\n\t\t\t\t\tconst displays = [\"20.0\", \"25.0\", \"30.0\", \"35.0\", \"40.0\", \"45.0\", \"50.0\", \"55.0\", \"60.0\", \"65.0\", \"70.0\", \"75.0\", \"80.0\", \"85.0\", \"90.0\", \"95.0\", \"100.0\", \"105.0\", \"110.0\", \"115.0\", \"120.0\", \"125.0\", \"130.0\", \"135.0\", \"140.0\", \"145.0\", \"150.0\", \"155.0\", \"160.0\", \"165.0\", \"170.0\", \"175.0\", \"180.0\", \"185.0\", \"190.0\", \"195.0\", \"200.0\"]\n\n\t\t\t\t\tlet update_output = () => {\n\t\t\t\t\t\toutput_el.value = displays[input_el.valueAsNumber - 1]\n\t\t\t\t\t}\n\t\t\t\t\t\n\t\t\t\t\tinput_el.addEventListener(\"input\", update_output)\n\t\t\t\t\t// We also poll for changes because the `input_el.value` can change from the outside, e.g. https://github.com/JuliaPluto/PlutoUI.jl/issues/277\n\t\t\t\t\tlet id = setInterval(update_output, 200)\n\t\t\t\t\tinvalidation.then(() => {\n\t\t\t\t\t\tclearInterval(id)\n\t\t\t\t\t\tinput_el.removeEventListener(\"input\", update_output)\n\t\t\t\t\t})\n\t\t\t\t\t</script><output style='\n\t\t\t\t\t\tfont-family: system-ui;\n\t\t\t\t\t\tfont-variant-numeric: tabular-nums;\n    \t\t\t\t\tfont-size: 15px;\n    \t\t\t\t\tmargin-left: 3px;\n    \t\t\t\t\ttransform: translateY(-4px);\n    \t\t\t\t\tdisplay: inline-block;'>100.0</output></bond> s</p>\n</div>"""

