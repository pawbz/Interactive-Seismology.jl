text_representation = """<div class=\"markdown\"><p>From the above plots, we can observe that there are no zeros in either &#40;0,β₁&#41; or &#40;β₂, ∞&#41;. Therefore, we will now find the zeros of <code>F</code> in the interval &#91;β₁, β₂&#93;. The <code>find_zeros</code> function from the <a href=\"https://github.com/JuliaMath/Roots.jl\"><code>Roots.jl</code></a> package can be used to search for all zeros in a specified interval in a derivative-free fashion. We only consider the real part of <code>F</code> as the imaginary part is zero in &#91;β₁, β₂&#93;. The zeros correspond to the eigenvalue phase velocities.</p>\n</div>"""

