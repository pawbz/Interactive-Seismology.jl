runtime_ns = 54942249
text_representation = """<div class=\"markdown\"><h1 id=\"Love-Waves\">Love Waves</h1>\n<p>This notebook studies the simplest case of plane Love waves in a single homogeneous layer overlying a homogeneous half-space. This is an eigenvalue problem, where the boundary and the free-surface conditions limit the allowable eigenvalues and eigenfunctions. In other words, for a given frequency, the horizontal slowness can only take special values. It can often happen that more than one value of the horizontal slowness contributes to the Love wave of a particular frequency. </p>\n<p>By interacting with this notebook, we can</p>\n<ul>\n<li><p>visualize the displacement wavefield for different modes;</p>\n</li>\n<li><p>notice the cut-off frequency of the <span class=\"tex\">$n$</span>th order higher mode.</p>\n</li>\n</ul>\n<h5 id=\"Interactive-Seismology-Notebooks\"><a href=\"https://pawbz.github.io/Interactive-Seismology.jl/\">Interactive Seismology Notebooks</a></h5>\n<p>Instructor: <em>Pawan Bharadwaj</em>, Indian Institute of Science, Bengaluru, India</p>\n</div>"""

