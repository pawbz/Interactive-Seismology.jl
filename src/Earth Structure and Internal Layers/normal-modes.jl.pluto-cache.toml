text_representation = """<div class=\"markdown\"><p><strong>Normal mode summation to obtain displacement field:</strong> The displacement field is given by</p>\n<p class=\"tex\">$$u&#40;x,t&#41; &#61; U&#40;x,\\omega&#41;cos&#40;\\omega t&#41; &#61; \\Sigma_nU_n&#40;x,\\omega_n&#41;cos&#40;\\omega_nt&#41;$$</p>\n<p>Here, <span class=\"tex\">$\\omega_n$</span> are the eigen frequencies that we have computed and <span class=\"tex\">$U_n&#40;x,\\omega_n&#41;$</span> are the corresponding eigen functions. The eigen functions also need to be scaled by the position of the source and the source-time function.</p>\n</div>"""

