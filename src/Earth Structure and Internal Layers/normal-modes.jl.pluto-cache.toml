text_representation = """<div class=\"markdown\"><p>Function to return the operator matrix on which Eigen value decomposition needs to be performed for the Strum-Louville formulation. The Eigen value equation is </p>\n<p class=\"tex\">$$\\frac&#123;\\mu&#125;&#123;\\rho&#125;\\frac&#123;\\partial^2 U&#40;x,\\omega&#41;&#125;&#123;\\partial x^2&#125; &#61; -\\omega^2U&#40;x,\\omega&#41;$$</p>\n<p class=\"tex\">$$c^2\\frac&#123;\\partial^2 U&#40;x,\\omega&#41;&#125;&#123;\\partial x^2&#125; &#61; -\\omega^2U&#40;x,\\omega&#41;$$</p>\n<p>Therefore, the matrix operator is <span class=\"tex\">$c^2\\frac&#123;\\partial^2&#125;&#123;\\partial x^2&#125;$</span>.</p>\n</div>"""

