text_representation = """<div class=\"markdown\"><p><a href=\"https://www.gwrinstruments.com/low-frequency-seismology-monitoring.html\">&#91;image source&#93;</a> Spectra of normal modes below <code>1 mHz</code> were measured using a Superconducting Gravimeter &#40;SG&#41;. Normal modes from 3 major earthquakes are compared: Blue - Japan &#40;11 Mar. 2011, Mw&#61;9.0&#41;, Red - Chile &#40;27 Feb. 2010, Mw&#61;8.8&#41;, and Black - Sumatra &#40;26 Dec. 2004, Mw&#61;9.3&#41;. Data sets are 60 hours long starting 4 hours after the onset of each event and were recorded by SG C021 at Membach, Belgium. </p>\n</div>"""

