text_representation = """<div class=\"markdown\"><p><strong>Definition of matrix operator and Eigen decomposition:</strong> The matrix operator that we are interested in is <span class=\"tex\">$c^2\\frac&#123;\\partial^2&#125;&#123;\\partial x^2&#125;$</span>. The spatial derivative is computed using the Chebyshev spectral method. We do the Eigen value decomposition of this matrix operator after applying the boundary condition.</p>\n</div>"""

