text_representation = """<div class=\"markdown\"><p>Here, we do summation of the normal modes to obtain the total displacement field &#40;<span class=\"tex\">$u&#40;x,t&#41; &#61; U&#40;x,\\omega&#41;cos&#40;\\omega t&#41;$</span>&#41;. The Eigen functions are <span class=\"tex\">$U&#40;x,\\omega&#41;$</span> &#40;eigen vectors of the operator matrix&#41;. The amplitude of each eigen function depends on the position of the source and the source time function. The operation <code>E&#39; * s</code> gives us the amplitude of each eigen function &#40;E is the matrix of eigen vectors&#41;.</p>\n</div>"""

