text_representation = """<div class=\"markdown\"><h1 id=\"Wave-Mode-Duality\">Wave-Mode Duality</h1>\n<p>In this notebook, our goal is to understand the free oscillations of the Earth using the &quot;violin-string&quot; problem. The transverse displacement of the string is denoted using <span class=\"tex\">$u$</span>, which can be expanded as</p>\n<p class=\"tex\">$$u&#40;x,t&#41; &#61; \\Sigma_&#123;n&#125; a_n u_n&#40;x,t&#41;, $$</p>\n<p>with constants <span class=\"tex\">$a_n$</span> and free oscillations or normal modes <span class=\"tex\">$u_n$</span>.  The source-free elastic wave equation can be written in terms of a coupled  first-order system.</p>\n<p class=\"tex\">$$\\partial_t&#40;\\sigma&#41;-\\mu\\partial_x&#40;\\dot&#123;u&#125;&#41; &#61; 0;$$</p>\n<p class=\"tex\">$$\\rho \\partial_t&#40;\\dot&#123;u&#125;&#41;-\\partial_x\\sigma&#61;0.$$</p>\n<p>We use the method of separation of variables to arrive at a Sturm–Liouville eigenvalue problem. We solve this eigenvalue problem to obtain the normal-mode solutions using Chebyshev pseudo-spectral method. After summing the normal-mode solutions at each time step, we obtain &quot;propagating waves&quot; from the sources, similar to using the Runge-Kutta time extrapolation method to solve the first-order system. There are two different ways of representing displacements: normal-mode  summation, and propagating waves. </p>\n<p>Similarly, there are two methods we use to solve for surface waves in seismology: one where we extrapolate in depth using a shooting method to match the boundary conditions; or alternatively, solve an eigenvalue problem. </p>\n<h5 id=\"Interactive-Seismology-Notebooks\"><a href=\"https://pawbz.github.io/Interactive-Seismology.jl/\">Interactive Seismology Notebooks</a></h5>\n<p>Instructor: <em>Pawan Bharadwaj</em>, Indian Institute of Science, Bengaluru, India</p>\n</div>"""

