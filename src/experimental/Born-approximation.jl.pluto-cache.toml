text_representation = """<div class=\"pluto-docs-binding\">\n<span id=\"G0\">G0</span>\n<div class=\"markdown\"><pre><code class=\"language-julia\">G0&#40;rx, rz, sx, sz, k, rho&#41;</code></pre>\n<p>The 2-D acoustic Green&#39;s function for a homogeneous medium: the frequency-domain response at <code>&#40;rx, rz&#41;</code> to a unit impulsive point source at <code>&#40;sx, sz&#41;</code>, wavenumber <code>k &#61; omega/c</code> and density <code>rho</code>. Built from the zero-order Hankel function of the second kind – an outgoing cylindrical wave under the <span class=\"tex\">$e^&#123;-i\\omega t&#125;$</span> convention this notebook uses throughout.</p>\n\n\n</div>\n</div>\n"""

