text_representation = """<div class=\"pluto-docs-binding\">\n<span id=\"get_scattered_wavefield\">get_scattered_wavefield</span>\n<div class=\"markdown\"><pre><code class=\"language-julia\">get_scattered_wavefield&#40;dm, G, acq, pa&#41;</code></pre>\n<p>The Born-approximate scattered field at every receiver, in the time domain, for a squared-slowness perturbation field <code>dm</code> &#40;<code>&#40;nz,nx&#41;</code>, Julia&#39;s own natural column-major layout&#41; and its precomputed sensitivity operator <code>G</code> &#40;from <a href=\"@ref\"><code>get_forward_operator</code></a>&#41;: one matrix-vector product <span class=\"tex\">$\\delta d &#61; G\\,\\delta m$</span> followed by an inverse FFT. Returns an <code>&#40;nt, nr&#41;</code> array.</p>\n\n\n</div>\n</div>\n"""

