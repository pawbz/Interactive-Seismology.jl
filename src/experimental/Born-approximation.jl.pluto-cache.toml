text_representation = """<div class=\"pluto-docs-binding\">\n<span id=\"get_forward_operator\">get_forward_operator</span>\n<div class=\"markdown\"><pre><code class=\"language-julia\">get_forward_operator&#40;pa, acq, sloc_x, sloc_z&#41;</code></pre>\n<p>Build the Born single-scattering sensitivity operator <code>G</code> for one source at <code>&#40;sloc_x, sloc_z&#41;</code>, discretizing <span class=\"tex\">$&#40;\\star&#41;$</span> above over <code>pa</code>&#39;s spatial grid: <code>G&#91;iω, ir, iz, ix&#93;</code> is the response a unit <code>δm</code> at grid cell <code>&#40;iz, ix&#41;</code> produces at receiver <code>ir</code>, frequency <code>iω</code>, i.e. <span class=\"tex\">$G_0&#40;\\text&#123;scatterer&#125;\\&#33;\\to\\&#33;\\text&#123;receiver&#125;&#41;\\cdot G_0&#40;\\text&#123;source&#125;\\&#33;\\to\\&#33;\\text&#123;scatterer&#125;&#41; \\cdot\\omega^2 F&#40;\\omega&#41;$</span>. Flattened to <code>&#40;nr*nω, nz*nx&#41;</code> so scattering/migration below are plain matrix-vector products, <span class=\"tex\">$\\delta d &#61; G\\,\\delta m$</span> / <span class=\"tex\">$\\delta m_&#123;\\text&#123;image&#125;&#125; &#61; G^&#123;\\&#33;\\top&#125;\\delta d$</span>. The DC frequency row is zeroed &#40;the source spectrum itself carries no DC energy, and <code>k&#61;0</code> would be singular in <code>G0</code> anyway&#41;.</p>\n\n\n</div>\n</div>\n"""
