text_representation = """<div class=\"pluto-docs-binding\">\n<span id=\"acoustic_medium\">acoustic_medium</span>\n<div class=\"markdown\"><pre><code class=\"language-julia\">acoustic_medium&#40;vp0, fpeak, xg, zg; rho0&#61;1000.0&#41;</code></pre>\n<p>Bundle a homogeneous-background medium and its source spectrum into the named tuple every forward/migration function below expects: grid coordinates <code>xgrid</code>/<code>zgrid</code>, the real-FFT frequency grid, the matching wavenumber grid <code>kgrid &#61; 2*pi*freqgrid/vp0</code>, the source amplitude spectrum <code>Fsource</code>, density <code>rho0</code>, and <code>tgrid</code> itself &#40;kept only for the final <code>irfft</code> length&#41;.</p>\n\n\n</div>\n</div>\n"""

