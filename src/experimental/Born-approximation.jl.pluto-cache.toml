text_representation = """<div class=\"pluto-docs-binding\">\n<span id=\"get_reference_wavefield\">get_reference_wavefield</span>\n<div class=\"markdown\"><pre><code class=\"language-julia\">get_reference_wavefield&#40;pa, acq, tgrid&#41;</code></pre>\n<p>The reference &#40;unperturbed&#41; wavefield at every receiver in <code>acq</code>, for every source in <code>acq</code>, in the time domain: builds <span class=\"tex\">$D&#40;\\omega&#41; &#61; G_0&#40;\\text&#123;source&#125;\\&#33;\\to\\&#33;\\text&#123;receiver&#125;&#41;\\,F&#40;\\omega&#41;$</span> then inverse-FFTs it. Returns an <code>&#40;nt, nr, ns&#41;</code> array.</p>\n\n\n</div>\n</div>\n"""

