text_representation = """<div class=\"markdown\"><h2 id=\"From-the-Wave-Equation-to-a-Scattering-Integral\">From the Wave Equation to a Scattering Integral</h2>\n<p>Work in the frequency domain with the scalar &#40;acoustic&#41; Helmholtz equation, written so the medium parameter appears <em>linearly</em> – the squared slowness <span class=\"tex\">$m&#40;\\mathbf x&#41; &#61; 1/c&#40;\\mathbf x&#41;^2$</span>, not the slowness or the velocity itself:</p>\n<p class=\"tex\">$$L&#40;u, m&#41; \\;\\equiv\\; \\omega^2 m\\,u &#43; \\nabla^2 u.$$</p>\n<p>The <strong>background</strong> state has medium <span class=\"tex\">$m_0&#40;\\mathbf x&#41;$</span> and wavefield <span class=\"tex\">$U&#40;\\mathbf x,\\mathbf x_s&#41;$</span> excited by a point source <span class=\"tex\">$F&#40;\\omega&#41;\\delta&#40;\\mathbf x-\\mathbf x_s&#41;$</span>:</p>\n<p class=\"tex\">$$L&#40;U, m_0&#41; &#61; F&#40;\\omega&#41;\\,\\delta&#40;\\mathbf x - \\mathbf x_s&#41;.$$</p>\n<p>The <strong>perturbed</strong> state – what you get once you paint scatterers – adds a small <span class=\"tex\">$\\delta m&#40;\\mathbf x&#41;$</span> &#40;what the widget&#39;s brush actually paints&#41; and the wavefield responds with a correction <span class=\"tex\">$\\delta U$</span>:</p>\n<p class=\"tex\">$$L&#40;U&#43;\\delta U,\\ m_0&#43;\\delta m&#41; &#61; F&#40;\\omega&#41;\\,\\delta&#40;\\mathbf x - \\mathbf x_s&#41;.$$</p>\n<p>Subtract the background equation from the perturbed one and expand:</p>\n<p class=\"tex\">$$\\underbrace&#123;\\omega^2 m_0\\,\\delta U &#43; \\nabla^2\\delta U&#125;_&#123;L&#40;\\delta U,\\, m_0&#41;&#125; \\;&#43;\\; \\omega^2\\delta m\\,&#40;U&#43;\\delta U&#41; \\;&#61;\\; 0.$$</p>\n<div class=\"admonition danger\"><p class=\"admonition-title\">The Born approximation, in one line</p><p>The term <span class=\"tex\">$\\omega^2\\delta m\\,\\delta U$</span> is second order – a product of two already-small quantities. <strong>Dropping it</strong> is the entire Born approximation: it linearizes the scattering problem by keeping <span class=\"tex\">$\\delta U$</span> only to first order in <span class=\"tex\">$\\delta m$</span>, i.e. it accounts for a wave scattering <em>once</em> off the heterogeneity, never twice. What survives is a wave equation for <span class=\"tex\">$\\delta U$</span> sourced by the <em>background</em> field <span class=\"tex\">$U$</span> scattering off <span class=\"tex\">$\\delta m$</span>:</p>\n</div>\n<p class=\"tex\">$$L&#40;\\delta U,\\ m_0&#41; \\;&#61;\\; -\\,\\omega^2\\delta m\\, U. \\qquad&#40;\\text&#123;Born&#125;&#41;$$</p>\n</div>"""

