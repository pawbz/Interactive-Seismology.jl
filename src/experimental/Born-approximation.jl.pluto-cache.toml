runtime_ns = 654334
text_representation = """<div class=\"markdown\"><div class=\"admonition correct\"><p class=\"admonition-title\">Checking that migration really is the adjoint of modeling</p><p><code>get_migration_image</code> only makes physical sense as &quot;running the physics backwards&quot; if <code>G&#39;</code> is genuinely the adjoint of <code>G</code> under the standard complex inner product <span class=\"tex\">$\\\\langle u,v\\\\rangle&#61;\\\\overline&#123;u&#125;^&#123;\\\\&#33;\\\\top&#125;v$</span>, i.e. <span class=\"tex\">$\\\\langle Gs,d\\\\rangle &#61; \\\\langle s,G^&#123;\\\\&#33;\\\\top&#125;d\\\\rangle$</span> for <em>any</em> <code>s</code>, <code>d</code> – not just for the specific fields this notebook happens to compute. Checked below on a small, self-contained problem with random <code>s</code>/<code>d</code> &#40;Julia&#39;s <code>&#39;</code> on a complex matrix <em>is</em> the conjugate transpose, so this is exactly testing what <code>get_migration_image</code> uses&#41;.</p>\n</div>\n</div>"""

