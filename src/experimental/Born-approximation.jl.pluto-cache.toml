text_representation = """<div class=\"markdown\"><h2 id=\"The-Scattering-Integral-and-Its-Adjoint\">The Scattering Integral and Its Adjoint</h2>\n<p>&#40;Born&#41; is a wave equation for <span class=\"tex\">$\\delta U$</span> with a source term <span class=\"tex\">$-\\omega^2\\delta m\\,U$</span> spread over the whole scattering volume, not a point – Green&#39;s-function machinery turns it into an explicit integral. Let <span class=\"tex\">$G&#40;\\mathbf x,\\mathbf x_r&#41;$</span> solve the <em>same</em> background operator for an impulsive point source at the receiver, <span class=\"tex\">$L&#40;G,m_0&#41;&#61;\\delta&#40;\\mathbf x-\\mathbf x_r&#41;$</span>. Combining it with &#40;Born&#41; via Green&#39;s second identity, and using that a volume scatterer&#39;s outgoing waves satisfy the Sommerfeld radiation condition &#40;so the usual surface-integral term vanishes&#41;, gives the <strong>Born scattering integral equation</strong>:</p>\n<p class=\"tex\">$$\\delta U&#40;\\mathbf x_r,\\mathbf x_s&#41; \\;&#61;\\; -\\,\\omega^2\\&#33;\\int_V G&#40;\\mathbf x,\\mathbf x_r&#41;\\,\\delta m&#40;\\mathbf x&#41;\\,U&#40;\\mathbf x,\\mathbf x_s&#41;\\;dV&#40;\\mathbf x&#41;.$$</p>\n<p>Since the background field is itself just the source convolved with the background Green&#39;s function, <span class=\"tex\">$U&#40;\\mathbf x,\\mathbf x_s&#41;&#61;G&#40;\\mathbf x,\\mathbf x_s&#41;F&#40;\\omega&#41;$</span>, this becomes</p>\n<p class=\"tex\">$$\\delta U&#40;\\mathbf x_r,\\mathbf x_s&#41; \\;&#61;\\; -\\,\\omega^2 F&#40;\\omega&#41;\\&#33;\\int_V G&#40;\\mathbf x,\\mathbf x_r&#41;\\,G&#40;\\mathbf x,\\mathbf x_s&#41;\\,\\delta m&#40;\\mathbf x&#41;\\;dV&#40;\\mathbf x&#41;. \\qquad&#40;\\star&#41;$$</p>\n<p>Discretizing <span class=\"tex\">$&#40;\\star&#41;$</span> over the grid you paint on turns the integral into a matrix-vector product <span class=\"tex\">$\\delta d &#61; G\\,\\delta m$</span> – exactly what <a href=\"@ref\"><code>get_forward_operator</code></a> builds and <a href=\"@ref\"><code>get_scattered_wavefield</code></a> applies, one entry of <span class=\"tex\">$G$</span> per &#40;frequency, receiver, grid cell&#41; combination.</p>\n<div class=\"admonition tip\"><p class=\"admonition-title\">Migration: running the physics backwards</p><p><span class=\"tex\">$&#40;\\star&#41;$</span> is <em>linear</em> in <span class=\"tex\">$\\delta m$</span>, so the cheapest possible estimate of <span class=\"tex\">$\\delta m$</span> from observed data <span class=\"tex\">$\\delta d$</span> is to apply the <strong>adjoint</strong> of <span class=\"tex\">$G$</span> instead of solving a linear system: <span class=\"tex\">$\\delta m_&#123;\\text&#123;image&#125;&#125; &#61; G^&#123;\\&#33;\\top&#125;\\delta d$</span>. This is exactly <a href=\"@ref\"><code>get_migration_image</code></a> – literally the forward-modeling operator run backwards. It is not a true inverse &#40;<span class=\"tex\">$G^&#123;\\&#33;\\top&#125;G\\neq I$</span> in general&#41;, so the recovered image is smeared and amplitude-distorted compared to what you painted – but it&#39;s the foundation every more elaborate seismic imaging algorithm builds on, and the widget&#39;s migration panel lets you see directly how much aperture &#40;how many live sources and receivers&#41; it takes to make that smearing tolerable.</p>\n</div>\n</div>"""

