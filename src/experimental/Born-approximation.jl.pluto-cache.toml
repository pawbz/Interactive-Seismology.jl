text_representation = """<div class=\"pluto-docs-binding\">\n<span id=\"source_spectrum\">source_spectrum</span>\n<div class=\"markdown\"><pre><code class=\"language-julia\">source_spectrum&#40;tgrid, fpeak&#41;</code></pre>\n<p>A Gaussian-shaped amplitude spectrum peaked at <code>fpeak</code> Hz, sampled on the real-FFT frequency grid implied by <code>tgrid</code>. Returns <code>&#40;freqgrid, Fsource&#41;</code>; the DC bin is zeroed since a DC source carries no travel-time information here.</p>\n\n\n</div>\n</div>\n"""

