text_representation = """<div class=\"pluto-docs-binding\">\n<span id=\"get_migration_image\">get_migration_image</span>\n<div class=\"markdown\"><pre><code class=\"language-julia\">get_migration_image&#40;δd, G, acq, pa&#41;</code></pre>\n<p>The migrated &#40;adjoint-recovered&#41; image from time-domain scattered data <code>δd</code> &#40;<code>nt × nr</code>&#41;: forward- FFT the data, then apply the adjoint of the same sensitivity operator <code>G</code> used to model it, <span class=\"tex\">$\\delta m_&#123;\\text&#123;image&#125;&#125; &#61; G^&#123;\\&#33;\\top&#125;\\delta d$</span> – literally running the forward operator backwards, per the &quot;Migration&quot; tip above. Returns the real part, reshaped to <code>&#40;nz, nx&#41;</code>.</p>\n\n\n</div>\n</div>\n"""

