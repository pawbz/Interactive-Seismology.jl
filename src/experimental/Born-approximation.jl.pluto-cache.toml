text_representation = """<div class=\"markdown\"><h1 id=\"Born-Approximation\">Born Approximation</h1>\n<p>A seismic wave crossing a heterogeneous Earth does two things at once: it propagates through the smooth background structure, and it <strong>scatters</strong> off whatever local heterogeneities it encounters – a fracture, an ore body, a buried fault. The Born approximation is the standard way to make that second effect tractable: treat the scattered field as a small, <em>linear</em> correction on top of the background field, valid as long as the heterogeneity is weak enough that multiply-scattered energy is negligible.</p>\n<p>This notebook derives that linearization, then hands you a widget where you <strong>paint scatterers directly onto a subsurface model</strong> and watch three things update live: the scattered wavefield propagating away from what you painted, the data it produces at a receiver array, and – the real payoff – the <strong>migration image</strong>, the cheapest possible linear inverse, which tries to recover your painted scatterers from the recorded data alone.</p>\n<h5 id=\"Interactive-Seismology-Notebooks\"><a href=\"https://pawbz.github.io/Interactive-Seismology.jl/\">Interactive Seismology Notebooks</a></h5>\n<p>Instructor: <em>Pawan Bharadwaj</em>, Indian Institute of Science, Bengaluru, India</p>\n</div>"""

