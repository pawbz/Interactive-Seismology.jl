text_representation = """<div class=\"markdown\"><h2 id=\"Mohr-Coulomb-Failure-&amp;-Pore-Pressure\">Mohr-Coulomb Failure &amp; Pore Pressure</h2>\n<p>Rock &#40;and fault gouge&#41; resists shear up to a limit that grows with how hard the fault is being clamped shut — the <strong>Mohr-Coulomb failure criterion</strong>,</p>\n<p class=\"tex\">$$\\tau &#61; \\mu\\,\\sigma_&#123;n,\\mathrm&#123;eff&#125;&#125; &#43; c_0,$$</p>\n<p>with friction coefficient <span class=\"tex\">$\\mu$</span> &#40;≈0.6–0.85 for most rock — Byerlee&#39;s law&#41; and cohesion <span class=\"tex\">$c_0$</span>. Drawn on the Mohr diagram, it&#39;s the red line: any plane whose point sits <em>above</em> the line is unstable — the widget&#39;s stability verdict flags exactly this. Because the line only depends on the <em>orientation-independent</em> <span class=\"tex\">$\\mu,c_0$</span> while the circle depends on the full stress state, whether <em>any</em> plane fails at all is really a question about the <strong>big circle</strong>: if it&#39;s small and low enough to clear the line everywhere, the rock is stable on every orientation; if it grows enough to touch the line, some critically-oriented plane sits right at failure. The &quot;Critically stressed&quot; preset is built to sit almost exactly on that boundary — drag the plane normal around and find the orientation where the marker meets the line.</p>\n<div class=\"admonition danger\"><p class=\"admonition-title\">Induced seismicity</p><p><span class=\"tex\">$\\sigma_&#123;n,\\mathrm&#123;eff&#125;&#125; &#61; \\sigma_n - P_p$</span> is the <strong>effective stress principle</strong>: pore fluid pressure <span class=\"tex\">$P_p$</span> pushes back against the confining stress, reducing how hard a fault is actually clamped shut <em>without changing the tectonic stress</em> <span class=\"tex\">$\\sigma$</span> <em>at all</em>. Pumping fluid underground &#40;wastewater injection, geothermal stimulation, hydraulic fracturing&#41; raises <span class=\"tex\">$P_p$</span> directly. On the widget&#39;s Mohr diagram this shows up as a <strong>leftward shift</strong> of the point at fixed <span class=\"tex\">$\\tau$</span> — drag the <span class=\"tex\">$P_p$</span> slider on an already-close-to-failure state &#40;try &quot;Critically stressed&quot;&#41; and watch the point cross the line with <em>zero</em> change to the stress tensor itself. This is the accepted mechanism behind most documented cases of injection-induced earthquakes.</p>\n</div>\n</div>"""

