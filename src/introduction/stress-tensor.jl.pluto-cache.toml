text_representation = """<div class=\"markdown\"><h2 id=\"Mean-and-Deviatoric-Stress\">Mean and Deviatoric Stress</h2>\n<p>Just like strain, the stress tensor splits into an <strong>isotropic</strong> part and a <strong>deviatoric</strong> remainder. The mean &#40;hydrostatic&#41; stress</p>\n<p class=\"tex\">$$p &#61; \\tfrac13\\operatorname&#123;tr&#125;&#40;\\sigma&#41; &#61; \\tfrac13&#40;\\sigma_&#123;11&#125;&#43;\\sigma_&#123;22&#125;&#43;\\sigma_&#123;33&#125;&#41;$$</p>\n<p>is the same in every direction — pure confining pressure &#40;negative <span class=\"tex\">$p$</span>&#41; or pure tension &#40;positive <span class=\"tex\">$p$</span>&#41; — with <strong>zero shear on any plane at all</strong> &#40;try the &quot;Hydrostatic&quot; preset in the widget above and watch the Mohr circles collapse to a single point on the axis&#41;. Everything else, <span class=\"tex\">$\\sigma&#39; &#61; \\sigma - p\\,\\mathbb&#123;I&#125;$</span>, is the <strong>deviatoric stress</strong>: the part that actually has a shape/shear character and is capable of driving failure. This is the same split that separates P-wave-like volume change from S-wave-like shape change in the strain notebook — here it separates the part of <span class=\"tex\">$\\sigma$</span> that just squeezes a rock &#40;irrelevant to whether it fails in shear&#41; from the part that can actually break it.</p>\n</div>"""

