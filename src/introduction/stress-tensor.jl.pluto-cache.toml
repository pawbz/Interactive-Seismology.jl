text_representation = """<div class=\"markdown\"><h2 id=\"Cauchy&#39;s-Traction-Theorem\">Cauchy&#39;s Traction Theorem</h2>\n<p>For any plane through a point, with unit normal <span class=\"tex\">$\\mathbf&#123;n&#125;$</span>, the <strong>traction</strong> — force per unit area exerted across that plane — is exactly the stress tensor contracted with the normal:</p>\n<p class=\"tex\">$$\\mathbf&#123;t&#125; &#61; \\sigma \\mathbf&#123;n&#125;, \\qquad t_i &#61; \\sigma_&#123;ij&#125; n_j.$$</p>\n<p>This is Cauchy&#39;s stress theorem: it says the traction on <em>any</em> orientation is completely determined by the same six independent components of <span class=\"tex\">$\\sigma$</span> — you never need more than the tensor itself, no matter which plane you ask about. Splitting <span class=\"tex\">$\\mathbf&#123;t&#125;$</span> into the part along <span class=\"tex\">$\\mathbf&#123;n&#125;$</span> and the part perpendicular to it gives exactly the two quantities that matter for fault mechanics:</p>\n<p class=\"tex\">$$\\sigma_n &#61; \\mathbf&#123;n&#125;\\cdot\\mathbf&#123;t&#125; &#61; n_i\\sigma_&#123;ij&#125;n_j, \\qquad\n\\boldsymbol\\tau &#61; \\mathbf&#123;t&#125; - \\sigma_n\\mathbf&#123;n&#125;.$$</p>\n<p><span class=\"tex\">$\\sigma_n$</span> &#40;a scalar&#41; is the <strong>normal stress</strong> — positive means the plane is being pulled apart, negative means squeezed shut. <span class=\"tex\">$\\boldsymbol\\tau$</span> &#40;a vector, tangent to the plane&#41; is the <strong>shear traction</strong> — the part that actually drives slip. The widget above computes exactly these two quantities live, for whichever plane you&#39;re currently dragging: the red/blue arrow is <span class=\"tex\">$\\sigma_n\\mathbf&#123;n&#125;$</span>, the orange arrow is <span class=\"tex\">$\\boldsymbol\\tau$</span>.</p>\n</div>"""

