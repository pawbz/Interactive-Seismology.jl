text_representation = """<div class=\"markdown\"><h2 id=\"Principal-Stresses\">Principal Stresses</h2>\n<p>Because <span class=\"tex\">$\\sigma$</span> is symmetric, it has three real eigenvalues <span class=\"tex\">$\\sigma_1\\ge\\sigma_2\\ge\\sigma_3$</span> — the <strong>principal stresses</strong> — with an orthonormal set of eigenvectors, the <strong>principal axes</strong>. On a plane oriented exactly along a principal axis, the shear traction vanishes identically: the traction there is <em>purely</em> normal, equal to the corresponding eigenvalue. Every other orientation mixes some shear in. This is exactly what the red/blue triad drawn on the sphere in the widget shows &#40;red &#61; tensile, blue &#61; compressive principal stress&#41; — the three directions where dragging the handle would make the orange shear arrow disappear entirely.</p>\n<p>As a worked numeric example &#40;independent of whatever stress state you&#39;ve dragged the widget to — this uses the notebook&#39;s original default <span class=\"tex\">$\\sigma$</span>&#41;:</p>\n</div>"""

