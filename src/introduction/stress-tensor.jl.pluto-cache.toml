text_representation = """<div class=\"markdown\"><h2 id=\"Mohr-Circle-for-Stress\">Mohr Circle for Stress</h2>\n<p>Plotting <span class=\"tex\">$&#40;\\sigma_n,\\tau&#41;$</span> for <em>every possible</em> plane orientation traces out a region bounded by three circles built from the principal stresses — the classical <strong>Mohr diagram</strong> &#40;right-hand panel of the widget, plotted with <strong>compression positive</strong>, the rock-mechanics convention&#41;. The outer circle spans the two extreme principal stresses, <span class=\"tex\">$C&#61;\\tfrac12&#40;\\sigma_1&#43;\\sigma_3&#41;$</span>, <span class=\"tex\">$R&#61;\\tfrac12&#40;\\sigma_1-\\sigma_3&#41;$</span>; two smaller circles between each adjacent pair of principal stresses sit inside it. Every physically realizable plane&#39;s <span class=\"tex\">$&#40;\\sigma_n,\\tau&#41;$</span> point lies inside the big circle and outside the two small ones — drag the handle on the sphere and watch the marker sweep across exactly that shaded region, never outside it.</p>\n<p>The point for the <em>current</em> dragged plane is computed directly &#40;not just placed approximately in the shaded region&#41;: writing the normal in the principal-axis frame as <span class=\"tex\">$&#40;n_1,n_2,n_3&#41;$</span>,</p>\n<p class=\"tex\">$$\\sigma_n &#61; \\sum_i \\sigma_i n_i^2, \\qquad\n\\tau &#61; \\sqrt&#123;\\sum_i &#40;\\sigma_i n_i&#41;^2 - \\sigma_n^2&#125;.$$</p>\n</div>"""

