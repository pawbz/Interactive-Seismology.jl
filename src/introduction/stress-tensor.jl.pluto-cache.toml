text_representation = """<div class=\"markdown\"><h1 id=\"Stress-Tensor\">Stress Tensor</h1>\n<p>A fault is just a plane cutting through rock. Whether it slips depends entirely on the <strong>stress acting on that one plane</strong> — not the full 3×3 stress tensor <span class=\"tex\">$\\sigma$</span> by itself, but what you get when you project <span class=\"tex\">$\\sigma$</span> onto a particular orientation: a <strong>normal</strong> stress that clamps the fault shut &#40;or pries it open&#41; and a <strong>shear</strong> stress that drives it to slip. This notebook is built around that one question — <em>for a given</em> <span class=\"tex\">$\\sigma$</span><em>, what is the traction on a plane with normal</em> <span class=\"tex\">$\\mathbf&#123;n&#125;$</span><em>, and when is it enough to cause failure?</em></p>\n<div class=\"admonition note\"><p class=\"admonition-title\">Sign convention</p><p>Stress here is <strong>tension-positive</strong> &#40;the elasticity/seismology convention, matching the <span class=\"tex\">$s_&#123;ij&#125;$</span> sliders in the widget below&#41;: a positive normal stress pulls the plane apart, a negative one compresses it. The <strong>Mohr diagram</strong> panel of the widget flips this and plots <strong>compression as positive</strong> instead — the standard convention in rock and fault mechanics, where the interesting physics &#40;friction, failure&#41; only happens under compression. Watch for the flipped sign once here and the rest follows.</p>\n</div>\n<p>Drag the white handle on the sphere below to choose a plane; the widget decomposes the traction on that plane live, plots it on a classical <strong>Mohr circle for stress</strong>, and overlays a <strong>Mohr-Coulomb failure criterion</strong> with an adjustable <strong>pore pressure</strong> — the mechanism behind injection-induced seismicity, where pumping fluid into the ground can trigger an earthquake on a fault that was already close to failure, with no change in the tectonic stress at all.</p>\n<h5 id=\"Interactive-Seismology-Notebooks\"><a href=\"https://pawbz.github.io/Interactive-Seismology.jl/\">Interactive Seismology Notebooks</a></h5>\n<p>Instructor: <em>Pawan Bharadwaj</em>, Indian Institute of Science, Bengaluru, India</p>\n</div>"""
