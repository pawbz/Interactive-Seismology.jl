text_representation = """<div class=\"markdown\"><h3 id=\"The-numerical-model\">The numerical model</h3>\n<p>The stiffness matrix represents identical springs and fixed ends. The widget provides the mass matrix, then Julia solves the generalized symmetric eigenproblem and returns the selected eigenvector to the browser canvas.</p>\n</div>"""

