text_representation = """<div class=\"markdown\"><h2 id=\"From-springs-to-seismic-normal-modes\">From springs to seismic normal modes</h2>\n<p>The motion is a matrix version of the single oscillator. For displacement vector <span class=\"tex\">$\\mathbf&#123;u&#125;$</span>, the system satisfies</p>\n<p class=\"tex\">$$\\mathbf&#123;M&#125;\\,\\ddot&#123;\\mathbf&#123;u&#125;&#125; &#43; \\mathbf&#123;K&#125;\\,\\mathbf&#123;u&#125; &#61; 0,\n\\qquad\n\\mathbf&#123;K&#125;\\,\\mathbf&#123;U&#125;_j &#61; \\omega_j^2\\mathbf&#123;M&#125;\\,\\mathbf&#123;U&#125;_j .$$</p>\n<p>Each eigenvector <span class=\"tex\">$\\mathbf&#123;U&#125;_j$</span> is a normal-mode shape and each <span class=\"tex\">$\\omega_j$</span> is its angular frequency. A non-uniform mass matrix changes both. This is the small-system analogue of how Earth structure changes the frequencies and shapes of seismic normal modes.</p>\n<div class=\"admonition tip\"><p class=\"admonition-title\">A useful experiment</p><p>Keep all masses at <code>1.00</code>, play mode 1, then increase one middle mass. The animation shows the distorted mode shape; the bar chart reports the associated frequency changes.</p>\n</div>\n</div>"""

