text_representation = """<div class=\"markdown\"><h1 id=\"Coupled-Oscillations\">Coupled Oscillations</h1>\n<p>This notebook creates an interactive environment to explore the coupled oscillations of <code>N</code> particles attached to springs. We write the equation of motion for each of the particles and then solve for the modes of the system. The user can select a particular mode to visualize the oscillations. Notice that all the particles oscillate in phase given a particular mode. This exercise will help us transition from the oscillations of one particle to the oscillations of a continuous object, that is, seismic waves.</p>\n<h5 id=\"Interactive-Seismology-Notebooks\"><a href=\"https://pawbz.github.io/Interactive-Seismology.jl/\">Interactive Seismology Notebooks</a></h5>\n<p>Instructor: <em>Pawan Bharadwaj</em>, Indian Institute of Science, Bengaluru, India</p>\n</div>"""

