text_representation = """<div class=\"markdown\"><h1 id=\"Simple-harmonic-motion:-make-the-initial-conditions-visible\">Simple harmonic motion: make the initial conditions visible</h1>\n<p>An oscillator is the smallest possible model of a vibrating Earth. Pull a mass away from equilibrium, give it an initial velocity, and its later motion is no longer a guess: the equation of motion determines every point on the time history.</p>\n<p>This notebook keeps that connection in view. Your hand sets the initial condition; the animation, graph, and exact solution all update together.</p>\n</div>"""

