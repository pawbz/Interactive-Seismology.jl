text_representation = """<div class=\"markdown\"><h2 id=\"From-a-restoring-force-to-an-equation\">From a restoring force to an equation</h2>\n<p>The spring pulls toward equilibrium, so its force is <span class=\"tex\">$F_s&#61;-kx$</span>. The dashpot opposes velocity, <span class=\"tex\">$F_d&#61;-c\\dot&#123;x&#125;$</span>. Newton&#39;s law gives</p>\n<p class=\"tex\">$$m\\ddot&#123;x&#125; &#43; c\\dot&#123;x&#125; &#43; kx &#61; 0.$$</p>\n<p>The two initial conditions are indispensable: <span class=\"tex\">$x&#40;0&#41;&#61;x_0$</span> says where the block starts; <span class=\"tex\">$\\dot&#123;x&#125;&#40;0&#41;&#61;v_0$</span> says how it is launched. The widget&#39;s blue curve is the solution to this equation with exactly those two numbers.</p>\n</div>"""

