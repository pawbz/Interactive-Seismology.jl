text_representation = """<div class=\"pluto-docs-binding\">\n<span id=\"exact_displacement\">exact_displacement</span>\n<div class=\"markdown\"><pre><code class=\"language-julia\">exact_displacement&#40;t, m, k, ζ, x₀, v₀&#41;</code></pre>\n<p>Return the exact displacement of a free mass–spring–damper system at time <code>t</code>. The branch is chosen by the damping ratio, while <code>x₀</code> and <code>v₀</code> enforce the two initial conditions.</p>\n\n\n</div>\n</div>\n"""

