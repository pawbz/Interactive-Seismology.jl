text_representation = """<div class=\"markdown\"><h2 id=\"Why-seismologists-care\">Why seismologists care</h2>\n<p>A real Earth has enormously many coupled degrees of freedom, but each normal mode has the same temporal form as this one oscillator. An earthquake supplies initial displacement and velocity; Earth structure sets the mode frequency; attenuation supplies weak damping.</p>\n<p>For light damping, the seismic quality factor is approximately <span class=\"tex\">$Q \\approx 1/&#40;2\\zeta&#41;$</span>. Large <span class=\"tex\">$Q$</span> means many visible cycles before the envelope fades. The coupled-oscillations notebook is the natural next step: replace this one mass with many masses and the single frequency becomes a family of normal modes.</p>\n</div>"""

