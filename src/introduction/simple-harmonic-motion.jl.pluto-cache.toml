text_representation = """<div class=\"markdown\"><h3 id=\"The-interactive-widget\">The interactive widget</h3>\n<p>The canvas keeps a fixed logical coordinate system and uses a device-pixel-ratio transform for a sharp display. Dragging therefore remains physically calibrated while the graphic stays clear on high-resolution laptop and projector screens.</p>\n</div>"""

