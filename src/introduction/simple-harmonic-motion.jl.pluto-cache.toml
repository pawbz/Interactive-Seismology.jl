text_representation = """<div class=\"markdown\"><h2 id=\"Damping-changes-the-kind-of-solution\">Damping changes the <em>kind</em> of solution</h2>\n<p>The damping ratio <span class=\"tex\">$\\zeta&#61;c/&#40;2\\sqrt&#123;km&#125;&#41;$</span> compares the actual damping to the critical value. It is more informative than <span class=\"tex\">$c$</span> alone because it stays meaningful when mass or stiffness changes.</p>\n<table><tr><th align=\"left\">Setting</th><th align=\"left\">What you see</th><th align=\"left\">Mathematical signature</th></tr><tr><td align=\"left\"><span class=\"tex\">$\\zeta&#61;0$</span></td><td align=\"left\">perpetual oscillation</td><td align=\"left\">sine and cosine</td></tr><tr><td align=\"left\"><span class=\"tex\">$0&lt;\\zeta&lt;1$</span></td><td align=\"left\">oscillation inside a shrinking envelope</td><td align=\"left\"><span class=\"tex\">$e^&#123;-\\zeta\\omega_n t&#125;$</span> times a sinusoid</td></tr><tr><td align=\"left\"><span class=\"tex\">$\\zeta&#61;1$</span></td><td align=\"left\">fastest return without overshoot</td><td align=\"left\">exponential times a line</td></tr><tr><td align=\"left\"><span class=\"tex\">$\\zeta&gt;1$</span></td><td align=\"left\">slow, non-oscillatory return</td><td align=\"left\">sum of two exponentials</td></tr></table>\n<div class=\"admonition warning\"><p class=\"admonition-title\">Critical damping is not the most damping</p><p>It is the boundary between oscillatory and non-oscillatory motion. Adding more damping does not make the block settle faster; it makes the long, slow exponential tail stronger.</p>\n</div>\n</div>"""

