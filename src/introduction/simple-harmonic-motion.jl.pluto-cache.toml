text_representation = """<div class=\"markdown\"><h2 id=\"Pull,-release,-and-read-the-answer\">Pull, release, and read the answer</h2>\n<p>Drag the blue block horizontally to set the initial displacement <span class=\"tex\">$x_0$</span>. Use the initial velocity control when you want to launch it rather than release it from rest. The red line on the time-history plot is the instant currently shown in the mechanical model.</p>\n<div class=\"admonition tip\"><p class=\"admonition-title\">A useful first experiment</p><p>Start with <strong>undamped</strong>, drag the block, and press Play. Then change only the mass or stiffness. The amplitude stays fixed, but the clock runs at a different rate.</p>\n</div>\n</div>"""

