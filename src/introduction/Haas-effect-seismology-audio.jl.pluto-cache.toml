text_representation = """<div class=\"markdown\"><h2 id=\"One-idea,-two-laboratories\">One idea, two laboratories</h2>\n<table><tr><th align=\"left\">A room: hearing echoes</th><th align=\"left\">Earth: interpreting seismograms</th></tr><tr><td align=\"left\">A <strong>speaker</strong> launches a sound</td><td align=\"left\">An <strong>earthquake</strong> launches seismic energy</td></tr><tr><td align=\"left\"><strong>Acoustic</strong> waves travel through air</td><td align=\"left\"><strong>Elastic</strong> waves travel through rock</td></tr><tr><td align=\"left\">Two walls make paths and echoes</td><td align=\"left\">The <strong>surface</strong> and <strong>CMB</strong> act as two great reflecting boundaries</td></tr><tr><td align=\"left\">A microphone records air-pressure variations</td><td align=\"left\">A seismometer records ground motion</td></tr><tr><td align=\"left\">Direct sound, wall reflections, multiple echoes</td><td align=\"left\">Direct P, PP/reflections, and multiples</td></tr><tr><td align=\"left\">The auditory system fuses or suppresses reflections</td><td align=\"left\">A seismologist identifies and interprets phases</td></tr></table>\n<div class=\"admonition danger\"><p class=\"admonition-title\">The incoming wavefield is not the perception</p><p>A microphone and a seismometer report what arrives. Ears and seismologists must infer what produced those arrivals.</p>\n</div>\n</div>"""

