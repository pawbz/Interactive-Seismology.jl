text_representation = """<div class=\"markdown\"><h2 id=\"The-question-to-ask\">The question to ask</h2>\n<blockquote>\n<p><strong>“If our ears behaved like a seismometer, every room would sound like a cave.”</strong></p>\n</blockquote>\n<p>Why do rooms usually sound simple instead? The brain must infer a source and suppress or reinterpret reflections — the same broad task a seismologist faces when separating direct arrivals, reflected phases, and multiples in a seismogram.</p>\n</div>"""

