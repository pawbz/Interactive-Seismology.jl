text_representation = """<div class=\"markdown\"><h2 id=\"Make-one-sound-become-many\">Make one sound become many</h2>\n<p>Use the sentence:</p>\n<blockquote>\n<p>“The Earth has many seismic reflections.”</p>\n</blockquote>\n<p>You can record it directly in the notebook, or load any short audio file. Then play it with a delayed copy. Start with the built-in voiced test signal if you want to explore the timing before recording.</p>\n<div class=\"admonition note\"><p class=\"admonition-title\">Microphone permission</p><p>The notebook asks for microphone access only after you choose <strong>Record sentence</strong>. Nothing is uploaded; the clip stays in the browser tab.</p>\n</div>\n</div>"""

