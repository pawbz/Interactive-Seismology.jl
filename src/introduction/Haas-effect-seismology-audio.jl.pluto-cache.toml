text_representation = """<div class=\"markdown\"><h3 id=\"What-students-should-hear-at--ms\">What students should hear at <strong>107 ms</strong></h3>\n<p><strong>a clear echo</strong></p>\n<table><tr><th align=\"right\">Delay</th><th align=\"left\">Typical perception</th></tr><tr><td align=\"right\">0 ms</td><td align=\"left\">one sound</td></tr><tr><td align=\"right\">5 ms</td><td align=\"left\">one sound</td></tr><tr><td align=\"right\">10 ms</td><td align=\"left\">one sound</td></tr><tr><td align=\"right\">20 ms</td><td align=\"left\">one sound</td></tr><tr><td align=\"right\">40 ms</td><td align=\"left\">beginning of echo</td></tr><tr><td align=\"right\">80 ms</td><td align=\"left\">clear echo</td></tr></table>\n<p>The source waveform has not changed. Only the arrival time of its copy has changed. That is the essential move in reflection seismology.</p>\n<div class=\"admonition warning\"><p class=\"admonition-title\">Who is fooling us: the eyes or the ears?</p><p>Neither. The blue direct trace and red reflected trace really are different incoming waveforms, and the receiver really contains both. But for a short enough delay, the auditory system infers <strong>one source</strong> and fuses the arrivals into one sound. A seismometer does not make that inference: it leaves the direct arrival and reflection together for us to separate.</p>\n</div>\n</div>"""
