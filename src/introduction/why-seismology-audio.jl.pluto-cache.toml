text_representation = """<div class=\"markdown\"><h3 id=\"What-students-should-hear-at--ms\">What students should hear at <strong>0 ms</strong></h3>\n<p><strong>one sound</strong></p>\n<table><tr><th align=\"right\">Delay</th><th align=\"left\">Typical perception</th></tr><tr><td align=\"right\">0 ms</td><td align=\"left\">one sound</td></tr><tr><td align=\"right\">5 ms</td><td align=\"left\">one sound</td></tr><tr><td align=\"right\">10 ms</td><td align=\"left\">one sound</td></tr><tr><td align=\"right\">20 ms</td><td align=\"left\">one sound</td></tr><tr><td align=\"right\">40 ms</td><td align=\"left\">beginning of echo</td></tr><tr><td align=\"right\">80 ms</td><td align=\"left\">clear echo</td></tr></table>\n<p>The source waveform has not changed. Only the arrival time of its copy has changed. That is the essential move in reflection seismology.</p>\n</div>"""
