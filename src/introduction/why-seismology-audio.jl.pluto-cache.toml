text_representation = """<div class=\"markdown\"><h2 id=\"The-seismology-analogy\">The seismology analogy</h2>\n<table><tr><th align=\"left\">Seismology</th><th align=\"left\">Hearing</th></tr><tr><td align=\"left\">Direct P</td><td align=\"left\">Direct sound</td></tr><tr><td align=\"left\">PP</td><td align=\"left\">Wall reflection</td></tr><tr><td align=\"left\">Multiples</td><td align=\"left\">Multiple echoes</td></tr><tr><td align=\"left\">Seismogram records everything</td><td align=\"left\">Cochlea records everything</td></tr><tr><td align=\"left\">We interpret phases</td><td align=\"left\">Brain suppresses reflections</td></tr></table>\n<div class=\"admonition danger\"><p class=\"admonition-title\">The incoming wavefield is not the perception</p><p>A receiver measures what arrives. Interpretation decides what those arrivals mean.</p>\n</div>\n</div>"""

