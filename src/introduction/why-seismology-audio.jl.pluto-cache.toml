text_representation = """<div class=\"markdown\"><h1 id=\"There-is-no-Haas-effect-in-seismology.-Our-data-are-complex.\">There is no Haas effect in seismology. Our data are complex.</h1>\n<p>A seismogram does not report one tidy pulse. It records the direct wave <strong>and</strong> every reflection and multiple that reaches the instrument. Your ears receive exactly the same kind of superposition in a room — but your brain normally makes it seem simple.</p>\n</div>"""

