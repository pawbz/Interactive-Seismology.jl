text_representation = """<div class=\"pluto-docs-binding\">\n<span id=\"calculate_area\">calculate_area</span>\n<div class=\"markdown\"><pre><code class=\"language-julia\">calculate_area&#40;corner_vectors&#41;</code></pre>\n<p>Shoelace-formula area of the quadrilateral with the 4 given corner points &#40;in order around the perimeter&#41; — used above to check, numerically, exactly which part of a deformation &#40;dilatation, deviatoric strain, or rotation&#41; actually changes a material element&#39;s area. Splits the quadrilateral into the two triangles <code>ABC</code> and <code>ACD</code> sharing diagonal <code>AC</code> and sums their &#40;signed&#41; areas via the cross product.</p>\n\n\n</div>\n</div>\n"""

