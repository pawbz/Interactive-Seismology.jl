text_representation = """<div class=\"markdown\"><h2 id=\"Strain-Tensor\">Strain Tensor</h2>\n<p>We use a strain tensor to analyze the distortion of the medium, whether it is solid or fluid, elastic or inelastic. The Jacobian <span class=\"tex\">$J &#61; \\nabla𝐮$</span> above is completely general — it holds for any displacement field. The interactive widget at the top of this notebook explores one important special case: a <strong>spatially-uniform</strong> <span class=\"tex\">$J$</span> &#40;every particle in the square is stretched/rotated by the <em>same</em> constant matrix&#41;, which is exactly what a small enough neighborhood of <em>any</em> smooth deformation looks like.</p>\n</div>"""

