runtime_ns = 441792
text_representation = """<div class=\"markdown\"><h2 id=\"Principal-Strains\">Principal Strains</h2>\n<p>Just like any symmetric matrix, the strain tensor <span class=\"tex\">$e$</span> has an orthonormal set of eigenvectors — the <strong>principal strain axes</strong> — along which the deformation is a pure stretch/squash with <em>no</em> shear at all. In 2-D, the two eigenvalues &#40;principal strains&#41; are</p>\n<p class=\"tex\">$$\\lambda_&#123;1,2&#125; &#61; \\frac&#123;e_&#123;11&#125;&#43;e_&#123;22&#125;&#125;&#123;2&#125; \\pm \\sqrt&#123;\\left&#40;\\frac&#123;e_&#123;11&#125;-e_&#123;22&#125;&#125;&#123;2&#125;\\right&#41;^2 &#43; e_&#123;12&#125;^2&#125;,$$</p>\n<p>at an angle <span class=\"tex\">$\\theta_p &#61; \\tfrac12\\operatorname&#123;atan2&#125;&#40;2e_&#123;12&#125;,\\, e_&#123;11&#125;-e_&#123;22&#125;&#41;$</span> from the <span class=\"tex\">$x$</span>-axis. Geometrically, a unit circle of material points deforms into an <strong>ellipse</strong> under <span class=\"tex\">$e$</span> alone, and the principal axes are exactly that ellipse&#39;s own major/minor axes — this is the classic structural-geology <strong>strain ellipse</strong>, drawn on the &quot;Strain only&quot; panel in the widget above, with the two principal strain values reported in the Readouts panel. Drag towards <strong>pure rotation</strong> and watch both principal strains go to zero &#40;a rotation has no eigenvector with real, non-trivial stretch&#41;; drag towards <strong>isotropic dilation</strong> and watch the ellipse become a circle again, just a bigger or smaller one — the ellipse only grows &quot;lopsided&quot; when the two principal strains differ.</p>\n</div>"""

