text_representation = """<div class=\"markdown\"><h2 id=\"Displacement\">Displacement</h2>\n<p>Particle displacement is a function of space and time</p>\n<p class=\"tex\">$$𝐮 &#61; 𝐮&#40;𝐱, t&#41;.$$</p>\n<p>Here, 𝐱 denotes the position the particle occupies at a reference time t&#61;0, which means, a particle at position 𝐱 will be moved to position 𝐱&#43;𝐮&#40;𝐱, t&#41; at time t — Lagrangian, since it&#39;s the <em>same particle</em> 𝐱 being tracked. The particle velocity and particle acceleration are given by ∂ₜ𝐮 and ∂ₜ²𝐮, respectively.</p>\n</div>"""

