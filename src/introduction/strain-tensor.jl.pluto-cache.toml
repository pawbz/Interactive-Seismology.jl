text_representation = """<div class=\"markdown\"><p>Plugging in one representative numeric case &#40;<span class=\"tex\">$j_&#123;e1&#125;&#61;&#36;&#40;je1&#41;$</span>, <span class=\"tex\">$j_&#123;e2&#125;&#61;&#36;&#40;je2&#41;$</span>, <span class=\"tex\">$j_e&#61;&#36;&#40;je&#41;$</span>, <span class=\"tex\">$j_\\Delta&#61;&#36;&#40;jd&#41;$</span>, <span class=\"tex\">$j_\\omega&#61;&#36;&#40;jom&#41;$</span>&#41;:</p>\n<ul>\n<li><p><strong>general symmetric &#40;strain&#41;</strong> <span class=\"tex\">$J_e$</span>: computed area &#61; <strong>1.0991</strong>, <em>not</em> simply <span class=\"tex\">$1&#43;j_&#123;e1&#125;&#43;j_&#123;e2&#125;&#61;&#36;&#40;round&#40;1&#43;je1&#43;je2, digits&#61;5&#41;&#41;$</span> — it depends on both the dilatation <em>and</em> the deviatoric shear <span class=\"tex\">$j_e$</span>.</p>\n</li>\n<li><p><strong>purely isotropic &#40;dilatation-only&#41;</strong> <span class=\"tex\">$J_\\Delta$</span>: computed area &#61; <strong>1.3924</strong>, matching <span class=\"tex\">$&#40;1&#43;j_\\Delta&#41;^2&#61;&#36;&#40;round&#40;&#40;1&#43;jd&#41;^2, digits&#61;5&#41;&#41;$</span> exactly — confirming dilatation alone controls the area change.</p>\n</li>\n<li><p><strong>pure &#40;infinitesimal&#41; rotation</strong> <span class=\"tex\">$J_\\omega$</span>: computed area &#61; <strong>1.0144</strong>, matching <span class=\"tex\">$1&#43;j_\\omega^2&#61;&#36;&#40;round&#40;1&#43;jom^2, digits&#61;5&#41;&#41;$</span> — equal to <code>1</code> only to <em>first order</em> in <span class=\"tex\">$j_\\omega$</span>. That leftover <span class=\"tex\">$j_\\omega^2$</span> is exactly the reminder from <strong>Finite vs. Infinitesimal Strain</strong> above that <span class=\"tex\">$I&#43;\\Omega$</span> is only the <em>linearized</em> rotation matrix, not a finite one — an exact finite rotation <span class=\"tex\">$\\begin&#123;bmatrix&#125;\\cos\\theta&amp;-\\sin\\theta\\\\\\sin\\theta&amp;\\cos\\theta\\end&#123;bmatrix&#125;$</span> would give area <code>1</code> identically. Either way, rotation contributes nothing to first order, which is the only order that matters for infinitesimal strain.</p>\n</li>\n</ul>\n</div>"""

