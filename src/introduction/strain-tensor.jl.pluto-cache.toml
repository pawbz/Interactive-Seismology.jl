text_representation = """<div class=\"markdown\"><h1 id=\"Strain-Tensor\">Strain Tensor</h1>\n<p>If you split any small piece of a deforming body into a translation, a rotation, and a <em>change of shape</em>, that last piece — how much a small square actually stretches, squashes, or shears, independent of where it moves to or which way it turns — is the <strong>strain</strong>. It is the part of a deformation an elastic medium resists &#40;and therefore radiates seismic energy to relax&#41;, and the part that matters for whether rock breaks. Real strain rates are tiny.</p>\n<div class=\"admonition note\"><p class=\"admonition-title\">How tiny</p><p>Geodetic &#40;GPS&#41; measurements across the Southern California plate boundary show relative plate motion of about 2-7 cm/year, a strain <em>rate</em> of roughly <span class=\"tex\">$3\\times10^&#123;-7&#125;$</span> per year — about ten times faster than the strain accumulating deep in the plate interior &#40;<span class=\"tex\">$&lt;3\\times10^&#123;-8&#125;$</span> per year&#41;. A large earthquake releases a <em>coseismic</em> shear strain drop of order <span class=\"tex\">$3\\times10^&#123;-4&#125;$</span> in one rupture — five orders of magnitude more than a year&#39;s worth of loading. The <strong>Earthquake Recurrence</strong> section near the end of this notebook turns those two numbers into a live estimate of how often a fault like that should rupture.</p>\n</div>\n<p>This notebook builds the strain tensor up from a 2-D Jacobian you can drag by hand: how a deformation decomposes into rotation &#43; strain &#40;Toeplitz decomposition&#41;, how strain itself splits further into dilatation &#40;uniform area/volume change&#41; and deviatoric strain &#40;pure shape change at constant area/volume&#41;, what principal strains and the strain ellipse are, and the Mohr circle construction for reading off the strain on <em>any</em> cut through the material.</p>\n<h5 id=\"Interactive-Seismology-Notebooks\"><a href=\"https://pawbz.github.io/Interactive-Seismology.jl/\">Interactive Seismology Notebooks</a></h5>\n<p>Instructor: <em>Pawan Bharadwaj</em>, Indian Institute of Science, Bengaluru, India</p>\n</div>"""
