text_representation = """<div class=\"markdown\"><h2 id=\"Distortion\">Distortion</h2>\n<p>Distortion of the medium changes the relative position of nearby particles — it&#39;s therefore related to the <em>gradients</em> of <span class=\"tex\">$\\mathbf&#123;u&#125;$</span>, not <span class=\"tex\">$\\mathbf&#123;u&#125;$</span> itself &#40;a spatially-uniform <span class=\"tex\">$\\mathbf&#123;u&#125;$</span> is just a translation, no distortion at all&#41;. For two nearby particles separated by a small vector <span class=\"tex\">$\\delta\\mathbf&#123;x&#125;$</span> in the reference configuration, their relative displacement to first order is</p>\n<p class=\"tex\">$$\\delta u_i &#61; \\frac&#123;\\partial u_i&#125;&#123;\\partial x_j&#125;\\,\\delta x_j &#61; J_&#123;ij&#125;\\,\\delta x_j,\n\\qquad J_&#123;ij&#125; &#61; \\frac&#123;\\partial u_i&#125;&#123;\\partial x_j&#125;,$$</p>\n<p>so the two particles end up separated by <span class=\"tex\">$\\delta\\mathbf&#123;x&#125;&#43;\\delta\\mathbf&#123;u&#125; &#61; &#40;I&#43;J&#41;\\,\\delta\\mathbf&#123;x&#125;$</span> — the deformation gradient <span class=\"tex\">$I&#43;J$</span> acting on their original separation. Everything below is about what this matrix <span class=\"tex\">$J$</span> &#40;the Jacobian of <span class=\"tex\">$\\mathbf&#123;u&#125;$</span>&#41; does to that separation.</p>\n</div>"""

