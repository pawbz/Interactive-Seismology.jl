text_representation = """<div class=\"markdown\"><h2 id=\"Earthquake-Recurrence\">Earthquake Recurrence</h2>\n<p>Dividing the coseismic strain drop of a major earthquake by the tectonic strain <em>rate</em> loading the fault back up gives a rough estimate of the <strong>recurrence interval</strong> — how long it takes to build up enough strain for another rupture of similar size. Drag the sliders below &#40;log-scaled, since both quantities span orders of magnitude&#41; around the real Southern California numbers quoted in the introduction.</p>\n</div>"""

