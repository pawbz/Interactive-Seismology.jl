text_representation = """<div class=\"markdown\"><p>Area after a <strong>pure &#40;infinitesimal&#41; rotation</strong> — <code>1&#43;jom²</code>, which is <code>1</code> to <em>first order</em> in <code>jom</code>. The <code>jom²</code> left over is exactly the reminder that <code>I&#43;Jom</code> is only the <em>linearized</em> rotation matrix &#40;valid for the small <code>jom</code> this whole notebook assumes&#41;, not a finite one — an exact finite rotation <code>&#91;cos θ, -sin θ; sin θ, cos θ&#93;</code> would give area <code>1</code> identically. Either way, rotation contributes nothing to first order, which is the only order that matters for infinitesimal strain:</p>\n</div>"""

