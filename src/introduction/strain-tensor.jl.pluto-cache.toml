text_representation = """<div class=\"markdown\"><h2 id=\"Dilatation-vs.-Distortion\">Dilatation vs. Distortion</h2>\n<p>The strain tensor <span class=\"tex\">$e$</span> itself splits one level further: its <strong>trace</strong> <span class=\"tex\">$\\Delta &#61; \\operatorname&#123;tr&#125;&#40;e&#41; &#61; e_&#123;11&#125;&#43;e_&#123;22&#125;&#40;&#43;e_&#123;33&#125;&#41; &#61; \\nabla\\cdot𝐮$</span> is the <strong>dilatation</strong> — the fractional change in area &#40;2-D&#41; or volume &#40;3-D&#41;, the <em>same</em> in every direction, with zero shape change. Subtracting that isotropic part back out of <span class=\"tex\">$e$</span> leaves the <strong>deviatoric strain</strong>: shape change at <em>exactly</em> constant area/volume, zero dilatation by construction. This is the split behind P waves &#40;which involve dilatation — a volume oscillation&#41; versus S waves &#40;purely deviatoric — a shape oscillation with no volume change at all&#41;: the &quot;Dilatation only&quot; and &quot;Deviatoric only&quot; panels in the widget above show these in isolation, and the <strong>Δ</strong> readout is exactly <span class=\"tex\">$\\operatorname&#123;tr&#125;&#40;e&#41;$</span>.</p>\n<p>We can check this claim numerically: deform a unit square by a purely isotropic matrix <span class=\"tex\">$J_\\Delta &#61; \\begin&#123;bmatrix&#125;j_\\Delta&amp;0\\\\0&amp;j_\\Delta\\end&#123;bmatrix&#125;$</span>, by a general symmetric &#40;strain&#41; matrix, and by a pure rotation, and compare their areas.</p>\n</div>"""

