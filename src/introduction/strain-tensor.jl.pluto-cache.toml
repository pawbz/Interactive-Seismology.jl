text_representation = """<div class=\"markdown\"><h2 id=\"Finite-vs.-Infinitesimal-Strain\">Finite vs. Infinitesimal Strain</h2>\n<p>The <strong>deformation gradient</strong> <span class=\"tex\">$\\mathbf&#123;F&#125;&#61;\\mathbf&#123;I&#125;&#43;\\nabla_0\\mathbf&#123;u&#125;$</span> &#40;the gradient taken with respect to the <em>reference</em> position&#41; maps a reference line element exactly onto its deformed image, <span class=\"tex\">$d\\mathbf&#123;x&#125;&#61;\\mathbf&#123;F&#125;\\,d\\mathbf&#123;x&#125;_0$</span>, with no restriction on how large the deformation is. Splitting it into &quot;rotation &#43; stretch&quot; <em>exactly</em>, for any size deformation, needs a <strong>polar decomposition</strong> <span class=\"tex\">$\\mathbf&#123;F&#125;&#61;\\mathbf&#123;R&#125;\\mathbf&#123;U&#125;$</span> — <span class=\"tex\">$\\mathbf&#123;R&#125;$</span> a genuine &#40;finite&#41; rotation matrix, <span class=\"tex\">$\\mathbf&#123;U&#125;$</span> a genuine &#40;finite&#41; stretch — and <span class=\"tex\">$\\mathbf&#123;R&#125;$</span>, <span class=\"tex\">$\\mathbf&#123;U&#125;$</span> do <em>not</em> simply add or subtract from <span class=\"tex\">$\\mathbf&#123;F&#125;$</span>.</p>\n<p>Seismology almost never needs that. Real elastic strains in the Earth are tiny &#40;the introduction&#39;s &quot;How tiny&quot; note above: <span class=\"tex\">$10^&#123;-8&#125;$</span> to <span class=\"tex\">$10^&#123;-4&#125;$</span>&#41;, so <span class=\"tex\">$\\|\\nabla\\mathbf&#123;u&#125;\\|\\ll1$</span>, and to first order in that small number:</p>\n<ul>\n<li><p>The reference and current configurations are close enough that it no longer matters which one you differentiate with respect to — <span class=\"tex\">$\\nabla_0\\mathbf&#123;u&#125;\\approx\\nabla\\mathbf&#123;u&#125;$</span> — so this notebook never has to distinguish them, and just writes <span class=\"tex\">$J&#61;\\nabla\\mathbf&#123;u&#125;$</span>.</p>\n</li>\n<li><p>The exact multiplicative decomposition collapses to the simple <strong>additive</strong> one used throughout this notebook, <span class=\"tex\">$J&#61;e&#43;\\Omega$</span>, with <span class=\"tex\">$e&#61;\\tfrac12&#40;J&#43;J^T&#41;$</span> symmetric and <span class=\"tex\">$\\Omega&#61;\\tfrac12&#40;J-J^T&#41;$</span> antisymmetric — the <strong>infinitesimal strain tensor</strong> and the <strong>infinitesimal rotation tensor</strong>.</p>\n</li>\n<li><p><span class=\"tex\">$\\mathbf&#123;I&#125;&#43;\\Omega$</span> is only the <em>linearized</em> rotation matrix &#40;correct to first order in <span class=\"tex\">$\\Omega$</span>&#41;, not a true finite rotation — already visible below in <strong>Dilatation vs. Distortion</strong>, where a pure rotation preserves area only to first order, not exactly.</p>\n</li>\n</ul>\n<p>Every result in this notebook — the strain ellipse, the Mohr circle, the dilatation/deviatoric split — is this infinitesimal theory, valid because real seismic strains stay in that tiny regime; it is <em>not</em> the general finite-strain theory needed for, say, mantle convection over geologic time.</p>\n</div>"""

