text_representation = """<div class=\"markdown\"><h2 id=\"Strain-Tensor\">Strain Tensor</h2>\n<p>We use a strain tensor to analyze the distortion of the medium, whether it is solid or fluid, elastic or inelastic. The Jacobian <span class=\"tex\">$J&#61;\\nabla\\mathbf&#123;u&#125;$</span> above is completely general — it holds for any displacement field. The interactive widget below explores one important special case: a <strong>spatially-uniform</strong> <span class=\"tex\">$J$</span> &#40;every particle in the square is stretched/rotated by the <em>same</em> constant matrix&#41;, which is exactly what a small enough neighborhood of <em>any</em> smooth displacement field looks like.</p>\n<p>Any matrix splits uniquely into a symmetric and an antisymmetric part &#40;the <strong>Toeplitz decomposition</strong>&#41; — the symmetric part is the <strong>strain tensor</strong>, the antisymmetric part the <strong>&#40;infinitesimal&#41; rotation tensor</strong>:</p>\n<p class=\"tex\">$$J &#61; e &#43; \\Omega,\\qquad\ne &#61; \\tfrac12\\&#33;\\left&#40;J&#43;J^T\\right&#41;\\ \\text&#123;&#40;symmetric&#41;&#125;,\\qquad\n\\Omega &#61; \\tfrac12\\&#33;\\left&#40;J-J^T\\right&#41;\\ \\text&#123;&#40;antisymmetric&#41;&#125;.$$</p>\n<p>Acting separately on the same small separation <span class=\"tex\">$\\delta\\mathbf&#123;x&#125;$</span>, the two parts do genuinely different things: <span class=\"tex\">$e\\,\\delta\\mathbf&#123;x&#125;$</span> stretches/shears <span class=\"tex\">$\\delta\\mathbf&#123;x&#125;$</span> with <em>no</em> rotation &#40;it&#39;s the part responsible for elastic restoring forces&#41;, while <span class=\"tex\">$\\Omega\\,\\delta\\mathbf&#123;x&#125;$</span> is a pure infinitesimal <em>rotation</em> of <span class=\"tex\">$\\delta\\mathbf&#123;x&#125;$</span> with <em>no</em> change in length at all — a rigid spin that costs a deforming solid nothing. Splitting <span class=\"tex\">$J$</span> this way is exactly what lets the widget below decompose a general deformation into rotation, dilatation, and deviatoric strain.</p>\n</div>"""

