text_representation = """<div class=\"markdown\"><h2 id=\"Mohr-Circle-for-Strain\">Mohr Circle for Strain</h2>\n<p>The Mohr circle is a graphical trick for reading off the normal and shear strain on a cut plane at <em>any</em> orientation, without recomputing the tensor-rotation formula by hand each time. Rotating the cut angle by <span class=\"tex\">$\\theta$</span> moves you <em>twice</em> as far around the circle &#40;<span class=\"tex\">$2\\theta$</span>&#41; — a consequence of strain being a rank-2 tensor, not a vector. The circle is centered at <span class=\"tex\">$&#40;\\Delta/2,\\, 0&#41;$</span> with radius <span class=\"tex\">$R&#61;\\sqrt&#123;\\left&#40;\\tfrac&#123;e_&#123;11&#125;-e_&#123;22&#125;&#125;&#123;2&#125;\\right&#41;^2&#43;e_&#123;12&#125;^2&#125;$</span>; the two points where it crosses the &#40;zero-shear&#41; horizontal axis are exactly the principal strains from the section above.</p>\n<p>Drag the marker on the Mohr-circle panel in the widget: the matching cut-plane line on the main square updates with it — a dashed line at the <em>reference</em> &#40;undeformed&#41; orientation, and a solid cyan line showing how that same material fiber looks after the full deformation &#40;rotation included&#41;. The Mohr circle itself deliberately plots only the <strong>strain</strong> part <span class=\"tex\">$e$</span>; the extra rotation visible on the main square&#39;s cyan line is <em>not</em> in the circle&#39;s numbers — a fiber that looks like it swung around a lot on the square can still show almost no shear strain on the circle, if most of what you&#39;re seeing is rigid rotation rather than distortion.</p>\n</div>"""

