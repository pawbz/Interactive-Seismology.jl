text_representation = """<div class=\"markdown\"><h2 id=\"Configurations,-Bodies,-and-the-Lagrangian-Description\">Configurations, Bodies, and the Lagrangian Description</h2>\n<p>Everything in this notebook describes a <strong>body</strong> — a piece of material made of some fixed set of particles — as it moves and deforms. We single out one instant as the <strong>reference configuration</strong>, where each particle sits at its reference position <span class=\"tex\">$\\mathbf&#123;x&#125;$</span> &#40;the same <span class=\"tex\">$\\mathbf&#123;x&#125;$</span> used throughout this notebook&#41;; at any later time <span class=\"tex\">$t$</span> the body occupies its <strong>deformed</strong> &#40;or <em>current</em>&#41; <strong>configuration</strong>, where that same particle has moved to <span class=\"tex\">$\\mathbf&#123;x&#125;&#43;\\mathbf&#123;u&#125;&#40;\\mathbf&#123;x&#125;,t&#41;$</span>.</p>\n<p>Tracking a property by <em>which particle</em> carries it — rather than by <em>which spatial point</em> currently happens to hold it — is the <strong>Lagrangian description</strong>, and it&#39;s what every <span class=\"tex\">$\\mathbf&#123;u&#125;&#40;\\mathbf&#123;x&#125;,t&#41;$</span> in this notebook means: the displacement of the <em>particle labeled</em> <span class=\"tex\">$\\mathbf&#123;x&#125;$</span>, not of &quot;whatever is currently at some fixed spatial location.&quot; &#40;The alternative — tracking properties at fixed spatial points as different particles pass through them — is the <em>Eulerian</em> description: more natural for fluids in motion than for a solid Earth we mostly care about at rest between earthquakes.&#41;</p>\n<p>The widget below drags <strong>a part of the body</strong> — a small region of four labeled particles — from its reference configuration to any deformed configuration you like, by hand. Two things to watch as you drag:</p>\n<ul>\n<li><p>The numeric labels stay attached to their own particle — dragging relabels nothing, exactly the Lagrangian point above.</p>\n</li>\n<li><p><strong>Mass</strong> is an <strong>extensive</strong> property: however you deform the region, the <em>same</em> particles are still in it, so its mass <span class=\"tex\">$M&#61;\\rho_0 A_0$</span> never changes. <strong>Density</strong> <span class=\"tex\">$\\rho&#61;M/A$</span> is not — it&#39;s mass per unit <em>current</em> area, so it changes the instant the region&#39;s area does, in exactly the way that keeps <span class=\"tex\">$\\rho A&#61;\\rho_0 A_0$</span> &#40;the region&#39;s mass&#41; constant. This is the 2-D statement of mass conservation, <span class=\"tex\">$\\rho_0\\,dA_0&#61;\\rho\\,dA$</span>, behind the continuity equation used throughout continuum seismology.</p>\n</li>\n</ul>\n</div>"""

