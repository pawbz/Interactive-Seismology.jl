text_representation = """<div class=\"pluto-docs-binding\">\n<span id=\"ray_surface_return\">ray_surface_return</span>\n<div class=\"markdown\"><pre><code class=\"language-julia\">ray_surface_return&#40;path, traveltime&#41;</code></pre>\n<p>Find where a traced ray &#40;from <a href=\"@ref\"><code>get_raypaths</code></a>&#41; first returns to within 1 km of the surface &#40;<code>z&lt;1</code>&#41; after leaving the source, and the accumulated travel time there – used to compare against the Eikonal equation&#39;s own, independently-computed first-arrival time at that same surface point &#40;see the widget&#39;s &quot;Travel-time check&quot; panel&#41;.</p>\n<p>Returns <code>&#40;x, t&#41;</code>, or <code>nothing</code> if the ray never returns to the surface within its traced length &#40;e.g. it exits the domain sideways, or the medium doesn&#39;t bend it back up&#41;. Skips the very first point of the path so a source placed right at the surface doesn&#39;t trivially &quot;return&quot; immediately.</p>\n\n\n</div>\n</div>\n"""

