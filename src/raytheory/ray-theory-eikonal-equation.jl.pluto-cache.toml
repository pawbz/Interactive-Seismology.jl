text_representation = """<div class=\"markdown\"><h2 id=\"Amplitudes-Along-a-Ray\">Amplitudes Along a Ray</h2>\n<p>Writing <span class=\"tex\">$A&#61;\\exp&#40;\\tilde A&#41;$</span> turns the transport equation &#40;eikA&#41; into a linear equation for the <em>log</em>-amplitude <span class=\"tex\">$\\tilde A$</span>. Projecting it along the ray direction <span class=\"tex\">$\\hat s$</span> &#40;the same <span class=\"tex\">$d/dl&#61;\\hat s\\cdot\\nabla$</span> used above&#41; gives</p>\n<p class=\"tex\">$$\\frac&#123;d\\tilde A&#125;&#123;dl&#125; &#61; -\\frac&#123;1&#125;&#123;2s&#125;\\,\\nabla^2 T &#61; -\\frac&#123;1&#125;&#123;2s&#125;\\,\\nabla\\cdot\\vec s.$$</p>\n<p>The right-hand side is the divergence of the slowness field along the ray: where rays converge &#40;<span class=\"tex\">$\\nabla\\cdot\\vec s&lt;0$</span>&#41;, amplitude grows; where they diverge, it decays. Integrating this along the ray gives the amplitude via geometrical spreading — exactly the <span class=\"tex\">$1/r$</span> decay of a spherical wavefront in a homogeneous medium, generalized to whatever raypath geometry the local structure produces.</p>\n</div>"""

