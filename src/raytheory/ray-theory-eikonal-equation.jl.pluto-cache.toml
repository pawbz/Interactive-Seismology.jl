text_representation = """<div class=\"markdown\"><h2 id=\"Wavefronts-and-Rays\">Wavefronts and Rays</h2>\n<p>The surfaces <span class=\"tex\">$T&#40;x,y,z&#41; &#61; \\text&#123;const.&#125;$</span> are <strong>wavefronts</strong>. In a homogeneous medium they are spheres; in a heterogeneous one they take whatever shape the velocity structure forces on them — exactly what the widget&#39;s animated sweep shows.</p>\n<p><strong>Rays</strong> are lines perpendicular to the wavefronts, i.e. parallel to <span class=\"tex\">$\\nabla T&#40;x,y,z&#41;$</span>. If <span class=\"tex\">$\\hat s$</span> is the unit vector along <span class=\"tex\">$\\nabla T$</span>, then</p>\n<p class=\"tex\">$$\\nabla T&#40;x,y,z&#41; &#61; \\vec&#123;s&#125;&#40;x,z&#41; &#61; |\\vec&#123;s&#125;&#40;x,z&#41;|\\,\\hat&#123;s&#125;&#40;x,z&#41;, \\qquad &#40;1&#41;$$</p>\n<p>where <span class=\"tex\">$|\\vec s| &#61; 1/\\alpha$</span> is the local slowness.</p>\n</div>"""

