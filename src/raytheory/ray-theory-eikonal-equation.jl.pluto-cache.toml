text_representation = """<div class=\"markdown\"><p><code>RayPush</code> does no physics – it takes the already-traced ray paths, the eikonal traveltime grid, and the ray-traced surface-return check points, and hands them to the <em>already-rendered</em> <a href=\"@ref\"><code>RayPaintInput</code></a> widget by dispatching a browser <code>CustomEvent</code>, the same pattern this repo&#39;s other widgets use &#40;see e.g. <code>FieldPush</code> in <code>fault-dislocation.jl</code>&#41;.</p>\n</div>"""

