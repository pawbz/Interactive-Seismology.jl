result_hash = "ecf40caaea92652e"
runtime_ns = 342666
text_representation = """<div class=\"markdown\"><h2 id=\"Fermat&#39;s-Principle\">Fermat&#39;s Principle</h2>\n<p>Rays are exactly the paths that extremize the total travel time between two points,</p>\n<p class=\"tex\">$$\\mathbb&#123;T&#125; &#61; \\int_A^B s&#40;x&#41;\\,dl,$$</p>\n<p>among <em>all</em> possible paths connecting them — not just the true ray, which is why ray tracing &#40;shooting a path and integrating equations &#40;2&#41;-&#40;3&#41;&#41; and travel-time extremization are two views of the same physics. A full variational-calculus proof is a nice exercise: perturb the path by <span class=\"tex\">$\\epsilon\\,\\eta&#40;x&#41;$</span> with <span class=\"tex\">$\\eta&#40;A&#41;&#61;\\eta&#40;B&#41;&#61;0$</span>, and set <span class=\"tex\">$d\\mathbb&#123;T&#125;/d\\epsilon|_&#123;\\epsilon&#61;0&#125;&#61;0$</span> to recover the ray equations derived above.</p>\n</div>"""

[cells.864f274b-4f28-4cf9-83f7-69a1f03ca870]
