runtime_ns = 71628166
text_representation = """<div class=\"markdown\"><h1 id=\"Ray-Theory-and-The-Eikonal-Equation\">Ray Theory and The Eikonal Equation</h1>\n<p>Seismic ray theory is the high-frequency limit of wave propagation: when a wave&#39;s wavelength is much shorter than the scale over which the medium changes, energy travels along well-defined paths — rays — that bend smoothly through velocity heterogeneity exactly the way light bends through a lens. This notebook derives the Eikonal equation that governs those rays from the elastic wave equation, then hands you a widget to see it in action: <strong>paint velocity perturbations directly onto a background Earth model</strong> and watch the rays bend and the first-arrival wavefront sweep through whatever structure you&#39;ve drawn.</p>\n<h5 id=\"Interactive-Seismology-Notebooks\"><a href=\"https://pawbz.github.io/Interactive-Seismology.jl/\">Interactive Seismology Notebooks</a></h5>\n<p>Instructor: <em>Pawan Bharadwaj</em>, Indian Institute of Science, Bengaluru, India</p>\n</div>"""

[cells.8dd31a81-a418-4164-90aa-b65e48ed9b2c]
errored = false
execution_key = "d8bbf4e61275a0e5"
mime = "text/html"
output_packed = ""
result_hash = "533b56fb1d8cac93"
runtime_ns = 675084
text_representation = """<div class=\"markdown\"><h2 id=\"Tracing-the-Ray-Path\">Tracing the Ray Path</h2>\n<p>A ray begins at the source, where we choose the direction of the outgoing wavefront <span class=\"tex\">$\\hat s_0$</span>. Denoting the source position <span class=\"tex\">$\\vec p_0$</span>, we move along <span class=\"tex\">$\\hat s_0$</span> by an incremental length <span class=\"tex\">$dl$</span>:</p>\n<p class=\"tex\">$$\\vec&#123;p&#125;_1 &#61; \\vec&#123;p&#125;_0 &#43; \\hat&#123;s&#125;_0 \\,dl. \\qquad&#40;2&#41;$$</p>\n<p>To continue the ray, we need the change in <span class=\"tex\">$\\vec s$</span> between <span class=\"tex\">$\\vec p_0$</span> and <span class=\"tex\">$\\vec p_1$</span> — the plane wave we&#39;re riding gets refracted as it propagates through changing slowness <span class=\"tex\">$s&#61;|\\vec s|$</span>. Differentiating the Eikonal equation <span class=\"tex\">$|\\vec s|^2&#61;s^2$</span> along the ray&#39;s own arclength &#40;<span class=\"tex\">$d/dl &#61; \\hat s\\cdot\\nabla$</span>, since the ray direction <em>is</em> <span class=\"tex\">$\\hat s$</span>&#41;, and using that mixed partial derivatives of the smooth scalar field <span class=\"tex\">$T$</span> commute, gives the compact result</p>\n<p class=\"tex\">$$\\frac&#123;d\\vec s&#125;&#123;dl&#125; &#61; \\nabla s. \\qquad &#40;3&#41;$$</p>\n<p>This is the fundamental ray-tracing equation: the slowness vector bends toward regions of <em>higher</em> slowness &#40;lower velocity&#41; at a rate set by the local slowness gradient — exactly how light bends toward the normal when entering a denser medium. This notebook solves equations &#40;2&#41; and &#40;3&#41; numerically, stepping along the ray, to trace ray paths through the 2D heterogeneous medium you paint below.</p>\n<div class=\"admonition tip\"><p class=\"admonition-title\">What equation (3) tells us</p><p><span class=\"tex\">$d\\vec s/dl$</span> determines how the horizontal and vertical components of the slowness vector change along the ray path. For example, if <span class=\"tex\">$\\partial_x s$</span> is zero in a layered Earth medium, the horizontal slowness stays exactly constant — the classic statement of Snell&#39;s law along a ray in a layered medium.</p>\n</div>\n</div>"""

