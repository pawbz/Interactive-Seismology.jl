text_representation = """<div class=\"pluto-docs-binding\">\n<span id=\"first_arrival_traveltimes\">first_arrival_traveltimes</span>\n<div class=\"markdown\"><pre><code class=\"language-julia\">first_arrival_traveltimes&#40;s_grid, srcZ, srcX&#41;</code></pre>\n<p>Solve the Eikonal equation for the first-arrival travel time everywhere on the grid using the fast sweeping method &#40;<code>Eikonal.jl</code>&#41;, given a slowness grid and a source position in km.</p>\n\n\n</div>\n</div>\n"""

[cells.75c23a27-4253-474c-97bb-925ba236f362]
