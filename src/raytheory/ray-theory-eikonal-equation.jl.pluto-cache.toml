text_representation = """<div class=\"pluto-docs-binding\">\n<span id=\"velocity_waveguide\">velocity_waveguide</span>\n<div class=\"markdown\"><pre><code class=\"language-julia\">velocity_waveguide&#40;z, x; v0, grad, lvzdepth, lvzamp&#41;</code></pre>\n<p>Linear-gradient background <code>v0 &#43; grad*z</code> with a Gaussian low-velocity zone of depth <code>lvzamp</code> &#40;km/s&#41; subtracted, centered at <code>lvzdepth</code> km with fixed half-width <a href=\"@ref\"><code>LVZ_WIDTH</code></a>. Rays that graze the channel get bent back into it and travel as trapped, guided paths – the ray-theory picture of a waveguide.</p>\n\n\n</div>\n</div>\n"""

