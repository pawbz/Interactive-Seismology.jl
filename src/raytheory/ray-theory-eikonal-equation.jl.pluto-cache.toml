text_representation = """<div class=\"pluto-docs-binding\">\n<span id=\"ray_fan\">ray_fan</span>\n<div class=\"markdown\"><pre><code class=\"language-julia\">ray_fan&#40;N_RAYS, srcZ, srcX, angleMin, angleMax, pa&#41;</code></pre>\n<p>Trace a fan of <code>N_RAYS</code> rays evenly spaced in takeoff angle between <code>angleMin</code> and <code>angleMax</code> &#40;degrees, measured from the <code>&#43;x</code> axis toward <code>&#43;z</code>/down – <code>0°</code> horizontal, <code>90°</code> straight down&#41;, each <code>500</code> steps of <code>1</code> km arclength. This is the single source of truth the widget draws from: <a href=\"@ref\"><code>ray_fan_paths</code></a> and <a href=\"@ref\"><code>ray_fan_surface_returns</code></a> both extract what they need from the <em>same</em> traced fan rather than re-tracing it.</p>\n\n\n</div>\n</div>\n"""

