text_representation = """<div class=\"markdown\"><h2 id=\"Deriving-the-Eikonal-Equation\">Deriving the Eikonal Equation</h2>\n<p>We look for a high-frequency &#40;WKB&#41; solution of the scalar wave equation <span class=\"tex\">$\\rho\\,\\partial_t^2\\phi &#61; \\nabla\\cdot&#40;\\mu\\nabla\\phi&#41;$</span> of the form</p>\n<p class=\"tex\">$$\\phi&#40;x,z,t&#41; &#61; A&#40;x,z&#41;\\,\\exp\\&#33;\\big&#91;i\\omega\\big&#40;t - T&#40;x,z&#41;\\big&#41;\\big&#93;,$$</p>\n<p>an amplitude <span class=\"tex\">$A$</span> that varies slowly in space compared to the rapidly-oscillating phase <span class=\"tex\">$\\omega T$</span>. Substituting <span class=\"tex\">$\\phi$</span> into the wave equation and sorting the resulting terms by their power of <span class=\"tex\">$\\omega$</span> gives, at leading order <span class=\"tex\">$O&#40;\\omega^2&#41;$</span> &#40;the <strong>high-frequency approximation</strong>: every term of lower order in <span class=\"tex\">$\\omega$</span> is discarded, exactly the terms that matter close to the source — see &quot;Near Field vs. Far Field&quot; in <code>lame-theorem.jl</code> for the point- force version of this same tradeoff&#41;, the <strong>Eikonal equation</strong></p>\n<p class=\"tex\">$$\\big&#40;\\partial_x T\\big&#41;^2 &#43; \\big&#40;\\partial_z T\\big&#41;^2 &#61; \\frac&#123;1&#125;&#123;\\beta&#40;x,z&#41;^2&#125;, \\qquad &#40;\\text&#123;eik&#125;&#41;$$</p>\n<p>and at the next order, <span class=\"tex\">$O&#40;\\omega^1&#41;$</span>, the <strong>transport equation</strong> that governs how the amplitude <span class=\"tex\">$A$</span> evolves:</p>\n<p class=\"tex\">$$2\\,\\nabla A\\cdot\\nabla T &#43; A\\,\\nabla^2 T &#61; 0. \\qquad &#40;\\text&#123;eikA&#125;&#41;$$</p>\n<div class=\"admonition tip\"><p class=\"admonition-title\">Dispersion relation, revisited</p><p>The Eikonal equation looks just like the dispersion relation from a plane-wave solution of the homogeneous scalar wave equation: the magnitude of the wavenumber vector <span class=\"tex\">$\\vec k$</span> equals <span class=\"tex\">$\\omega^2/\\alpha^2$</span>, which also constrains the magnitude of the slowness vector <span class=\"tex\">$\\vec s$</span> to <span class=\"tex\">$1/\\alpha^2$</span>.</p>\n</div>\n<div class=\"admonition tip\"><p class=\"admonition-title\">A local plane wave</p><p>When solving the Eikonal equation, think of a <em>local plane wave</em> at <span class=\"tex\">$&#40;x,z&#41;$</span> with its own slowness vector <span class=\"tex\">$\\vec s&#40;x,z&#41;$</span>. <span class=\"tex\">$\\partial_x T$</span> is exactly the x-component of that slowness vector.</p>\n</div>\n</div>"""

