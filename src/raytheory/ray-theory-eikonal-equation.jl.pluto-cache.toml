text_representation = """<div class=\"pluto-docs-binding\">\n<span id=\"build_velocity_grid\">build_velocity_grid</span>\n<div class=\"markdown\"><pre><code class=\"language-julia\">build_velocity_grid&#40;bgType, v0, grad, pert_flat; v1, zint, lvzdepth, lvzamp&#41;</code></pre>\n<p>Combine a smooth background velocity model &#40;<code>bgType</code> one of <code>&quot;homogeneous&quot;</code>, <code>&quot;gradient&quot;</code>, <code>&quot;layered&quot;</code>, <code>&quot;waveguide&quot;</code> – see <a href=\"@ref\"><code>velocity_homogeneous</code></a>, <a href=\"@ref\"><code>velocity_gradient</code></a>, <a href=\"@ref\"><code>velocity_layered</code></a>, <a href=\"@ref\"><code>velocity_waveguide</code></a>&#41; with the user-painted perturbation <code>pert_flat</code> &#40;a flat vector, <code>NZ*NX</code> long, in row-major <code>&#40;z outer, x inner&#41;</code> order matching the widget&#39;s own JS array layout&#41; into one velocity grid, clamped to a small positive floor so the Eikonal solve stays well-posed.</p>\n<p>Returns the <code>&#40;NZ, NX&#41;</code> velocity matrix.</p>\n\n\n</div>\n</div>\n"""

