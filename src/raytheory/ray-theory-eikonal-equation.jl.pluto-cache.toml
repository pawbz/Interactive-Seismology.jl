text_representation = """<div class=\"pluto-docs-binding\">\n<span id=\"get_raypaths\">get_raypaths</span>\n<div class=\"markdown\"><pre><code class=\"language-julia\">get_raypaths&#40;N, ds, Xsource, initial_slowness_vectors, pa&#41;</code></pre>\n<p>Trace <code>length&#40;initial_slowness_vectors&#41;</code> rays outward from <code>Xsource &#61; &#91;z,x&#93;</code>, each <code>N</code> steps of arclength <code>ds</code>, by numerically integrating equations &#40;2&#41;-&#40;3&#41; above: <code>pa</code> bundles the interpolated <code>slowness</code>/<code>slowness_x</code>/<code>slowness_z</code> functions and the grid extents used to detect when a ray has left the domain. Each initial slowness vector&#39;s <em>direction</em> is kept but its magnitude is rescaled to the true local slowness at the source &#40;so only takeoff angle matters, not the caller&#39;s chosen units&#41;. Travel time is accumulated along the way &#40;<span class=\"tex\">$\\int s\\,dl$</span>&#41;, since it&#39;s needed both to animate the wavefront and to cross-check against the Eikonal solution below.</p>\n<p>Returns a vector of <code>&#40;path, traveltime&#41;</code> named tuples: <code>path</code> a <code>2×N</code> matrix &#40;rows <code>&#91;z,x&#93;</code>&#41;, <code>traveltime</code> an <code>N</code>-vector, both <code>missing</code>/<code>NaN</code>-padded once a ray exits the domain.</p>\n\n\n</div>\n</div>\n"""

