text_representation = """<div class=\"markdown\"><div class=\"admonition note\"><p class=\"admonition-title\">Observations</p><ul>\n<li><p>The angle of incidence &#40;70°, in this reference example&#41; is greater than the critical angle.</p>\n</li>\n<li><p>The amplitude of the inhomogeneous &#40;evanescent&#41; transmitted wave decays exponentially away from the boundary.</p>\n</li>\n<li><p>There is a phase change in the reflected wave.</p>\n</li>\n<li><p>The exponential decay rate is a function of the angular frequency.</p>\n</li>\n</ul>\n<p></p>\n\n</div>\n</div>"""

