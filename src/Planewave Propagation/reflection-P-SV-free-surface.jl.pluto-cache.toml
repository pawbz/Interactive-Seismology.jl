text_representation = """<div class=\"markdown\"><div class=\"admonition note\"><p class=\"admonition-title\">Observations</p><ul>\n<li><p>The angle of reflection of the S-wave is always less than that of the P-reflected wave. This is because the vertical slowness of the S-reflected wave &#40;<code>η_β</code>&#41; is always greater than that of the P-reflected wave.</p>\n</li>\n<li><p>The wavenumber of the S-reflected wave is higher than that of the P-wave. The wavenumber of the S-reflected wave increases as <code>β</code> becomes smaller compared to <code>α</code>.</p>\n</li>\n<li><p>When <code>β</code> is very small, the amplitude of the S-reflected wave is negligible.</p>\n</li>\n<li><p>A negative reflection coefficient indicates a phase change of the reflected wave by π.</p>\n</li>\n<li><p>The P-reflection coefficient and S-reflection coefficient follow the conservation of energy. The P-reflection coefficient is maximum when the S-reflection coefficient is minimum.</p>\n</li>\n</ul>\n\n</div>\n</div>"""

