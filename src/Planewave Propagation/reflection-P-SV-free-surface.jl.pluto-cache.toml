text_representation = """<div class=\"markdown\"><h2 id=\"Potentials-:-Incident-P-wave,-Reflected-P-wave-and-Reflected-SV-wave\">Potentials : Incident P-wave, Reflected P-wave and Reflected SV-wave</h2>\n<p>For the P-SV system on a free surface, all the waves are traveling in the same medium. The velocity of the P-wave is denoted by <code>α</code> and the velocity of the S-wave is denoted by <code>β</code>. The plane waves representing potentials share the same horizontal slowness <code>p</code>.</p>\n<ul>\n<li><p>Now, we create an incident wave using the <code>plane</code> function with parameters <code>p</code>, <code>η₁</code>, and <code>A</code>, representing the horizontal slowness, verticle slowness, and amplitude, respectively. </p>\n</li>\n<li><p>Then, two reflected waves, <code>reflect1</code> and <code>reflect2</code>, are also defined using the <code>plane</code> function. The first reflected wave, <code>reflect1</code>, uses the parameters <code>p</code>, <code>-η₁</code>, and <code>A₁</code>, indicating a reflection with opposite vertical slowness and a different amplitude. </p>\n</li>\n<li><p>Similarly, the second reflected wave, <code>reflect2</code>, is defined with <code>p</code>, <code>-η₂</code>, and <code>A₂</code>, representing another reflection with a different vertical slowness and amplitude. This setup models the behavior of P and S incident and reflected waves at a free surface.</p>\n</li>\n</ul>\n</div>"""

