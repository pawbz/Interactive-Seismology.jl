text_representation = """<div class=\"markdown\"><h1 id=\"Boundary-Conditions\">Boundary Conditions</h1>\n<p>These conditions determine the relationship between the displacements and tractions across an interface between two media. Here, we consider different interfaces, whose unit normal vector is denoted using <code>n</code>. For a given location on the interface, we use <code>σ¹</code> to denote the stress tensor just above the interface and <code>σ²</code> to denote the stress tensor just below the interface. Similarly, we use <code>u¹</code> and <code>u²</code> to denote displacements above and below the interface, respectively. In seismology, we often encounter three types of interfaces.</p>\n<ul>\n<li><p>Solid–Solid &#40;Welded Interface&#41;</p>\n</li>\n<li><p>Solid–Liquid</p>\n</li>\n<li><p>Solid–Vaccum &#40;Free Interface&#41;</p>\n</li>\n</ul>\n<h5 id=\"Interactive-Seismology-Notebooks\"><a href=\"https://pawbz.github.io/Interactive-Seismology.jl/\">Interactive Seismology Notebooks</a></h5>\n<p>Instructor: <em>Pawan Bharadwaj</em>, Indian Institute of Science, Bengaluru, India</p>\n</div>"""

