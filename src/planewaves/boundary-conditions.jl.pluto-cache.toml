text_representation = """<div class=\"markdown\"><h3 id=\"Dynamic-conditions\">Dynamic conditions</h3>\n<p>These are derived  considering a Gaussian pillbox intersecting the interface with negligible volume. It can be shown that this pillbox can have zero acceleration only when the  traction on the interface is continuous across the interface.</p>\n</div>"""

