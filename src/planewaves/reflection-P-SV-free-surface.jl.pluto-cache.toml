text_representation = """<div class=\"pluto-docs-binding\">\n<span id=\"plot_planewave\">plot_planewave</span>\n<div class=\"markdown\"><pre><code class=\"language-julia\">plot_planewave&#40;ui, ur1, ur2, t1&#61;0&#41;</code></pre>\n<p>A heatmap of the summed wavefield &#40;incident &#43; both reflected legs, symbolic expressions in <code>x</code>, <code>z</code>, <code>t</code>&#41; at time <code>t1</code>, restricted to the solid half-space below the free surface. Which legs are actually summed is controlled by the module-level <code>plot_waves</code> list.</p>\n\n\n</div>\n</div>\n"""

