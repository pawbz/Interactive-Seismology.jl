text_representation = """<div class=\"markdown\"><h3 id=\"Verifying-the-coefficients\">Verifying the coefficients</h3>\n<p>At normal incidence &#40;<code>θ&#61;0</code>&#41;, there is no mode conversion: a P wave striking the surface head-on reflects only as P &#40;and likewise for S&#41;, so the mode-converted amplitude should vanish, and since a free surface reflects all incident energy, the direct reflection coefficient&#39;s magnitude should be exactly 1.</p>\n</div>"""

