text_representation = """<div class=\"markdown\"><h1 id=\"SH-Reflection-&amp;-Transmission-Coefficients\">SH Reflection &amp; Transmission Coefficients</h1>\n<p>In this notebook, we analyze the amplitudes of reflected and transmitted  plane waves at the interface between two geological layers.  Assuming a horizontal interface at <code>z&#61;0</code>, we use boundary conditions to derive expressions for the reflected and transmitted amplitudes. For simplicity, we focus on shear-horizontal &#40;SH&#41; waves.</p>\n<h5 id=\"Interactive-Seismology-Notebooks\"><a href=\"https://pawbz.github.io/Interactive-Seismology.jl/\">Interactive Seismology Notebooks</a></h5>\n<p>Instructor: <em>Pawan Bharadwaj</em>, Indian Institute of Science, Bengaluru, India</p>\n</div>"""

