text_representation = """<div class=\"markdown\"><h3 id=\"Verifying-the-coefficients\">Verifying the coefficients</h3>\n<p>At normal incidence &#40;<code>θ&#61;0</code>&#41;, the reflection and transmission coefficients reduce to the classic impedance-ratio result &#40;the same formula as an acoustic wave hitting a welded boundary&#41;: with impedance <code>Z &#61; ρβ</code> in each layer,</p>\n<p class=\"tex\">$$A_r&#40;0&#41; &#61; \\frac&#123;Z_1-Z_2&#125;&#123;Z_1&#43;Z_2&#125;, \\qquad A_t&#40;0&#41; &#61; \\frac&#123;2Z_1&#125;&#123;Z_1&#43;Z_2&#125;$$</p>\n</div>"""

