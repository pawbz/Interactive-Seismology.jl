text_representation = """<div class=\"markdown\"><h2 id=\"Setup\">Setup</h2>\n<p>The key steps involved in this analysis are:</p>\n<ol>\n<li><p><strong>Defining the Plane Waves</strong>: We define the mathematical expressions for the incident, reflected, and transmitted SH waves using their amplitudes, horizontal slowness <code>p</code>, and vertical slowness <code>η</code>.</p>\n</li>\n<li><p><strong>Applying Boundary Conditions</strong>: We impose the kinematic boundary condition &#40;continuity of displacement&#41; and the dynamic boundary condition &#40;continuity of traction&#41; at the interface to derive equations relating the amplitudes of the waves.</p>\n</li>\n<li><p><strong>Solving for Coefficients</strong>: We solve the derived equations to obtain the reflection and transmission coefficients, which describe the amplitudes of the reflected and transmitted waves relative to the incident wave.</p>\n</li>\n</ol>\n<p>This analysis helps in understanding how SH waves interact with geological layers, which is crucial for interpreting seismic data and exploring subsurface structures.</p>\n</div>"""

