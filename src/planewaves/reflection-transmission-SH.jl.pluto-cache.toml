text_representation = """<div class=\"markdown\"><h2 id=\"Continuity-in-Displacement;-Kinematic-Boundary-Conditions\">Continuity in Displacement; Kinematic Boundary Conditions</h2>\n<p>For two solids welded in contact, the kinematic boundary condition is that all three components of the displacement have to be continuous across the boundary. We begin with expressions of the incident, transmitted and reflected plane waves. Note that all these plane waves share the same horizontal slowness <code>p</code>.</p>\n</div>"""

