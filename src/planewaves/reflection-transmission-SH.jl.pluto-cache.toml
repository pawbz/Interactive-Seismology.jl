text_representation = """<div class=\"markdown\"><h2 id=\"Continuity-in-Traction;-Dynamic-Boundary-Conditions\">Continuity in Traction; Dynamic Boundary Conditions</h2>\n<p>Apparently, a continuity in displacement is not sufficient for us to uniquely  determine both Aₜ and Aᵣ, given A. We should also employ the dynamic boundary condition, i.e., a constraint that traction on the surface <code>z&#61;0</code> is continuous. Specifically, here the component <code>σyz</code> of the stress tensor has to be continuous.</p>\n</div>"""

