text_representation = """<div class=\"markdown\"><h2 id=\"Christoffel-Matrix-M\">Christoffel Matrix <code>M</code></h2>\n<p>Now we would like to work towards the construction of a transformation matrix <code>M</code> such that <code>ga&#61;M*g</code>. Notice that <code>gb</code> is already in the direction of the amplitude vector, so once we construct <code>M</code>, all we need to solve is an eigenvalue problem</p>\n<p class=\"tex\">$$M*g &#61; ρv^2*g,$$</p>\n<p>where the eigenvalues will give us the phase velocities. Note that <code>M</code> depends on the direction of the slowness vector <code>s</code>, therefore leading to anisotropy. As <code>M</code> is symmetric, we have three solutions for general anisotropic case: a single quasi-P wave &#40;qP&#41; and two quasi-S waves &#40;qS&#41;.</p>\n</div>"""

