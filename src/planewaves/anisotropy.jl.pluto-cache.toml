text_representation = """<div class=\"markdown\"><h1 id=\"Anisotropy\">Anisotropy</h1>\n<p>It is important to consider deviations from isotropy when imaging the Earth. Although there could be up to 21 independent linear elastic constants, we attach the term <em>anisotropy</em> to a situation where we use more than two elastic constants to describe the medium. </p>\n<ul>\n<li><p><strong>Lattice-preferred anisotropy &#40;LPO&#41;</strong>: homogeneous material, but there is preferred crystal orientation, e.g., olivine.</p>\n</li>\n<li><p><strong>Shape-preferred anisotropy &#40;SPO&#41;</strong>: a stack of rock layers with different isotropic properties cause seismic velocities to differ in different directions, or preferred orientation of cracks in the medium.</p>\n</li>\n</ul>\n<p>It is often difficult to distinguish the effects of anisotropy and those of medium heterogeneity. The presence of anisotropy results in non-circular wavefronts, even though the elastic constants are homogeneous. We can visualize wavefronts after projecting them along different planes by interacting with the plot below.</p>\n<h5 id=\"Interactive-Seismology-Notebooks\"><a href=\"https://pawbz.github.io/Interactive-Seismology.jl/\">Interactive Seismology Notebooks</a></h5>\n<p>Instructor: <em>Pawan Bharadwaj</em>, Indian Institute of Science, Bengaluru, India</p>\n</div>"""

