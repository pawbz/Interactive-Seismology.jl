text_representation = """<div class=\"pluto-docs-binding\">\n<span id=\"spherical_harmonic_gradient\">spherical_harmonic_gradient</span>\n<div class=\"markdown\"><pre><code class=\"language-julia\">spherical_harmonic_gradient&#40;l::Int, m::Int, θ, φ&#41;</code></pre>\n<p>The surface gradient <code>∇Y_l^m &#61; &#40;∂Y/∂θ, ∂Y/∂φ&#41;</code>, computed with <code>ForwardDiff</code> by differentiating the real and imaginary parts of <a href=\"@ref\"><code>Y_lm</code></a> separately and recombining as a complex vector. Feeds the poloidal &#40;<code>S</code>&#41; and toroidal &#40;<code>T</code>&#41; components in <a href=\"@ref\"><code>vector_spherical_harmonics</code></a>.</p>\n\n\n</div>\n</div>\n"""

