text_representation = """<div class=\"markdown\"><h1 id=\"Visualization-of-Spherical-Harmonics\">Visualization of Spherical Harmonics</h1>\n<p>Spherical harmonics are fundamental mathematical functions used to describe <strong>wave phenomena</strong> on a sphere. They appear in seismology while modeling Earth&#39;s free oscillations. </p>\n<h5 id=\"Interactive-Seismology-Notebooks\"><a href=\"https://pawbz.github.io/Interactive-Seismology.jl/\">Interactive Seismology Notebooks</a></h5>\n<p>Instructor: <em>Pawan Bharadwaj</em>, Indian Institute of Science, Bengaluru, India</p>\n</div>"""

