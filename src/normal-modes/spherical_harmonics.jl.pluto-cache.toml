result_hash = "d65162656cbc43ac"
runtime_ns = 787334
text_representation = """<div class=\"markdown\"><h5 id=\"What-are-l,-m,-and-the-R/S/T-motion-field?\">What are <code>l</code>, <code>m</code>, and the R/S/T motion field?</h5>\n<p>The <strong>degree <code>l</code></strong> counts how many nodal lines &#40;zero-crossings&#41; the pattern has on the sphere &amp;mdash; higher <code>l</code> means a more finely-lobed pattern. The <strong>order <code>m</code></strong> &#40;with <code>-l ≤ m ≤ l</code>&#41; splits those lobes between latitude and longitude: <code>m &#61; 0</code> gives purely latitudinal bands, <code>|m| &#61; l</code> gives purely longitudinal &#40;orange-slice&#41; lobes.</p>\n<p>For Earth&#39;s free oscillations, a mode&#39;s spatial pattern on the sphere is exactly a spherical harmonic <code>Y_l^m</code>, and its particle motion decomposes into three vector fields:</p>\n<ul>\n<li><p><strong>Radial &#40;<code>R</code>&#41;</strong>: purely outward/inward motion, like a breathing sphere &amp;mdash; associated with the &quot;spheroidal&quot; family &#40;also involves horizontal motion in general; here isolated to show the radial part alone&#41;.</p>\n</li>\n<li><p><strong>Poloidal &#40;<code>S</code>&#41;</strong>: horizontal motion aligned with the surface gradient of <code>Y_l^m</code> &amp;mdash; the tangential part of spheroidal modes.</p>\n</li>\n<li><p><strong>Toroidal &#40;<code>T</code>&#41;</strong>: horizontal motion perpendicular to the gradient of <code>Y_l^m</code> &amp;mdash; a purely rotational shearing motion with no radial component at all, the signature of toroidal modes.</p>\n</li>\n</ul>\n<p>The radial panel shows a spherical Bessel function <code>j_l&#40;ωr/c&#41;</code> for a <strong>uniform, non-dispersive sphere</strong> &#40;<code>c &#61; 5 km/s</code> throughout, not a real depth-dependent Earth model&#41; &amp;mdash; a simplification that keeps the radial shape simple enough to read at a glance, in exchange for not being quantitatively Earth-like.</p>\n</div>"""

