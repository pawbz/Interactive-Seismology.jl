text_representation = """<div class=\"pluto-docs-binding\">\n<span id=\"vector_spherical_harmonics\">vector_spherical_harmonics</span>\n<div class=\"markdown\"><pre><code class=\"language-julia\">vector_spherical_harmonics&#40;l, m, θ, φ, mode_type&#41;</code></pre>\n<p>One of the three vector spherical harmonics at <code>&#40;θ,φ&#41;</code>, returned as spherical components <code>&#91;r, θ, φ&#93;</code>:</p>\n<ul>\n<li><p><code>&quot;R&quot;</code> &#40;radial&#41;: purely outward/inward motion, magnitude <code>Y_l^m</code> itself.</p>\n</li>\n<li><p><code>&quot;S&quot;</code> &#40;poloidal&#41;: tangential motion along <code>∇Y_l^m</code>, normalized by <code>1/√&#40;l&#40;l&#43;1&#41;&#41;</code>.</p>\n</li>\n<li><p><code>&quot;T&quot;</code> &#40;toroidal&#41;: tangential motion perpendicular to <code>∇Y_l^m</code> &#40;a 90° rotation of the poloidal field&#41;, same normalization.</p>\n</li>\n</ul>\n\n\n</div>\n</div>\n"""

