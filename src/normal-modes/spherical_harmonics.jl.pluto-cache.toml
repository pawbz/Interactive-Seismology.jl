text_representation = """<div class=\"pluto-docs-binding\">\n<span id=\"Y_lm\">Y_lm</span>\n<div class=\"markdown\"><pre><code class=\"language-julia\">Y_lm&#40;l, m, θ, φ&#41;</code></pre>\n<p>The complex surface spherical harmonic <code>Y_l^m&#40;θ,φ&#41;</code>, fully normalized so that <code>∫|Y_l^m|² dΩ &#61; 1</code> over the unit sphere. <code>θ</code> is colatitude &#40;0 at the north pole&#41;, <code>φ</code> is longitude. Built from <code>AssociatedLegendrePolynomials.λlm</code> &#40;which already carries the normalization and Condon-Shortley phase&#41; times the azimuthal factor <code>exp&#40;im*m*φ&#41;</code>.</p>\n\n\n</div>\n</div>\n"""

