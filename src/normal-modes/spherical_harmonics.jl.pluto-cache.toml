text_representation = """<div class=\"pluto-docs-binding\">\n<span id=\"spherical_harmonics\">spherical_harmonics</span>\n<div class=\"markdown\"><pre><code class=\"language-julia\">spherical_harmonics&#40;l, m, θ, φ&#41;</code></pre>\n<p><code>Y_l^m&#40;θ,φ&#41;</code>, or <code>zero&#40;θ&#41;</code> when <code>|m| &gt; l</code> &#40;an invalid but commonly-swept-over combination when <code>m</code> is driven by a slider that hasn&#39;t yet clamped to the new <code>l</code>&#41;. Returns the full complex value – callers take <code>real&#40;...&#41;</code> where a scalar is needed.</p>\n\n\n</div>\n</div>\n"""

[cells.866c00fd-bf69-460b-90b2-79ecf1f72d66]
