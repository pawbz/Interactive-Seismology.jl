text_representation = """<div class=\"pluto-docs-binding\">\n<span id=\"specnm_type_payload\">specnm_type_payload</span>\n<div class=\"markdown\"><pre><code class=\"language-julia\">specnm_type_payload&#40;cls, cls_out, angular_orders, frequencies, overtones&#41;</code></pre>\n<p>Serialize one solved class&#39;s &#40;spheroidal or toroidal&#41; full mode catalogue and eigenfunctions to a JSON object string for <a href=\"@ref\"><code>SpecnmBrowseView</code></a>: <code>l</code>/<code>f</code>/<code>n</code> per mode, component <code>labels</code> &#40;<code>&#91;&quot;U&quot;,&quot;V&quot;&#93;</code>, <code>&#91;&quot;U&quot;,&quot;V&quot;,&quot;P&quot;&#93;</code>, or <code>&#91;&quot;W&quot;&#93;</code>&#41;, the shared <code>depth</code> grid, and <code>ef</code> – one flat <strong>mode-major</strong> array per component &#40;<code>ef&#91;c&#93;&#91;mode*nradial &#43; i&#93;</code>, so the widget can slice out one mode&#39;s curve by index without any further Julia round-trip&#41;.</p>\n\n\n</div>\n</div>\n"""

