text_representation = """<div class=\"markdown\"><h5 id=\"What-are-spheroidal-and-toroidal-modes?\">What are spheroidal and toroidal modes?</h5>\n<p>A planet&#39;s free oscillations split into two independent families, both indexed by angular degree <code>l</code> &#40;spherical-harmonic degree, more nodal lines as <code>l</code> grows&#41; and overtone number <code>n</code> &#40;radial order – <code>n&#61;0</code> is the fundamental, higher <code>n</code> adds radial nodes&#41;:</p>\n<ul>\n<li><p><strong>Spheroidal &#40;<code>ₙSₗ</code>&#41;</strong>: motion has both radial and horizontal components, coupled to gravity and compression – shown as <strong>U</strong> &#40;radial displacement&#41;, <strong>V</strong> &#40;horizontal displacement&#41;, and, for a self-gravitating solve, <strong>P</strong> &#40;perturbation to the gravitational potential&#41;.</p>\n</li>\n<li><p><strong>Toroidal &#40;<code>ₙTₗ</code>&#41;</strong>: purely horizontal, rotational shearing motion with no radial component and no coupling to gravity – shown as <strong>W</strong> &#40;horizontal displacement&#41;. Toroidal modes don&#39;t exist in a fluid &#40;they need shear rigidity&#41;, so they vanish wherever <code>vs &#61; 0</code> in the Earth model.</p>\n</li>\n</ul>\n<p>The eigenfunction panel plots each component versus depth for whichever mode you click in the spectrum – their zero-crossings are exactly the mode&#39;s radial nodes, and the amplitude near the surface versus near the core tells you how deeply that mode samples the planet.</p>\n</div>"""

