text_representation = """<div class=\"markdown\"><h1 id=\"🌍-Exploring-Free-Oscillations\">🌍 Exploring Free Oscillations</h1>\n<p>In this notebook, we will explore <strong>free oscillations of spherically symmetric bodies</strong>, which describe how a planet vibrates after a large disturbance &#40;e.g., an earthquake&#41;.   The numerical tool <strong><code>specnm</code></strong> allows us to compute <strong>gravito-elastic normal modes</strong> by solving the <strong>radial ordinary differential equations &#40;ODEs&#41;</strong> using a <strong>spectral element discretization</strong>.</p>\n<p><code>specnm</code>:  A spectral element approach to computing normal modes,  J Kemper, M van Driel, F Munch, A Khan, D Giardini, Geophysical Journal International, Volume 229, Issue 2, May 2022, Pages 915–932.</p>\n<h5 id=\"Interactive-Seismology-Notebooks\"><a href=\"https://pawbz.github.io/Interactive-Seismology.jl/\">Interactive Seismology Notebooks</a></h5>\n<p>Instructor: <em>Pawan Bharadwaj</em>, Indian Institute of Science, Bengaluru, India</p>\n</div>"""

