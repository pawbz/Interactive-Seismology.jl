text_representation = """<div class=\"pluto-docs-binding\">\n<span id=\"specnm_overtones\">specnm_overtones</span>\n<div class=\"markdown\"><pre><code class=\"language-julia\">specnm_overtones&#40;angular_orders, l1_start&#41;</code></pre>\n<p>Overtone number <code>n</code> for each mode in <code>angular_orders</code> &#40;sorted by degree <code>l</code> as <code>specnm</code> returns them&#41;: within each <code>l</code>, overtones run <code>0, 1, 2, ...</code>, except at <code>l &#61;&#61; 1</code> where the lowest <code>l1_start</code> overtones don&#39;t exist &#40;translation/rotation modes for spheroidal, <code>l1_start &#61; 2</code>; the missing <code>0T1</code> for toroidal, <code>l1_start &#61; 1</code>&#41; and numbering starts from <code>l1_start</code> instead.</p>\n\n\n</div>\n</div>\n"""

