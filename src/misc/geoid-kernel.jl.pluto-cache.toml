text_representation = """<div class=\"markdown\"><h2 id=\"Why-Does-a-Dense-Blob-Make-a-Geoid-Low?\">Why Does a Dense Blob Make a Geoid <em>Low</em>?</h2>\n<p>Drop a dense lump into the mantle. Ask a student what happens to the geoid — the shape of sea level — directly above it, and almost everyone says the same thing: <em>more mass means more gravity, so the geoid goes up.</em></p>\n<p>That answer is right for a rock sitting on a table. It is often <strong>wrong</strong> for a rock sitting inside a convecting planet, and understanding why is the point of this notebook.</p>\n<p>The reason is that the mantle <strong>flows</strong>. A dense anomaly does not just sit there adding its own gravitational pull. It sinks, and as it sinks it drags the whole mantle with it. That flow pushes <em>down</em> on the Earth&#39;s surface from below, creating a shallow depression, and it pushes <em>down</em> on the core–mantle boundary too, deflecting it into the core. Both of those deflected boundaries are enormous density contrasts — rock against air at the top, rock against iron at the bottom — so the mass they move around is not a small correction. It can be <strong>larger than the anomaly&#39;s own pull</strong>, and it has the opposite sign.</p>\n<p>So the geoid you actually measure is a competition between three mass contributions:</p>\n<ol>\n<li><p>the density anomaly itself — <em>positive</em> for a dense blob,</p>\n</li>\n<li><p>the depressed <strong>surface</strong> it creates — <em>negative</em>,</p>\n</li>\n<li><p>the depressed <strong>core–mantle boundary</strong> — also <em>negative</em> &#40;pushing the CMB down replaces dense core with lighter mantle, a mass deficit&#41;.</p>\n</li>\n</ol>\n<p>Both boundaries push the same way, against the anomaly. A single downwelling cannot depress the surface while raising the CMB.</p>\n<h3 id=\"Why-depth-decides-the-winner\">Why depth decides the winner</h3>\n<p>The crucial point is that ① and ② are <strong>two consequences of the same mass excess</strong>, pulling in opposite directions — and <em>proximity to the surface</em> is what sets their balance.</p>\n<p><strong>A shallow dense anomaly</strong> is close to the surface, so it depresses the surface strongly. That depression is a big mass <em>deficit</em> sitting right where you are measuring, and it more than cancels the anomaly&#39;s own enhanced pull. Net: a geoid <strong>low</strong>, even though you added mass.</p>\n<p><strong>A deep dense anomaly</strong> does the opposite on both counts. It is far from the surface, so the flow it drives has largely died out by the time it reaches the top — the surface barely deflects. Meanwhile it deflects the <strong>CMB</strong> strongly instead. But the CMB is 2891 km away from where you measure, and gravitational signals attenuate with distance as <span class=\"tex\">$&#40;b/a&#41;^&#123;\\ell&#43;2&#125;$</span>, only <strong>0.089</strong> at <span class=\"tex\">$\\ell &#61; 2$</span> — so that large CMB deflection is barely felt at the surface. The anomaly&#39;s own pull survives, and the net can come out <strong>positive</strong>.</p>\n<p>That is the whole mechanism: <em>shallow anomalies are dominated by the surface deflection they cause; deep anomalies are dominated by their own attraction, because the boundary they deflect is too far away to matter.</em> Which regime you are in depends on depth and on <strong>how viscosity varies with depth</strong> — that is what a <em>geoid kernel</em> summarises, and why the geoid is one of our best constraints on mantle viscosity &#40;Hager &amp; Richards, 1989&#41;.</p>\n<p>This matters for a real, unsolved problem: the <strong>Indian Ocean Geoid Low</strong>, a ~106 m depression in sea level south of India — the deepest geoid low on Earth. One family of explanations involves deep dense material. This notebook is about building the intuition for how that is even possible.</p>\n<h5 id=\"Interactive-Seismology-Notebooks\"><a href=\"https://pawbz.github.io/Interactive-Seismology.jl/\">Interactive Seismology Notebooks</a></h5>\n<p>Instructor: <em>Pawan Bharadwaj</em>, Indian Institute of Science, Bengaluru, India</p>\n</div>"""

