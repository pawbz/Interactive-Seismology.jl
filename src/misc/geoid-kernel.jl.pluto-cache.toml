text_representation = """<div class=\"markdown\"><h2 id=\"The-Indian-Ocean-Geoid-Low\">The Indian Ocean Geoid Low</h2>\n<p>South of India lies the deepest geoid low on Earth: sea level sits roughly <strong>106 m below</strong> the reference ellipsoid over a vast region of the Indian Ocean. Explaining it is an open research problem.</p>\n<p>What this notebook gives you is the crucial piece of intuition. The naive objection — <em>&quot;but there is dense subducted slab material down there, so shouldn&#39;t the geoid be high?&quot;</em> — dissolves once you have seen the kernel. Under the right viscosity structure, deep dense material produces a geoid <strong>low</strong>, because the boundary-deflection terms outvote the anomaly&#39;s direct attraction.</p>\n<p>Try it: hit <strong>IOGL-like</strong>, which drops a compact dense anomaly of roughly the right size &#40;≈3800 km across&#41; into the mid-mantle. Keep the viscosity ratio near 1 and a <strong>localized geoid low</strong> of about <strong>−4.4 m</strong> appears above it — not a band around the whole planet, but a patch, because the density field here is genuinely three-dimensional. Now slide the viscosity ratio up:</p>\n<table><tr><th align=\"right\"><span class=\"tex\">$\\eta_&#123;lower&#125;/\\eta_&#123;upper&#125;$</span></th><th align=\"right\">geoid above the anomaly</th></tr><tr><td align=\"right\">1×</td><td align=\"right\">−4.4 m &#40;low&#41;</td></tr><tr><td align=\"right\">3×</td><td align=\"right\">−3.1 m &#40;low&#41;</td></tr><tr><td align=\"right\">10×</td><td align=\"right\">−1.3 m &#40;low&#41;</td></tr><tr><td align=\"right\">30×</td><td align=\"right\"><strong>&#43;0.7 m &#40;high&#41;</strong></td></tr></table>\n<p>That sensitivity is the point. The same dense anomaly gives a geoid low or a geoid high depending entirely on the viscosity profile — which is exactly why the feature remains contested, and why the geoid is such a useful constraint on mantle rheology.</p>\n<div class=\"admonition warning\"><p class=\"admonition-title\">One honest caveat</p><p>Real explanations of the IOGL invoke <strong>lateral</strong> viscosity variations, a low-density anomaly beneath the low, and the detailed history of Tethyan slab sinking. This model has none of those: its density varies in three dimensions, but its viscosity still varies only with depth, and nothing evolves in time. The <strong>IOGL-like</strong> button is a demonstration of a mechanism, not a fit to data — do not read the number it produces as a prediction.</p>\n</div>\n</div>"""

