text_representation = """<div class=\"markdown\"><h2 id=\"Aha-#3:-Viscosity-Controls-the-Flip\">Aha #3: Viscosity Controls the Flip</h2>\n<p>Sweep the <strong>η lower / η upper</strong> slider and watch the kernel. The headline is that <strong>a uniform mantle has no sign flip at all</strong> — viscosity layering is what creates one:</p>\n<table><tr><th align=\"right\"><span class=\"tex\">$\\eta_&#123;lower&#125;/\\eta_&#123;upper&#125;$</span></th><th align=\"right\"><span class=\"tex\">$\\ell&#61;2$</span> sign flip</th></tr><tr><td align=\"right\">1× <em>&#40;uniform&#41;</em></td><td align=\"right\"><strong>none</strong> — single-signed</td></tr><tr><td align=\"right\">3.0×</td><td align=\"right\"><strong>none</strong> — single-signed</td></tr><tr><td align=\"right\">10.0×</td><td align=\"right\"><strong>none</strong> — single-signed</td></tr><tr><td align=\"right\">30.0×</td><td align=\"right\"><strong>1049 km</strong></td></tr><tr><td align=\"right\">100.0×</td><td align=\"right\"><strong>2395 km</strong></td></tr></table>\n<p>For a <strong>uniform</strong> mantle the <span class=\"tex\">$\\ell&#61;2$</span> kernel is negative at every depth: the deflected boundaries always outvote the anomaly&#39;s own attraction, so <em>any</em> dense anomaly gives a geoid low. Only once the lower mantle is stiff enough — around 30× here — does a crossing appear, and the deep mantle starts producing geoid <em>highs</em>.</p>\n<div class=\"admonition tip\"><p class=\"admonition-title\">Why this is how the geoid constrains viscosity</p><p>A stiff lower mantle resists the flow a sinking anomaly tries to drive. Weaken the flow and you weaken the boundary deflections — which are the <em>negative</em> contributions. Enough stiffening and they can no longer outvote the anomaly&#39;s own positive pull at depth.</p>\n<p>That is the inference. Subducted slabs are dense and deep, and they correlate <strong>positively</strong> with the observed geoid. A uniform-viscosity mantle predicts the wrong sign for them. Getting the observed sign right <em>requires</em> a lower mantle substantially stiffer than the upper — the conclusion Hager &amp; Richards reached in 1989, and still one of the strongest constraints we have on mantle rheology.</p>\n</div>\n<div class=\"admonition note\"><p class=\"admonition-title\">The real Earth is not two layers — compare model WL</p><p>This two-layer slider is a caricature. Hager &amp; Richards&#39; own preferred model <strong>WL</strong> gets its sign change largely from a <strong>low-viscosity asthenosphere</strong> &#40;η &#61; 1/30 between 100 and 400 km&#41; rather than from a stiff lower mantle alone:</p>\n<p>| depth | <span class=\"tex\">$K_2&#40;r&#41;$</span> for model WL |</p>\n</div>\n<p>|–-|–-:| | 100 km | <code>4.26e-6</code> | | 300 km | <code>1.08e-5</code> | | 600 km | <code>5.13e-6</code> | | 900 km | <code>-1.6e-6</code> | | 1500 km | <code>-9.15e-6</code> | | 2400 km | <code>-9.43e-6</code> | \tPositive in the upper mantle, crossing between 600 and 900 km, negative below — the \tstructure of the <span class=\"tex\">$G^\\ell$</span> panel in their Figure 2. This is the notebook&#39;s \treproduction-of-a-published-kernel check; the uniform-viscosity case above is our own \tbaseline, not a published result.</p>\n</div>"""

