text_representation = """<div class=\"pluto-docs-binding\">\n<span id=\"modes\">modes</span>\n<div class=\"markdown\"><pre><code class=\"language-julia\">modes&#40;η, ℓ&#41;</code></pre>\n<p>The four fundamental solutions at degree <code>ℓ</code>, each returned as <code>&#40;p, cU, cP&#41;</code> where the radial velocity goes as <code>cU * r^p</code> and the pressure as <code>cP * r^&#40;p-1&#41;</code>.</p>\n<p>Two are homogeneous &#40;<code>cP &#61; 0</code>, no pressure&#41;; two are particular solutions driven by the two harmonic pressure modes. The coefficient <code>cU</code> of a particular mode follows from the radial momentum balance.</p>\n\n\n</div>\n</div>\n"""

[cells.290cfb95-0901-4b4c-7da8-152637485960]
