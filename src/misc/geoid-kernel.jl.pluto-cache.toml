text_representation = """<div class=\"markdown\"><h3 id=\"Validating-the-kernel\">Validating the kernel</h3>\n<p>Seven independent physical checks. Each one would catch a different class of sign error — and two of them &#40;the <strong>compensation limit</strong> and the <strong>Hager &amp; Richards Figure 2 normalisation</strong>&#41; exist because an earlier version of this notebook got the CMB sign wrong and the other checks did not notice.</p>\n</div>"""

