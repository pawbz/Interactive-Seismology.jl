text_representation = """<div class=\"markdown\"><h4 id=\"The-competition,-depth-by-depth\">The competition, depth by depth</h4>\n<p>Here is the balance laid out for a unit dense sheet, in both a uniform mantle and Hager &amp; Richards&#39; model WL. The column that matters is the <strong>ratio</strong> <span class=\"tex\">$|②/①|$</span> — the surface depression divided by the anomaly&#39;s own pull. <strong>The geoid flips sign exactly where that ratio crosses 1.</strong></p>\n<p><strong>Uniform viscosity</strong></p>\n<table><tr><th align=\"right\">depth</th><th align=\"right\"><span class=\"tex\">$\\vert ②/① \\vert$</span></th><th align=\"left\">net geoid</th></tr><tr><td align=\"right\">100 km</td><td align=\"right\"><code>1.021</code></td><td align=\"left\">low</td></tr><tr><td align=\"right\">300 km</td><td align=\"right\"><code>1.06</code></td><td align=\"left\">low</td></tr><tr><td align=\"right\">600 km</td><td align=\"right\"><code>1.112</code></td><td align=\"left\">low</td></tr><tr><td align=\"right\">1000 km</td><td align=\"right\"><code>1.162</code></td><td align=\"left\">low</td></tr><tr><td align=\"right\">1500 km</td><td align=\"right\"><code>1.167</code></td><td align=\"left\">low</td></tr><tr><td align=\"right\">2000 km</td><td align=\"right\"><code>1.047</code></td><td align=\"left\">low</td></tr><tr><td align=\"right\">2500 km</td><td align=\"right\"><code>0.666</code></td><td align=\"left\">low</td></tr><tr><td align=\"right\">2800 km</td><td align=\"right\"><code>0.198</code></td><td align=\"left\">low</td></tr></table>\n<p><strong>Hager &amp; Richards model WL</strong></p>\n<table><tr><th align=\"right\">depth</th><th align=\"right\"><span class=\"tex\">$\\vert ②/① \\vert$</span></th><th align=\"left\">net geoid</th></tr><tr><td align=\"right\">100 km</td><td align=\"right\"><code>0.938</code></td><td align=\"left\"><strong>high</strong></td></tr><tr><td align=\"right\">300 km</td><td align=\"right\"><code>0.817</code></td><td align=\"left\"><strong>high</strong></td></tr><tr><td align=\"right\">600 km</td><td align=\"right\"><code>0.833</code></td><td align=\"left\"><strong>high</strong></td></tr><tr><td align=\"right\">1000 km</td><td align=\"right\"><code>0.919</code></td><td align=\"left\">low</td></tr><tr><td align=\"right\">1500 km</td><td align=\"right\"><code>1.026</code></td><td align=\"left\">low</td></tr><tr><td align=\"right\">2000 km</td><td align=\"right\"><code>1.106</code></td><td align=\"left\">low</td></tr><tr><td align=\"right\">2500 km</td><td align=\"right\"><code>1.079</code></td><td align=\"left\">low</td></tr><tr><td align=\"right\">2800 km</td><td align=\"right\"><code>0.501</code></td><td align=\"left\">low</td></tr></table>\n<p>In the uniform mantle the ratio never drops below 1 until the very base, so every depth gives a low. In model WL the low-viscosity asthenosphere weakens the surface coupling enough that the ratio starts <em>below</em> 1 — shallow anomalies give geoid <strong>highs</strong> — and the crossing to lows happens in the mid-mantle.</p>\n<p>Notice also the last row of each table: the ratio collapses near the CMB, because by then the surface hardly deflects at all. The anomaly is instead deflecting the <strong>CMB</strong> — strongly, but too far from the observer for it to compete, as the attenuation factor above showed.</p>\n</div>"""

