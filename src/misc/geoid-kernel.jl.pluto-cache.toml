text_representation = """<div class=\"markdown\"><h2 id=\"The-Governing-Equations\">The Governing Equations</h2>\n<p>The mantle over geological time is a fluid so viscous that inertia is utterly negligible — the Prandtl number is effectively infinite. What is left is the <strong>Stokes equations</strong>: a statement that at every instant, viscous forces exactly balance buoyancy.</p>\n</div>"""

