text_representation = """<div class=\"markdown\"><h2 id=\"Layer-1:-The-Analytic-Building-Blocks\">Layer 1: The Analytic Building Blocks</h2>\n<p>Rather than transcribe a propagator matrix from a paper — the classic place for a sign error to hide — we <strong>derive</strong> the four fundamental solutions and then verify them against the original differential equations further below.</p>\n<p>Expanding the poloidal flow at degree <span class=\"tex\">$\\ell$</span> &#40;with <span class=\"tex\">$L &#61; \\ell&#40;\\ell&#43;1&#41;$</span>&#41;:</p>\n<p class=\"tex\">$$u_r &#61; U&#40;r&#41;\\,Y_\\ell, \\qquad u_\\theta &#61; V&#40;r&#41;\\,\\partial_\\theta Y_\\ell, \\qquad p &#61; P&#40;r&#41;\\,Y_\\ell$$</p>\n<p>Three facts pin the solution down completely:</p>\n<ol>\n<li><p><strong>Incompressibility</strong> gives <span class=\"tex\">$V$</span> for free: <span class=\"tex\">$V &#61; &#40;rU&#39; &#43; 2U&#41;/L$</span>.</p>\n</li>\n<li><p><strong>The pressure is harmonic</strong>, <span class=\"tex\">$\\nabla^2 p &#61; 0$</span>, so <span class=\"tex\">$P \\propto r^s$</span> with <span class=\"tex\">$s^2 &#43; s - L &#61; 0$</span>, giving <span class=\"tex\">$s &#61; \\ell$</span> or <span class=\"tex\">$s &#61; -&#40;\\ell&#43;1&#41;$</span>.</p>\n</li>\n<li><p><strong>The homogeneous radial equation</strong> <span class=\"tex\">$U&#39;&#39; &#43; 4U&#39;/r &#43; &#40;2-L&#41;U/r^2 &#61; 0$</span> gives <span class=\"tex\">$p &#61; \\ell-1$</span> or <span class=\"tex\">$p &#61; -\\ell-2$</span>; each pressure mode drives a particular solution with <span class=\"tex\">$p &#61; s&#43;1$</span>.</p>\n</li>\n</ol>\n<p>Together the four radial exponents are</p>\n<p class=\"tex\">$$U \\sim \\&#123;\\, r^&#123;\\ell-1&#125;,\\; r^&#123;\\ell&#43;1&#125;,\\; r^&#123;-\\ell&#125;,\\; r^&#123;-\\ell-2&#125; \\,\\&#125;$$</p>\n<p>Every quantity we need is a pure power of <span class=\"tex\">$r$</span>, so the code below is short and exact.</p>\n</div>"""
