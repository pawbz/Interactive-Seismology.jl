text_representation = """<div class=\"markdown\"><h2 id=\"Reducing-3-D-Flow-to-a-Stack-of-1-D-Problems\">Reducing 3-D Flow to a Stack of 1-D Problems</h2>\n<p>Solving the Stokes equations in 3-D needs a mesh and a serious solver. We do not need one, because of a piece of good luck: <strong>if viscosity varies only with radius</strong>, the problem <em>separates</em> by spherical-harmonic degree. Each degree <span class=\"tex\">$\\ell$</span> evolves completely independently of every other.</p>\n<p>There is a second, less obvious piece of good luck that makes this cheap: <strong>the radial problem does not depend on the order</strong> <span class=\"tex\">$m$</span>. Only the combination <span class=\"tex\">$L &#61; \\ell&#40;\\ell&#43;1&#41;$</span> from the angular part ever enters the radial equations, so all <span class=\"tex\">$2\\ell&#43;1$</span> orders within a degree share one and the same kernel <span class=\"tex\">$K_\\ell&#40;r&#41;$</span>.</p>\n<p>That is why a fully three-dimensional density field costs almost nothing extra. We compute the kernel <strong>once per degree</strong> — 20 solves, not 441 — and reuse it for every order.</p>\n<p>The whole pipeline becomes:</p>\n<pre><code>paint δρ&#40;r,θ,φ&#41;  →  spherical-harmonic transform  →  δρ_ℓm&#40;r&#41;\n                 →  apply the 1-D radial kernel K_ℓ&#40;r&#41; for each ℓ  &#40;same for all m&#41;\n                 →  sum over ℓ and m  →  geoid N&#40;θ,φ&#41;</code></pre>\n<p>So the &quot;solver&quot; is still a <strong>loop of small 1-D problems</strong>, one per degree, truncated at <span class=\"tex\">$\\ell_&#123;max&#125; &#61; 20$</span>. No mesh. No 3-D solver. That is why this runs instantly in your browser even though the anomaly you paint is genuinely localized in both latitude and longitude.</p>\n<div class=\"admonition note\"><p class=\"admonition-title\">Why ``\\ell_{max}`` is fixed rather than a slider</p><p><span class=\"tex\">$\\ell_&#123;max&#125;$</span> is a numerical parameter, not a physical one. Turning it down does not model a different Earth — it just blurs the answer, and below about <span class=\"tex\">$\\ell &#61; 16$</span> a compact blob starts to ring &#40;Gibbs oscillations&#41; in a way that looks like physics but is not. So it is pinned at 20, and the brush instead enforces a <strong>minimum anomaly size</strong> that the expansion can represent faithfully. Pleasingly, that floor &#40;≈1900 km radius&#41; is about the scale of the Indian Ocean Geoid Low itself.</p>\n</div>\n</div>"""

