text_representation = """<div class=\"markdown\"><h3 id=\"The-Paint-Your-Own-Earth-Sandbox\">The Paint-Your-Own-Earth Sandbox</h3>\n<p>Everything below is driven by the globe you are about to see. <strong>Paint a density anomaly</strong> into the mantle and watch the geoid respond on the surface above it.</p>\n<ul>\n<li><p><strong>The globe</strong> — a cut-away Earth. The <strong>outer surface is coloured by the geoid</strong>, warm &#40;yellow→red&#41; where sea level bulges up and cool &#40;blue→indigo&#41; where it sags down. A wedge is removed so you can see inside, and the two flat <strong>cut faces</strong> show the mantle with your painted anomalies in it &#40;blue dense, red light&#41;. Thick <strong>orange curves</strong> on those faces trace the <strong>deflected surface and CMB</strong>, exaggerated so they are visible at all.</p>\n</li>\n<li><p><strong>Right panel</strong> — the <em>kernel</em> <span class=\"tex\">$K_\\ell&#40;r&#41;$</span>: the geoid produced by a unit anomaly placed at each depth. <strong>Where it crosses zero is where the sign flips.</strong> Markers show the depth of each anomaly you have painted.</p>\n</li>\n</ul>\n<p><strong>How to paint.</strong> Drag anywhere to rotate, then <strong>click on an exposed cut face</strong> — the click lands the anomaly at exactly that depth and latitude. There is no depth setting to fiddle with: you are pointing straight at the place in the mantle where you want the anomaly, and the kernel panel marks the depth of everything you have painted so you can see at a glance which side of the sign flip each one falls on.</p>\n<p>Untick <strong>cut away</strong> to close the wedge and see the geoid on a whole, unobstructed globe — useful once you have finished painting. The <strong>slice longitude</strong> slider swings the cut around so you can section through whatever you have drawn &#40;painting moves it there automatically&#41;.</p>\n<div class=\"admonition tip\"><p class=\"admonition-title\">Seeing the flow — the missing middle step</p><p>Tick <strong>show instantaneous flow</strong> to draw velocity arrows on the cut faces. This is the step the rest of the picture leaves implicit: the anomaly drives flow, and <em>that flow</em> is what pushes on the boundaries and deflects them. A dense blob shows a clear downwelling beneath it, dying to nothing at the surface and the CMB where free slip forbids flow through the boundary.</p>\n<p><strong>The arrows are not motion.</strong> This is a single instantaneous solve — there is no time in it, and nothing is travelling along those arrows. They show the velocity field <em>at this instant</em>, for a density anomaly frozen where you painted it. Their length scale is arbitrary too, since viscosity enters only as a ratio; only the <strong>pattern</strong> means anything. &#40;It is also the slowest thing in the notebook, so it is off by default.&#41;</p>\n</div>\n<p>Three things to try, in order — each is one of the three &quot;aha&quot; moments:</p>\n<ol>\n<li><p><strong>The sign is wrong from the start.</strong> Press <strong>Shallow</strong> &#40;≈580 km&#41;. You have placed <em>dense</em> material, and the geoid above it is a <strong>low</strong> &#40;≈ <strong>−4.5 m</strong>&#41;, not a high. Press <strong>Deep</strong> &#40;≈2600 km&#41;: still a low &#40;≈ <strong>−0.8 m</strong>&#41;, just weaker. In a uniform-viscosity mantle the naive expectation fails at <em>every</em> depth.</p>\n</li>\n<li><p><strong>Why</strong>: tick <strong>&quot;direct effect only&quot;</strong>. The boundary terms switch off and the geoid jumps to ≈ <strong>&#43;15.6 m</strong> — big and positive, the naive answer. Untick it and the deflected boundaries drag it back down to ≈ −4.5 m. The breakdown table further down shows the arithmetic: direct <strong>&#43;15.6</strong>, surface <strong>−19.6</strong>, CMB <strong>−0.5</strong>.</p>\n</li>\n<li><p><strong>Layering is what creates a sign flip.</strong> Drag the <strong>viscosity ratio</strong> slider. A uniform mantle has no zero-crossing at all; stiffen the lower mantle enough and one <em>appears</em>, so deep anomalies begin producing geoid <strong>highs</strong>. That is the punchline, and we come back to it below.</p>\n</li>\n</ol>\n<p>You can paint <strong>both signs</strong>. Pick <strong>dense</strong> &#40;<span class=\"tex\">$\\delta\\rho &gt; 0$</span>, blue — cold slab material&#41; or <strong>light</strong> &#40;<span class=\"tex\">$\\delta\\rho &lt; 0$</span>, red — a hot plume&#41; with the brush selector, and mix them freely.</p>\n<div class=\"admonition note\"><p class=\"admonition-title\">Two colour scales — deliberately different palettes</p><p>The globe shows two different quantities, and each follows its own community&#39;s convention:</p>\n<ul>\n<li><p><strong>surface — the geoid</strong>: warm ↔ cool. Yellow deepening to red for highs, light blue deepening to indigo for lows. This is the usual <strong>geodesy</strong> convention.</p>\n</li>\n<li><p><strong>interior — density</strong>: blue ↔ red against dark mantle. Blue for dense, red for light, matching the <strong>seismic tomography</strong> convention where blue is cold and fast.</p>\n</li>\n</ul>\n<p>Note that the two conventions <strong>disagree about sign</strong>: warm means <em>positive</em> for the geoid, but red means <em>negative</em> for density. That is a historical accident of two fields, not physics. Because of it the ramps use visibly different palettes rather than the same pair of endpoint colours — otherwise one red would mean &quot;geoid high&quot; outside and &quot;light material&quot; inside, which is worse than either convention alone.</p>\n<p>Neither colouring carries physical meaning of its own. If the hues ever confuse you, ignore them and read the peak values printed in the legend.</p>\n</div>\n<p>Because the Stokes problem is <em>linear</em>, the geoid of a combined field is exactly the sum of the geoids of its parts — so a light anomaly at a given depth produces precisely the mirror image of a dense one, and two equal-and-opposite anomalies in the same place cancel to nothing. Worth testing: paint a dense blob, then a light one on top of it, and watch the geoid collapse.</p>\n<div class=\"admonition note\"><p class=\"admonition-title\">About the exaggeration</p><p>The real boundary deflections are a few kilometres on a 6371 km globe — invisible at this scale — so they are drawn exaggerated. But the surface and the CMB share <strong>one</strong> scale factor, so the ratio between the two orange curves is honest: when the surface deflection looks much bigger than the CMB&#39;s, it really is. Both peak values are printed in the legend in metres. &#40;The geoid colouring is separately normalised to its own peak, also printed, since it is a different quantity in different units.&#41;</p>\n</div>\n</div>"""

