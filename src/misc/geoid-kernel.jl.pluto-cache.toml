text_representation = """<div class=\"pluto-docs-binding\">\n<span id=\"flow_slice\">flow_slice</span>\n<div class=\"markdown\"><pre><code class=\"language-julia\">flow_slice&#40;result, layers, φ_face; nr&#61;18, nθ&#61;26&#41;</code></pre>\n<p>Instantaneous velocity field on a meridional slice at longitude <code>φ_face</code>, for display on a cut face. Returns <code>&#40;rr, θθ, ur, uθ&#41;</code> on a coarse grid suitable for drawing arrows.</p>\n<p>Velocities are in arbitrary units — viscosity enters the Stokes problem only as a ratio, so the <em>pattern</em> of the flow is meaningful but its absolute magnitude is not.</p>\n\n\n</div>\n</div>\n"""

