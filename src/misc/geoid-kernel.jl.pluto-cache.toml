runtime_ns = 6009375
text_representation = """<div class=\"pluto-docs-binding\">\n<span id=\"assoc_legendre\">assoc_legendre</span>\n<div class=\"markdown\"><pre><code class=\"language-julia\">assoc_legendre&#40;x, lmax&#41;</code></pre>\n<p>Fully-normalised associated Legendre functions <span class=\"tex\">$P_\\ell^m&#40;x&#41;$</span> for all <span class=\"tex\">$\\ell &#61; 0 \\ldots \\ell_&#123;max&#125;$</span>, <span class=\"tex\">$m &#61; 0 \\ldots \\ell$</span>, returned as <code>P&#91;ℓ&#43;1&#93;&#91;m&#43;1&#93;</code>.</p>\n<p>These are what let an anomaly vary in <strong>longitude</strong> as well as colatitude. The normalisation is chosen so that <span class=\"tex\">$\\int_&#123;-1&#125;^&#123;1&#125; &#91;P_\\ell^m&#93;^2\\,dx &#61; 2$</span>, which makes the <span class=\"tex\">$m &#61; 0$</span> column equal to <span class=\"tex\">$\\sqrt&#123;2\\ell&#43;1&#125;\\,P_\\ell$</span> — i.e. the plain Legendre polynomials of the axisymmetric case, rescaled.</p>\n<p>Built from the standard sectoral seed plus the two-term recurrence in <span class=\"tex\">$\\ell$</span>.</p>\n\n\n</div>\n</div>\n"""

