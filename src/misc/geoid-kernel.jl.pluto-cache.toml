text_representation = """<div class=\"markdown\"><h3 id=\"Verifying-the-building-blocks\">Verifying the building blocks</h3>\n<p>Before trusting any of this, we check the four solutions against the <strong>original</strong> equations. Every quantity is a pure power of <span class=\"tex\">$r$</span>, so each equation collapses to an algebraic identity on the coefficients — we can test it exactly, with no finite differences.</p>\n<p>The three equations are incompressibility, radial momentum, and colatitudinal momentum:</p>\n<pre><code>U&#39; &#43; 2U/r - L·V/r                              &#61; 0\nη&#91;U&#39;&#39; &#43; 2U&#39;/r - &#40;2&#43;L&#41;U/r² &#43; 2L·V/r²&#93; - P&#39;      &#61; 0\nη&#91;V&#39;&#39; &#43; 2V&#39;/r - L·V/r² &#43; 2U/r²&#93;    - P/r       &#61; 0</code></pre>\n</div>"""

