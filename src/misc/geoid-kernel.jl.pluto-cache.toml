text_representation = """<div class=\"markdown\"><p>At <span class=\"tex\">$\\theta &#61; 67.8°$</span>, <span class=\"tex\">$\\varphi &#61; 53.2°$</span> — the peak of the geoid:</p>\n<table><tr><th align=\"right\">contribution</th><th align=\"right\">value</th><th align=\"left\"></th></tr><tr><td align=\"right\">① the anomaly itself &#40;direct&#41;</td><td align=\"right\"><span class=\"tex\">$&#43;15.59\\ \\mathrm&#123;m&#125;$</span></td><td align=\"left\">██████████████</td></tr><tr><td align=\"right\">② the deflected surface</td><td align=\"right\"><span class=\"tex\">$-19.56\\ \\mathrm&#123;m&#125;$</span></td><td align=\"left\">██████████████████</td></tr><tr><td align=\"right\">③ the deflected CMB</td><td align=\"right\"><span class=\"tex\">$-0.54\\ \\mathrm&#123;m&#125;$</span></td><td align=\"left\">█</td></tr><tr><td align=\"right\"><strong>net geoid</strong></td><td align=\"right\"><strong><span class=\"tex\">$-4.51\\ \\mathrm&#123;m&#125;$</span></strong></td><td align=\"left\"></td></tr></table>\n<div class=\"admonition correct\"><p class=\"admonition-title\">The boundaries won</p><p>The anomaly&#39;s own pull &#40;①&#41; is <strong><span class=\"tex\">$&#43;15.59\\ \\mathrm&#123;m&#125;$</span></strong>, but the two deflected boundaries together contribute <strong><span class=\"tex\">$-20.1\\ \\mathrm&#123;m&#125;$</span></strong> — enough to <em>flip the sign</em>. This is the whole lesson: what you measure at the surface has the opposite sign from the anomaly that caused it.</p>\n</div>\n</div>"""

