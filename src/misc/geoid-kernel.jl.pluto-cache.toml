text_representation = """<div class=\"markdown\"><h3 id=\"The-Legendre-spectrum-of-what-you-painted\">The Legendre spectrum of what you painted</h3>\n<p>The one conventional plot in this notebook. It shows how the anomaly you drew decomposes into degrees — and, crucially, the <strong>geoid contribution of each degree separately</strong>. Notice that different degrees can contribute with <strong>opposite signs at the same place</strong>, because each degree has its own kernel with its own zero-crossing depth.</p>\n</div>"""

[cells.4b2e1db7-2b0c-4d6e-9fea-485960718294]
