text_representation = """<div class=\"markdown\"><div class=\"admonition correct\"><p class=\"admonition-title\">Validation 2 passed — all seven physical checks</p><ul>\n<li><p><strong>Direct-only kernel</strong> is positive and monotonic everywhere ✓ &#40;no boundaries ⇒ no flip&#41;</p>\n</li>\n<li><p><strong>Free-slip boundary conditions</strong> satisfied to machine zero at surface and CMB ✓</p>\n</li>\n<li><p><strong>A dense anomaly depresses <em>both</em> boundaries</strong> at every depth ✓ — one convection cell cannot push the surface down while pulling the CMB up</p>\n</li>\n<li><p><strong>Compensation limit</strong> ✓ — a load resting on either boundary is cancelled by that boundary&#39;s own deflection, to better than 1&#37;. <em>This is the check that catches a flipped boundary sign: with the wrong sign the two terms add instead of cancelling.</em></p>\n</li>\n<li><p><strong>Hager &amp; Richards &#40;1989&#41; Figure 2 normalisation</strong> ✓ — their <span class=\"tex\">$A^\\ell$</span> and <span class=\"tex\">$C^\\ell$</span> displaced-mass kernels both come out in <span class=\"tex\">$&#91;0,1&#93;$</span>, with <span class=\"tex\">$A^\\ell \\to 1$</span> at the surface and <span class=\"tex\">$C^\\ell \\to 1$</span> at the CMB, exactly as the figure shows</p>\n</li>\n<li><p><strong>Published-kernel reproduction</strong> ✓ — the <span class=\"tex\">$\\ell &#61; 2$</span> geoid kernel for their model <strong>WL</strong> changes sign in the mid-mantle, reproducing the <span class=\"tex\">$G^\\ell$</span> panel of Figure 2</p>\n</li>\n<li><p><strong>The interior flow vanishes at both free-slip boundaries</strong> and its sign agrees with the surface deflection ✓ — downwelling goes with a depressed surface, as it must</p>\n</li>\n</ul>\n<div class=\"admonition note\"><p class=\"admonition-title\">Which model is the published check?</p><p>Hager &amp; Richards plot kernels for <strong>layered</strong> models only &#40;WL, WC, CL&#41; — the paper contains no uniform-viscosity kernel. So model <strong>WL</strong> is our comparison, not the isoviscous case. The isoviscous kernel here is this notebook&#39;s own baseline: useful for isolating the mechanism, but not a published result, and &#40;see below&#41; it does <strong>not</strong> change sign.</p>\n</div>\n</div>\n</div>"""

