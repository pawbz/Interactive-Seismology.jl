text_representation = """<div class=\"pluto-docs-binding\">\n<span id=\"dynamic_topography\">dynamic_topography</span>\n<div class=\"markdown\"><pre><code class=\"language-julia\">dynamic_topography&#40;result, layers&#41;</code></pre>\n<p>Surface and CMB dynamic topography <strong>maps</strong> <span class=\"tex\">$h&#40;\\theta,\\varphi&#41;$</span> for a painted field, built exactly like the geoid but using the boundary deflections rather than the geoid response. Same decomposition, same <span class=\"tex\">$m$</span>-independent radial solve per degree.</p>\n\n\n</div>\n</div>\n"""

