text_representation = """<div class=\"markdown\"><p><strong>Incompressibility</strong> — the mantle conserves volume as it flows:</p>\n<p class=\"tex\">$$\\nabla \\cdot \\mathbf&#123;v&#125; &#61; 0$$</p>\n<p><strong>Force balance</strong> — viscous stress divergence balances the buoyancy of the anomaly:</p>\n<p class=\"tex\">$$\\nabla \\cdot \\sigma &#61; \\delta\\rho \\, g \\, \\hat&#123;r&#125;$$</p>\n<div class=\"admonition danger\"><p class=\"admonition-title\">This is instantaneous — there is no time in these equations</p><p>Look carefully: there is no <span class=\"tex\">$\\partial/\\partial t$</span> anywhere. We are <strong>not</strong> running a convection simulation. The anomaly is <em>frozen</em> where you paint it, and we perform exactly <strong>one linear solve</strong> for the flow it drives at that instant.</p>\n<p>This trips up almost everyone the first time. The blob does not sink as you watch. We are asking &quot;what flow, and what geoid, does this configuration produce <em>right now</em>?&quot; — a snapshot, not a movie.</p>\n</div>\n<p><strong>Dynamic topography</strong> — the flow pushes on each boundary, and the boundary deflects until its own weight balances that push. Hager &amp; Richards &#40;1989&#41; write this as a <strong>jump</strong> in the radial normal stress across the boundary:</p>\n<p class=\"tex\">$$\\left&#91;\\tau_&#123;rr&#125;\\right&#93;^&#123;&#43;&#125;_&#123;-&#125; &#61; \\Delta\\rho \\, g \\, h$$</p>\n<p>with <span class=\"tex\">$\\Delta\\rho$</span> the density contrast <strong>across</strong> that boundary: <span class=\"tex\">$\\rho_m$</span> at the surface &#40;rock against air&#41; and <span class=\"tex\">$\\rho_c - \\rho_m$</span> at the CMB &#40;iron against rock&#41;.</p>\n<div class=\"admonition warning\"><p class=\"admonition-title\">The bracket matters — this is where sign errors hide</p><p>Read outward, the surface jump goes mantle → vacuum but the CMB jump goes core → mantle, so the two contrasts have <strong>opposite orientation</strong>. Applying the same sign at both boundaries — an easy slip, and one this notebook made in an earlier version — produces a dense anomaly that depresses the surface while <em>raising</em> the CMB. No single convection cell can do that.</p>\n<p>We pin the convention with a physical limit instead of trusting the algebra: a load resting on a boundary must be almost exactly cancelled by that boundary&#39;s own deflection. That is the <code>check_compensation</code> test below, and it is what caught the error.</p>\n</div>\n<p><strong>The geoid</strong> is then the sum over all three mass contributions, upward-continued to the surface. For a thin mass sheet of surface density <span class=\"tex\">$\\sigma$</span> at radius <span class=\"tex\">$s$</span>:</p>\n<p class=\"tex\">$$N_\\ell &#61; \\frac&#123;4\\pi G a&#125;&#123;g&#40;2\\ell&#43;1&#41;&#125; \\, \\sigma \\, \\left&#40;\\frac&#123;s&#125;&#123;a&#125;\\right&#41;^&#123;\\ell&#43;2&#125;$$</p>\n</div>"""

