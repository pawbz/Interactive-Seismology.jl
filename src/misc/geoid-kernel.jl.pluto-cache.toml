text_representation = """<div class=\"markdown\"><h2 id=\"The-Geoid-Kernel\">The Geoid Kernel</h2>\n<p>Now we assemble the three contributions. Place a thin sheet of density anomaly at radius <span class=\"tex\">$s$</span> and ask what geoid it produces at the surface.</p>\n<p><strong>Boundary conditions.</strong> Both the surface and the CMB are <em>free-slip</em>: no shear traction &#40;<span class=\"tex\">$\\tau_&#123;r\\theta&#125; &#61; 0$</span>&#41;, and no flow through the boundary &#40;<span class=\"tex\">$u_r &#61; 0$</span>&#41;. The boundary does not physically move in the solve — instead the normal stress <span class=\"tex\">$\\tau_&#123;rr&#125;$</span> that builds up against it tells us how far it <em>would</em> deflect, which is the dynamic topography.</p>\n<p><strong>The load.</strong> Crossing the loaded radius, the normal stress jumps by the weight of the sheet:</p>\n<p class=\"tex\">$$y&#40;s^&#43;&#41; &#61; y&#40;s^-&#41; &#43; &#91;\\,0,\\; 0,\\; -\\delta\\rho\\, g,\\; 0\\,&#93;^T$$</p>\n<p>This sign is worth checking rather than trusting: a <em>dense</em> sheet must <strong>depress</strong> the surface. We verify exactly that below.</p>\n</div>"""

