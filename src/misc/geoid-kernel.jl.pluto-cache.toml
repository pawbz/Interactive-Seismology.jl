text_representation = """<div class=\"markdown\"><h2 id=\"Layer-3:-From-a-Painted-Picture-to-a-Geoid\">Layer 3: From a Painted Picture to a Geoid</h2>\n<p>The globe gives us <span class=\"tex\">$\\delta\\rho&#40;r,\\theta,\\varphi&#41;$</span> on a grid. To use the kernels we need its <strong>spherical-harmonic coefficients</strong> at each radius. Using real harmonics, so that everything stays real-valued:</p>\n<p class=\"tex\">$$\\delta\\rho&#40;r,\\theta,\\varphi&#41; &#61; \\sum_&#123;\\ell&#125;\\sum_&#123;m&#61;0&#125;^&#123;\\ell&#125; P_\\ell^m&#40;\\cos\\theta&#41;\n\\left&#91;\\,C_&#123;\\ell m&#125;&#40;r&#41;\\cos m\\varphi &#43; S_&#123;\\ell m&#125;&#40;r&#41;\\sin m\\varphi\\,\\right&#93;$$</p>\n<p>Each coefficient comes from a Gauss–Legendre quadrature in <span class=\"tex\">$\\cos\\theta$</span> and a plain sum in <span class=\"tex\">$\\varphi$</span>. Then — and this is the step that makes the whole thing cheap — we apply the <strong>same</strong> radial kernel <span class=\"tex\">$K_\\ell&#40;r&#41;$</span> to every order <span class=\"tex\">$m$</span> of a given degree, and sum back up:</p>\n<p class=\"tex\">$$N&#40;\\theta,\\varphi&#41; &#61; \\sum_&#123;\\ell&#125;\\sum_&#123;m&#61;0&#125;^&#123;\\ell&#125; P_\\ell^m&#40;\\cos\\theta&#41;\n\\left&#91;\\,\\tilde&#123;C&#125;_&#123;\\ell m&#125;\\cos m\\varphi &#43; \\tilde&#123;S&#125;_&#123;\\ell m&#125;\\sin m\\varphi\\,\\right&#93;,\n\\qquad\n\\tilde&#123;C&#125;_&#123;\\ell m&#125; &#61; \\int K_\\ell&#40;r&#41;\\,C_&#123;\\ell m&#125;&#40;r&#41;\\,dr$$</p>\n<p>We roll the machinery by hand — a three-term recurrence for the associated Legendre functions and a Newton solve for the Gauss–Legendre nodes. It needs no extra packages, and you can read every step.</p>\n<p>If you set every <span class=\"tex\">$m \\neq 0$</span> coefficient to zero you recover the axisymmetric case exactly; the validation below checks precisely that.</p>\n</div>"""

