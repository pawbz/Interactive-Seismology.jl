text_representation = """<div class=\"pluto-docs-binding\">\n<span id=\"propagator\">propagator</span>\n<div class=\"markdown\"><pre><code class=\"language-julia\">propagator&#40;r₂, r₁, η, ℓ&#41;</code></pre>\n<p>Maps the state vector from radius <code>r₁</code> to <code>r₂</code> inside a layer of constant viscosity. Because the columns of <code>Ymat</code> span the solution space, <code>Y&#40;r₂&#41; Y&#40;r₁&#41;⁻¹</code> <em>is</em> the propagator — no hand-written matrix entries, hence no place for a transcription error to hide.</p>\n\n\n</div>\n</div>\n"""

