text_representation = """<div class=\"pluto-docs-binding\">\n<span id=\"Ymat\">Ymat</span>\n<div class=\"markdown\"><pre><code class=\"language-julia\">Ymat&#40;r, η, ℓ&#41;</code></pre>\n<p>Matrix whose four columns are the fundamental solutions at radius <code>r</code>. Radii are scaled by the Earth radius so that <code>r^ℓ</code> stays near unity — without this the columns overflow and the matrix becomes badly conditioned at high degree.</p>\n\n\n</div>\n</div>\n"""

