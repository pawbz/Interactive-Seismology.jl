text_representation = """<div class=\"pluto-docs-binding\">\n<span id=\"synthesize_geoid\">synthesize_geoid</span>\n<div class=\"markdown\"><pre><code class=\"language-julia\">synthesize_geoid&#40;blobs, layers; direct_only&#61;false&#41;</code></pre>\n<p>The full Layer-3 pipeline, now in three dimensions.</p>\n<p>For each degree <span class=\"tex\">$\\ell$</span> and order <span class=\"tex\">$m$</span> we project the painted density field onto the real spherical harmonics, apply the <strong>same</strong> radial kernel <span class=\"tex\">$K_\\ell&#40;r&#41;$</span> — it does not depend on <span class=\"tex\">$m$</span> — and sum the result back onto a <span class=\"tex\">$&#40;\\theta,\\varphi&#41;$</span> grid.</p>\n<p>Returns the geoid map <code>N&#91;θ,φ&#93;</code>, the grids, the per-degree contributions &#40;summed over <span class=\"tex\">$m$</span>&#41;, and the density field itself for display.</p>\n\n\n</div>\n</div>\n"""

