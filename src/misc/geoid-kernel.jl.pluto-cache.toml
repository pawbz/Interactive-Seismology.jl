text_representation = """<div class=\"pluto-docs-binding\">\n<span id=\"blobs_to_field\">blobs_to_field</span>\n<div class=\"markdown\"><pre><code class=\"language-julia\">blobs_to_field&#40;blobs, rgrid, μgrid, φgrid&#41;</code></pre>\n<p>Build <span class=\"tex\">$\\delta\\rho&#40;r,\\theta,\\varphi&#41;$</span> from painted blobs. Each blob is <code>&#40;r_centre, θ_centre, φ_centre, amplitude, angular_width&#41;</code> and is a Gaussian cap in <em>angular distance on the sphere</em> — so it is genuinely localized in both colatitude and longitude, not a ring.</p>\n<p>The angular width is floored at <a href=\"@ref\"><code>BLOB_WIDTH_MIN</code></a>: a cap narrower than the expansion can resolve produces Gibbs ringing, which would show up as spurious wobbles in the geoid.</p>\n\n\n</div>\n</div>\n"""

