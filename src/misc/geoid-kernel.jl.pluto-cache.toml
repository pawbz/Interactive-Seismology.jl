text_representation = """<div class=\"markdown\"><h2 id=\"Assumptions-—-What-This-Notebook-Does-and-Does-Not-Do\">Assumptions — What This Notebook Does and Does Not Do</h2>\n<p>Being explicit about this matters more than the pretty pictures.</p>\n<div class=\"admonition warning\"><p class=\"admonition-title\">Read before drawing conclusions</p><ul>\n<li><p><strong>Radial viscosity only — this is the one that really binds.</strong> <span class=\"tex\">$\\eta$</span> varies with depth, never sideways. The <em>density</em> is now fully three-dimensional, but the moment viscosity varies laterally the whole approach collapses: degrees stop separating, the kernel <span class=\"tex\">$K_\\ell&#40;r&#41;$</span> ceases to exist as a concept, and you need a genuine 3-D solver &#40;CitcomS, ASPECT&#41;. Real mantle has strong lateral viscosity contrasts — cold stiff slabs, hot weak plumes — so treat what you see here as the <em>mechanism</em>, never as a prediction for any specific region.</p>\n</li>\n<li><p><strong>Truncated at <span class=\"tex\">$\\ell_&#123;max&#125; &#61; 20$</span>.</strong> Structure finer than roughly 2000 km across is not represented, which is why the brush enforces a minimum anomaly size. This is a resolution limit, not a physical assumption — but it does mean you cannot paint a narrow slab.</p>\n</li>\n<li><p><strong>Instantaneous.</strong> One linear solve. No time-stepping, no evolution — the anomaly stays where you paint it.</p>\n</li>\n<li><p><strong>Self-gravitation neglected.</strong> The deflected boundaries and the anomaly do not pull on each other. This shifts long-wavelength amplitudes by roughly 10–20&#37; and can move the crossing depth somewhat, but it does not change the sign structure that is the lesson here.</p>\n</li>\n<li><p><strong>Free-slip boundaries, no lithosphere.</strong> No elastic plate, no rigid lid.</p>\n</li>\n</ul>\n</div>\n<div class=\"admonition tip\"><p class=\"admonition-title\">For quantitative work, use a real code</p><p>This notebook is built for <strong>intuition</strong>. For research, use <strong>HC</strong> &#40;Becker et al.&#41; for propagator-matrix geoid calculations, or <strong>ASPECT</strong> / <strong>CitcomS</strong> for full 3-D convection. Benchmarks show propagator-matrix codes and ASPECT agree to about 1&#37; out to degree ~15, which is exactly why this simple approach is trustworthy <em>at long wavelengths</em> — and why we truncate rather than chasing high degrees.</p>\n</div>\n</div>"""

