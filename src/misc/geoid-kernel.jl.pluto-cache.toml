text_representation = """<div class=\"markdown\"><h3 id=\"Where-the-Geoid-Comes-From-—-the-Arithmetic\">Where the Geoid Comes From — the Arithmetic</h3>\n<p>The globe shows you <em>that</em> the sign flips. This shows you <em>why</em>. Values are read at the point where the geoid is largest, so they describe the strongest feature you have painted.</p>\n<p>Watch the ratio between ① and ②: the anomaly&#39;s own pull against the depression it causes. Whichever exceeds the other sets the sign, and moving the anomaly in depth is what tips it.</p>\n</div>"""

[cells.18fbea8e-f809-4a3b-6c37-485960718293]
