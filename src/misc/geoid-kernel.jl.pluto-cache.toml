text_representation = """<div class=\"pluto-docs-binding\">\n<span id=\"flow_profile\">flow_profile</span>\n<div class=\"markdown\"><pre><code class=\"language-julia\">flow_profile&#40;s, ℓ, layers, sample_radii&#41;</code></pre>\n<p>Instantaneous flow driven by a unit density sheet at radius <code>s</code>, degree <code>ℓ</code>, evaluated at each radius in <code>sample_radii</code>.</p>\n<p>Returns <code>&#40;U, V&#41;</code>: the radial and colatitudinal velocity scalars, where the physical velocity is <span class=\"tex\">$u_r &#61; U\\,Y_\\ell$</span> and <span class=\"tex\">$u_\\theta &#61; V\\,\\partial_\\theta Y_\\ell$</span>.</p>\n<p>This is the <em>same</em> solve as <a href=\"@ref\"><code>geoid_response</code></a> — we simply keep the interior state instead of discarding everything but the boundaries. Viscosity enters only as a ratio, so these velocities carry an arbitrary overall scale; only their <strong>pattern</strong> is meaningful.</p>\n<div class=\"admonition note\"><p class=\"admonition-title\">Sign convention</p><p>The velocity components of the propagator state vector carry the <em>opposite</em> sign convention from the stress components, an artefact of how the angular factors are defined. That never matters for the geoid, which is built from stresses — but it does matter for drawing arrows, so we negate here. The convention is pinned to the already-validated fact that a dense load <strong>depresses</strong> the surface &#40;<code>h_surf &lt; 0</code>&#41;: with this negation, <code>u_r</code> and <code>h_surf</code> agree in sign, so downwelling goes with a depressed surface as it physically must.</p>\n</div>\n\n\n</div>\n</div>\n"""

