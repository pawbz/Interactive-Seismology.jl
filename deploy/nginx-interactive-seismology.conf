server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    index index.html;

    location = /~interactive-seismology {
        return 301 /~interactive-seismology/;
    }

    location ^~ /~interactive-seismology/staterequest/ {
        proxy_pass http://127.0.0.1:1234/staterequest/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /~interactive-seismology/bondconnections/ {
        proxy_pass http://127.0.0.1:1234/bondconnections/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location /~interactive-seismology/ {
        rewrite ^/~interactive-seismology/(.*)$ /$1 break;
        root /var/lib/interactive-seismology/_site-serving;
        try_files $uri $uri/index.html =404;
    }

    location = / {
        return 302 /~interactive-seismology/;
    }
}
